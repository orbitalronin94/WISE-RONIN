name: Batch-admit Kukedlc Spanish persona profiles

on:
  push:
    branches:
      - corpus-v3-2-100mb-acceptance
    paths:
      - "scripts/admit_kukedlc_personas.py"
      - "scripts/build_corpus_100mb_blocks.py"
      - "tests/test_admit_kukedlc_personas.py"
      - ".github/workflows/admit-kukedlc-personas.yml"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "0 = process the full pinned train split"
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  batch-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3.0,<5" "huggingface_hub>=0.26" pyarrow
      - name: Test source policy and incremental builder
        run: |
          python -m py_compile scripts/admit_kukedlc_personas.py scripts/build_corpus_100mb_blocks.py
          python tests/test_admit_kukedlc_personas.py
          python tests/test_corpus_100mb_version_chain.py
      - name: Download frozen v3.1 base
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v3-1-candidate-45348639929
          repository: \${{ github.repository }}
          run-id: 45348639929
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: artifacts/v3-1
      - name: Verify frozen v3.1 JSONL
        run: |
          BASE="$(find artifacts/v3-1 -type f -name 'spanish-v3-1-candidate.jsonl' -print -quit)"
          test -n "$BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "93e8c997535ca2bdc5215937e3ada6bc21e39a89d3131daa71c93b605582cd13  $BASE" | sha256sum --check
      - name: Download previous cumulative corpus
        uses: actions/download-artifact@v4
        with:
          name: lumen-corpus-v3-2-mpersonas-45368910087
          repository: \${{ github.repository }}
          run-id: 45368910087
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: artifacts/previous
      - name: Prepare cumulative chain and dedup database
        run: |
          mkdir -p artifacts/corpus-v3-2-chain
          cp -a artifacts/previous/corpus-v3-2-mpersonas/. artifacts/corpus-v3-2-chain/
          test -f artifacts/corpus-v3-2-chain/v3-2-chain-dedup.sqlite
      - name: Batch-normalize Kukedlc persona descriptions
        run: |
          python scripts/admit_kukedlc_personas.py \
            --output artifacts/kukedlc-personas-auto-approved.jsonl \
            --report artifacts/kukedlc-personas-admission-report.json \
            --max-rows "\${{ inputs.max_rows || '0' }}"
      - name: Append new immutable corpus versions
        run: |
          python scripts/build_corpus_100mb_blocks.py \
            --input artifacts/kukedlc-personas-auto-approved.jsonl \
            --base-jsonl "$BASE" \
            --output-dir artifacts/corpus-v3-2-chain \
            --parent-version v3.2.002 \
            --start-version 3 \
            --dedup-db artifacts/corpus-v3-2-chain/v3-2-chain-dedup.sqlite \
            --allow-auto-approved
      - name: Upload cumulative corpus and admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-corpus-v3-2-through-kukedlc-\${{ github.run_id }}
          path: |
            artifacts/kukedlc-personas-admission-report.json
            artifacts/corpus-v3-2-chain/*
          if-no-files-found: warn
          retention-days: 90
