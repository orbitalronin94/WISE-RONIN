name: Batch-admit context-grounded refugee-law QA

on:
  push:
    branches:
      - corpus-v3-2-100mb-acceptance
    paths:
      - "scripts/admit_legal_refugee_qa.py"
      - "scripts/build_corpus_100mb_blocks.py"
      - "tests/test_admit_legal_refugee_qa.py"
      - ".github/workflows/admit-legal-refugee-qa.yml"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "0 = process the full pinned train split"
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  batch-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3.0,<5" "huggingface_hub>=0.26" pyarrow
      - name: Test legal QA policy and incremental builder
        run: |
          python -m py_compile scripts/admit_legal_refugee_qa.py scripts/build_corpus_100mb_blocks.py
          python tests/test_admit_legal_refugee_qa.py
          python tests/test_corpus_100mb_version_chain.py
      - name: Download previous cumulative corpus
        uses: actions/download-artifact@v4
        with:
          name: lumen-corpus-v3-2-through-kukedlc-45369357018
          repository: ${{ github.repository }}
          run-id: 45369357018
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/previous
      - name: Prepare cumulative chain and verify inherited dedup index
        run: |
          mkdir -p artifacts/corpus-v3-2-chain
          cp -a artifacts/previous/corpus-v3-2-chain/. artifacts/corpus-v3-2-chain/
          test -f artifacts/corpus-v3-2-chain/v3-2-chain-dedup.sqlite
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path("artifacts/corpus-v3-2-chain")
          chain = json.loads((root / "lumen-corpus-v3-2-version-chain.json").read_text())
          assert [x["version"] for x in chain["versions"]] == ["v3.2.001", "v3.2.002", "v3.2.003"]
          db = sqlite3.connect(root / "v3-2-chain-dedup.sqlite")
          base_rows = db.execute("SELECT COUNT(*) FROM accepted WHERE version='v3.1'").fetchone()[0]
          total_rows = db.execute("SELECT COUNT(*) FROM accepted").fetchone()[0]
          assert base_rows >= 197000, base_rows
          assert total_rows >= base_rows + 71484, (base_rows, total_rows)
          print({"frozen_v3_1_hashes": base_rows, "dedup_hashes_total": total_rows})
          PY
          : > artifacts/frozen-base-already-indexed.jsonl
          echo "BASE=artifacts/frozen-base-already-indexed.jsonl" >> "$GITHUB_ENV"
      - name: Batch-normalize contextual legal QA
        run: |
          python scripts/admit_legal_refugee_qa.py \
            --output artifacts/legal-refugee-qa-auto-approved.jsonl \
            --report artifacts/legal-refugee-qa-admission-report.json \
            --max-rows "${{ inputs.max_rows || '0' }}"
      - name: Append new immutable corpus versions
        run: |
          python scripts/build_corpus_100mb_blocks.py \
            --input artifacts/legal-refugee-qa-auto-approved.jsonl \
            --base-jsonl "$BASE" \
            --output-dir artifacts/corpus-v3-2-chain \
            --parent-version v3.2.003 \
            --start-version 4 \
            --dedup-db artifacts/corpus-v3-2-chain/v3-2-chain-dedup.sqlite \
            --allow-auto-approved
      - name: Upload cumulative corpus and admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-corpus-v3-2-through-legal-qa-${{ github.run_id }}
          path: |
            artifacts/legal-refugee-qa-admission-report.json
            artifacts/corpus-v3-2-chain/*
          if-no-files-found: warn
          retention-days: 90
