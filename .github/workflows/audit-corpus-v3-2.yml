name: Audit Spanish corpus v3.2 sources

on:
  push:
    branches:
      - corpus-v3-2-audit-identity
  workflow_dispatch:
    inputs:
      max_rows_per_split:
        description: "0 = stream every row in each eligible train split"
        required: true
        default: "0"
        type: string
      sample_per_split:
        description: "Human-review excerpts per source split"
        required: true
        default: "100"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: corpus-v3-2-audit-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3.0,<5" "huggingface_hub>=0.26" pyarrow
      - name: Download frozen v3.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v3-1-candidate-45348639929
          repository: ${{ github.repository }}
          run-id: 45348639929
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/v3-1
      - name: Verify base artifact and record provenance
        run: |
          test -n "$(find artifacts/v3-1 -type f -name 'spanish-v3-1-candidate.jsonl' -print -quit)"
          sha256sum "$(find artifacts/v3-1 -type f -name 'spanish-v3-1-candidate.jsonl' -print -quit)"
      - name: Stream eligible source train splits
        run: |
          python scripts/audit_hf_corpus_v3_2.py \
            --registry data/corpus_v3_2_sources.json \
            --base-jsonl "$(find artifacts/v3-1 -type f -name 'spanish-v3-1-candidate.jsonl' -print -quit)" \
            --db artifacts/corpus-v3-2-audit.sqlite \
            --output artifacts/corpus-v3-2-audit-report.json \
            --max-rows-per-split "${{ inputs.max_rows_per_split || '0' }}" \
            --sample-per-split "${{ inputs.sample_per_split || '100' }}"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-v3-2-source-audit-${{ github.run_id }}
          path: |
            artifacts/corpus-v3-2-audit-report.json
            artifacts/corpus-v3-2-audit.sqlite
          if-no-files-found: warn
          retention-days: 30
