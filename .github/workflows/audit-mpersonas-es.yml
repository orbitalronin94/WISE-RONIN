name: Targeted mPersonas Spanish corpus audit

on:
  push:
    branches:
      - corpus-v3-2-100mb-acceptance
    paths:
      - "scripts/audit_hf_corpus_v3_2.py"
      - ".github/workflows/audit-mpersonas-es.yml"
  workflow_dispatch:
    inputs:
      max_rows_per_split:
        description: "0 = scan every row in the Spanish train split"
        required: true
        default: "0"
        type: string
      sample_per_split:
        description: "Metadata-only review samples"
        required: true
        default: "100"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3.0,<5" "huggingface_hub>=0.26" pyarrow
      - name: Download frozen v3.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v3-1-candidate-45348639929
          repository: ${{ github.repository }}
          run-id: 45348639929
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/v3-1
      - name: Verify frozen base
        run: |
          BASE="$(find artifacts/v3-1 -type f -name 'spanish-v3-1-candidate.jsonl' -print -quit)"
          test -n "$BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          sha256sum "$BASE"
      - name: Compile targeted audit
        run: python -m py_compile scripts/audit_hf_corpus_v3_2.py
      - name: Stream pinned Spanish mPersonas train config
        run: |
          python scripts/audit_hf_corpus_v3_2.py \
            --registry data/corpus_v3_2_sources.json \
            --base-jsonl "$BASE" \
            --db artifacts/mpersonas-es-audit.sqlite \
            --output artifacts/mpersonas-es-audit-report.json \
            --only-sources BSC-LT/m-personas \
            --max-rows-per-split "${{ inputs.max_rows_per_split || '0' }}" \
            --sample-per-split "${{ inputs.sample_per_split || '100' }}"
      - name: Upload metadata-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpersonas-es-targeted-audit-${{ github.run_id }}
          path: |
            artifacts/mpersonas-es-audit-report.json
            artifacts/mpersonas-es-audit.sqlite
          if-no-files-found: warn
          retention-days: 30
