name: RONIN-LUMEN seven CPU optimization hypotheses

on:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_cpu_hypotheses.py"
      - ".github/workflows/benchmark-cpu-hypotheses.yml"

permissions:
  contents: read

concurrency:
  group: ronin-lumen-cpu-hypotheses-${{ github.sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: "${{ matrix.profile }} — matched CPU throughput"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - control_combined
          - compile_default
          - compile_reduce_overhead
          - cpu_bfloat16
          - fused_adamw
          - zero_grad_reuse
          - flush_denormal
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_PROC_BIND: "close"
      OMP_PLACES: "cores"
      KMP_AFFINITY: "granularity=fine,compact,1,0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run three repeated matched measurements
        run: |
          python scripts/benchmark_cpu_hypotheses.py \
            --profile "${{ matrix.profile }}" --threads 2 \
            --batch 8 --seq-len 128 --warmup 5 --steps 30 --repeats 3 \
            --output "artifacts/benchmark/2threads-${{ matrix.profile }}.json"
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-cpu-hypothesis-${{ matrix.profile }}
          path: artifacts/benchmark/2threads-${{ matrix.profile }}.json
          if-no-files-found: warn
          retention-days: 30
