name: RONIN-LUMEN 2-thread CPU optimization benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: baseline
            omp_proc_bind: "false"
            omp_places: "cores"
            kmp_affinity: "disabled"
          - profile: interop2
            omp_proc_bind: "false"
            omp_places: "cores"
            kmp_affinity: "disabled"
          - profile: mkldnn_off
            omp_proc_bind: "false"
            omp_places: "cores"
            kmp_affinity: "disabled"
          - profile: foreach_off
            omp_proc_bind: "false"
            omp_places: "cores"
            kmp_affinity: "disabled"
          - profile: omp_affinity
            omp_proc_bind: "close"
            omp_places: "cores"
            kmp_affinity: "granularity=fine,compact,1,0"
          - profile: cpu_affinity
            omp_proc_bind: "false"
            omp_places: "cores"
            kmp_affinity: "disabled"
          - profile: combined
            omp_proc_bind: "close"
            omp_places: "cores"
            kmp_affinity: "granularity=fine,compact,1,0"
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_PROC_BIND: ${{ matrix.omp_proc_bind }}
      OMP_PLACES: ${{ matrix.omp_places }}
      KMP_AFFINITY: ${{ matrix.kmp_affinity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run three repeated matched measurements
        run: |
          python scripts/benchmark_cpu_throughput.py \\
            --profile "${{ matrix.profile }}" --threads 2 \\
            --batch 8 --seq-len 128 --warmup 10 --steps 50 --repeats 3 \\
            --output "artifacts/benchmark/2threads-${{ matrix.profile }}.json"
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: lumen-cpu-2threads-${{ matrix.profile }}
          path: artifacts/benchmark/2threads-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
