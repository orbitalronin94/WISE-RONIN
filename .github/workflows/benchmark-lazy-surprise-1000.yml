name: LUMEN — lazy backward + surprise gate (1000-step paired benchmark)

on:
  push:
    branches:
      - benchmark/lazy-surprise-1000steps

permissions:
  contents: read

concurrency:
  group: lumen-lazy-surprise-1000steps
  cancel-in-progress: true

jobs:
  paired-benchmark:
    name: Combined candidate vs main — 1000 steps each
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_WAIT_POLICY: "PASSIVE"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download frozen paired training inputs
        uses: actions/download-artifact@v4
        with:
          name: paired-inputs-45273897576
          path: inputs
          repository: ${{ github.repository }}
          run-id: 45273897576
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-389700 parent
        uses: actions/download-artifact@v4
        with:
          name: lumen-step-389700-45273897576
          path: parent
          repository: ${{ github.repository }}
          run-id: 45273897576
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify immutable inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import torch
          candidates = [
              Path("parent/checkpoint/step_389700.pt"),
              Path("parent/checkpoints/lumen/step_389700.pt"),
              Path("parent/checkpoints/lumen/latest_good.pt"),
          ]
          checkpoint = next((p for p in candidates if p.is_file()), None)
          if checkpoint is None:
              files = [str(p) for p in Path("parent").rglob("*.pt")]
              raise SystemExit(f"step-389700 checkpoint not found; available={files}")
          state = torch.load(checkpoint, map_location="cpu", weights_only=False)
          assert int(state["step"]) == 389700, state.get("step")
          assert state["architecture_id"] == "ronin_lumen_v3_3_neuroplasticity"
          assert state.get("model") and state.get("optimizer")
          assert state.get("rng") and state.get("scheduler_transition")
          print(f"CHECKPOINT={checkpoint}")
          Path("checkpoint-path.txt").write_text(str(checkpoint) + "\\n")
          for p in [
              Path("inputs/data/spanish-v2-plus-personality-250k.jsonl"),
              Path("inputs/data/spanish-v2-plus-personality-token-cache.pt"),
              Path("inputs/artifacts/tokenizer.json"),
          ]:
              assert p.is_file() and p.stat().st_size > 0, p
          PY
      - name: Compile benchmark harness
        run: |
          python -m py_compile scripts/benchmark_lazy_surprise_1000.py
      - name: Run matched main and combined candidate (1000 steps each)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CHECKPOINT="$(cat checkpoint-path.txt)"
          mkdir -p results
          python scripts/benchmark_lazy_surprise_1000.py \\
            --candidate combined_lazy_surprise \\
            --inputs inputs \\
            --checkpoint "$CHECKPOINT" \\
            --steps 1000 \\
            --seed 42 \\
            --output results/lazy-surprise-1000.json \\
            2>&1 | tee results-lazy-surprise-1000.log
      - name: Publish comparison and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-lazy-surprise-1000-${{ github.run_id }}
          path: |
            results/
            results-lazy-surprise-1000.log
          if-no-files-found: warn
          retention-days: 30
