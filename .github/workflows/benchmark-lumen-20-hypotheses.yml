name: RONIN-LUMEN 20 real-training CPU throughput hypotheses (500 steps each)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-lumen-20-hypotheses.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-20-real-cpu-hypotheses-${{ github.run_id }}
  cancel-in-progress: false

env:
  PARENT_RUN_ID: "45037602119"
  PREPARED_RUN_ID: "45021399600"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  benchmark:
    name: "${{ matrix.profile }} — 500 real Lumen training steps"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { profile: foreach_off_repeat, threads: 4, interop: 1, mkldnn: true, foreach: false, affinity: false }
          - { profile: foreach_on_recheck, threads: 4, interop: 1, mkldnn: true, foreach: true, affinity: false }
          - { profile: threads2_foreach_off, threads: 2, interop: 1, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads3_foreach_off, threads: 3, interop: 1, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads6_foreach_off, threads: 6, interop: 1, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads8_foreach_off, threads: 8, interop: 1, mkldnn: true, foreach: false, affinity: false }
          - { profile: interop2_foreach_off, threads: 4, interop: 2, mkldnn: true, foreach: false, affinity: false }
          - { profile: interop4_foreach_off, threads: 4, interop: 4, mkldnn: true, foreach: false, affinity: false }
          - { profile: interop8_foreach_off, threads: 4, interop: 8, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads2_interop2_foreach_off, threads: 2, interop: 2, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads2_interop4_foreach_off, threads: 2, interop: 4, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads6_interop2_foreach_off, threads: 6, interop: 2, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads6_interop4_foreach_off, threads: 6, interop: 4, mkldnn: true, foreach: false, affinity: false }
          - { profile: threads8_interop2_foreach_off, threads: 8, interop: 2, mkldnn: true, foreach: false, affinity: false }
          - { profile: mkldnn_off_foreach_off, threads: 4, interop: 1, mkldnn: false, foreach: false, affinity: false }
          - { profile: threads2_mkldnn_off_foreach_off, threads: 2, interop: 1, mkldnn: false, foreach: false, affinity: false }
          - { profile: threads6_mkldnn_off_foreach_off, threads: 6, interop: 1, mkldnn: false, foreach: false, affinity: false }
          - { profile: affinity_foreach_off, threads: 4, interop: 1, mkldnn: true, foreach: false, affinity: true }
          - { profile: threads2_affinity_foreach_off, threads: 2, interop: 1, mkldnn: true, foreach: false, affinity: true }
          - { profile: threads4_interop2_affinity_foreach_off, threads: 4, interop: 2, mkldnn: true, foreach: false, affinity: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Lumen CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen Spanish training corpus and token cache
        uses: actions/download-artifact@v4
        with:
          name: ronin-spanish-prepared-16000-45021399600
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact promoted Lumen step-41000 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-step51000-45037602119
          path: parent-lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify identical benchmark inputs
        run: |
          set -euo pipefail
          test -s artifacts/spanish-v1/train.jsonl
          test -s data/spanish/tokenizer/tokenizer.json
          test -s data/spanish/train_tokens_128.pt
          python - <<'PY'
          import json, torch
          from pathlib import Path
          manifest=json.loads(Path("artifacts/spanish-v1/manifest.json").read_text())
          assert manifest["language"] == "es"
          s=torch.load("parent-lumen/checkpoints/lumen/step_41000.pt",map_location="cpu",weights_only=False)
          tr=s["scheduler_transition"]
          assert s["step"] == 41000 and s["architecture_id"] == "ronin_lumen_v3_2_parallel_delta"
          assert s["pilot_all_rows"] is True and tr["current_step"] in (41000,41001)
          assert tr["end_step"] == 51000
          assert s["optimizer"] and s["rng"] and s["scheduler"]
          print("Exact Lumen parent:",s["step"],"tokens_seen:",s["tokens_seen"],"scheduler:",tr)
          PY
      - name: Write matched control runtime profile
        run: |
          mkdir -p config artifacts
          cat > config/benchmark_runtime.json <<'JSON'
          {"threads":4,"interop_threads":1,"mkldnn_enabled":true,"foreach":false,"cpu_affinity":false}
          JSON
      - name: Run 500-step real-training control from identical checkpoint
        run: |
          set -euo pipefail
          python -m train.train \
            --steps 500 --resume parent-lumen/checkpoints/lumen/step_41000.pt \
            --phase 1 --pilot-all-rows --no-sleep \
            --data artifacts/spanish-v1/train.jsonl \
            --tokenizer data/spanish/tokenizer/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/benchmark_runtime.json \
            --lr 3e-5 --warmup 100 --total-steps 61000 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 41000 --transition-end 61000 \
            --warmup-transition 100 --transition-plateau-steps 15900 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 100000 --recovery-checkpoint-every 0 \
            --parameter-check-every 100 --ckpt-dir /tmp/lumen-control-checkpoints \
            2>&1 | tee artifacts/control.log
      - name: Write candidate runtime profile
        env:
          THREADS: ${{ matrix.threads }}
          INTEROP: ${{ matrix.interop }}
          MKLDNN: ${{ matrix.mkldnn }}
          FOREACH: ${{ matrix.foreach }}
          AFFINITY: ${{ matrix.affinity }}
        run: |
          python - <<'PY'
          import json, os
          cfg={
            "threads":int(os.environ["THREADS"]),
            "interop_threads":int(os.environ["INTEROP"]),
            "mkldnn_enabled":os.environ["MKLDNN"].lower()=="true",
            "foreach":os.environ["FOREACH"].lower()=="true",
            "cpu_affinity":os.environ["AFFINITY"].lower()=="true",
          }
          with open("config/benchmark_runtime.json","w") as f:
              json.dump(cfg,f)
              f.write("\\n")
          print("Candidate profile:",json.dumps(cfg,sort_keys=True))
          PY

      - name: Run 500-step real-training candidate from identical checkpoint
        env:
          COMPILE_MODE: ${{ matrix.compile }}
        run: |
          set -euo pipefail
          COMPILE_ARGS=()
          if [[ "$COMPILE_MODE" != "none" ]]; then COMPILE_ARGS=(--compile-mode "$COMPILE_MODE"); fi
          python -m train.train \
            --steps 500 --resume parent-lumen/checkpoints/lumen/step_41000.pt \
            --phase 1 --pilot-all-rows --no-sleep \
            --data artifacts/spanish-v1/train.jsonl \
            --tokenizer data/spanish/tokenizer/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/benchmark_runtime.json \
            --lr 3e-5 --warmup 100 --total-steps 61000 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 41000 --transition-end 61000 \
            --warmup-transition 100 --transition-plateau-steps 15900 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 100000 --recovery-checkpoint-every 0 \
            --parameter-check-every 100 --ckpt-dir /tmp/lumen-candidate-checkpoints \
            2>&1 | tee "artifacts/${{ matrix.profile }}.log"
      - name: Extract all five 100-step windows and compare
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, statistics
          def read(path):
              p=pathlib.Path(path)
              if not p.exists():
                  return {"status":"missing"}
              raw=p.read_text(errors="replace")
              intervals=[float(x) for x in re.findall(r"profile_100:.*?total=([0-9.]+)s",raw)]
              losses=re.findall(r"step=41600 loss=([0-9.eE+-]+)",raw)
              if len(intervals) != 5:
                  return {"status":"incomplete","windows_found":len(intervals),
                          "windows_seconds":intervals,"tail":raw[-3000:]}
              total=sum(intervals)
              return {
                  "status":"ok","measured_steps":500,
                  "window_seconds":intervals,
                  "total_profile_seconds":round(total,4),
                  "mean_window_seconds":round(statistics.mean(intervals),4),
                  "stdev_window_seconds":round(statistics.pstdev(intervals),4),
                  "steps_per_second":round(500/total,5),
                  "step_41600_loss":float(losses[-1]) if losses else None,
              }
          control=read("artifacts/control.log")
          candidate=read(f"artifacts/{os.environ['PROFILE']}.log")
          valid=control.get("status")=="ok" and candidate.get("status")=="ok"
          report={
              "profile":os.environ["PROFILE"],
              "control":control,"candidate":candidate,
              "speedup_vs_foreach_off_control":round(
                  candidate["steps_per_second"]/control["steps_per_second"],5
              ) if valid else None,
              "benchmark_steps_per_run":500,
              "parent_checkpoint_step":41000,
              "candidate_final_step":41500,
          }
          pathlib.Path("artifacts/comparison.json").write_text(json.dumps(report,indent=2)+"\\n")
          print(json.dumps(report,indent=2))
          if not valid:
              raise SystemExit("Incomplete benchmark: expected five complete 100-step windows in both logs")
          PY

      - name: Upload real-training benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-real-20cpu-500-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
