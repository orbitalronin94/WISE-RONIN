name: LUMEN — 20 exact backward simplification hypotheses, 100 steps
on:
  push:
    branches: [benchmark/lumen-backward-20-hypotheses]
    paths:
      - ".github/workflows/benchmark-lumen-backward-20.yml"
      - "model/delta_state.py"
      - "train/train.py"
      - "tests/test_delta_backward_fastpaths.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-backward-20-${{ github.run_id }}
  cancel-in-progress: false
env:
  PARENT_RUN_ID: "45136184396"
  PREPARED_RUN_ID: "45136184396"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm pytest
      - name: Verify exact Delta fast-path output and gradient parity
        run: python -m pytest -q tests/test_delta_backward_fastpaths.py tests/test_fast_path.py tests/test_hotspot_fastpaths.py

  benchmark:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile:
          - control_repeat
          - trace_summary_no_grad
          - trace_norm_diagnostics_off
          - trace_no_grad_diag_off
          - state_update_bmm
          - summary_update_bmm
          - both_updates_bmm
          - summary_no_grad_bmm
          - delta_all_exact
          - homeostasis_fused_scatter
          - foreach_on
          - threads2
          - threads3
          - threads6
          - interop1
          - mkldnn_off
          - affinity_off
          - combo_delta_foreach
          - combo_delta_threads2_interop1
          - combo_delta_homeostasis_fused
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download frozen Spanish v2 plus personality corpus
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45136184396
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact promoted Lumen step-140700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: ronin-lumen-step140700-v2-personality-45136184396
          path: lumen-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify identical benchmark inputs and parent
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          python - <<'PY'
          import torch
          p="lumen-parent/checkpoints/lumen-v2-140700/step_140700.pt"
          s=torch.load(p,map_location="cpu",weights_only=False)
          assert s["step"] == 140700
          assert s["architecture_id"] == "ronin_lumen_v3_2_parallel_delta"
          assert s["pilot_all_rows"] is True
          assert s["training_config"]["batch"] == 8
          assert s["training_config"]["max_len"] == 128
          assert s["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s.get("optimizer") and s.get("scheduler_transition") and s.get("rng")
          assert int(s["scheduler_transition"]["current_step"]) in (140700,140701)
          print("Exact parent verified:",s["step"],"tokens_seen:",s["tokens_seen"])
          PY
      - name: Write matched control runtime profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "artifacts/results/$PROFILE" config
          cat > config/runtime_profile.json <<'JSON'
          {
            "threads": 4, "interop_threads": 2, "mkldnn_enabled": true,
            "foreach": false, "cpu_affinity": true,
            "delta_pre_normalize": false, "homeostasis_fused_scatter": false,
            "delta_parallel_refinements": 2,
            "delta_trace_summary_no_grad": false,
            "delta_trace_norm_diagnostics": true,
            "delta_state_update_bmm": false, "delta_summary_update_bmm": false,
            "organs": {
              "pain": {"response": 0.30, "decay": 0.55},
              "pleasure": {"response": 0.75},
              "pain_budget_gain": 0.10, "pleasure_budget_gain": 0.1125
            }
          }
          JSON
          cp config/runtime_profile.json "artifacts/results/$PROFILE/control_profile.json"
      - name: Run 100-step matched control
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python -m train.train \
            --steps 100 --resume lumen-parent/checkpoints/lumen-v2-140700/step_140700.pt \
            --phase 1 --pilot-all-rows --no-sleep \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/runtime_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 155700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 140700 --transition-end 155700 \
            --warmup-transition 100 --transition-plateau-steps 6000 \
            --transition-min-lr-ratio 0.5 \
            --log-every 20 --checkpoint-every 100000 --recovery-checkpoint-every 0 \
            --parameter-check-every 100 --ckpt-dir /tmp/lumen-backward-control \
            2>&1 | tee "artifacts/results/$PROFILE/control.log"
      - name: Apply one hypothesis or combination
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          name=os.environ["PROFILE"]
          p={
            "threads":4,"interop_threads":2,"mkldnn_enabled":True,
            "foreach":False,"cpu_affinity":True,
            "delta_pre_normalize":False,"homeostasis_fused_scatter":False,
            "delta_parallel_refinements":2,
            "delta_trace_summary_no_grad":False,
            "delta_trace_norm_diagnostics":True,
            "delta_state_update_bmm":False,
            "delta_summary_update_bmm":False,
            "organs":{"pain":{"response":0.30,"decay":0.55},
              "pleasure":{"response":0.75},"pain_budget_gain":0.10,
              "pleasure_budget_gain":0.1125}
          }
          changes={
            "control_repeat":{},
            "trace_summary_no_grad":{"delta_trace_summary_no_grad":True},
            "trace_norm_diagnostics_off":{"delta_trace_norm_diagnostics":False},
            "trace_no_grad_diag_off":{"delta_trace_summary_no_grad":True,"delta_trace_norm_diagnostics":False},
            "state_update_bmm":{"delta_state_update_bmm":True},
            "summary_update_bmm":{"delta_summary_update_bmm":True},
            "both_updates_bmm":{"delta_state_update_bmm":True,"delta_summary_update_bmm":True},
            "summary_no_grad_bmm":{"delta_trace_summary_no_grad":True,"delta_summary_update_bmm":True},
            "delta_all_exact":{"delta_trace_summary_no_grad":True,"delta_trace_norm_diagnostics":False,"delta_state_update_bmm":True,"delta_summary_update_bmm":True},
            "homeostasis_fused_scatter":{"homeostasis_fused_scatter":True},
            "foreach_on":{"foreach":True},
            "threads2":{"threads":2},
            "threads3":{"threads":3},
            "threads6":{"threads":6},
            "interop1":{"interop_threads":1},
            "mkldnn_off":{"mkldnn_enabled":False},
            "affinity_off":{"cpu_affinity":False},
            "combo_delta_foreach":{"delta_trace_summary_no_grad":True,"delta_trace_norm_diagnostics":False,"delta_state_update_bmm":True,"delta_summary_update_bmm":True,"foreach":True},
            "combo_delta_threads2_interop1":{"delta_trace_summary_no_grad":True,"delta_trace_norm_diagnostics":False,"delta_state_update_bmm":True,"delta_summary_update_bmm":True,"threads":2,"interop_threads":1},
            "combo_delta_homeostasis_fused":{"delta_trace_summary_no_grad":True,"delta_trace_norm_diagnostics":False,"delta_state_update_bmm":True,"delta_summary_update_bmm":True,"homeostasis_fused_scatter":True}
          }
          assert name in changes, name
          p.update(changes[name])
          with open("config/runtime_profile.json","w") as f:
              json.dump(p,f,indent=2,sort_keys=True)
              f.write("\n")
          with open(f"artifacts/results/{name}/hypothesis.json","w") as f:
              json.dump({"name":name,"steps":100,"seed":42,"changes":changes[name],"runtime_profile":p},f,indent=2,sort_keys=True)
              f.write("\n")
          print(json.dumps({"name":name,"changes":changes[name]},indent=2))
          PY
      - name: Run 100-step candidate from same parent and seed
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python -m train.train \
            --steps 100 --resume lumen-parent/checkpoints/lumen-v2-140700/step_140700.pt \
            --phase 1 --pilot-all-rows --no-sleep \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/runtime_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 155700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 140700 --transition-end 155700 \
            --warmup-transition 100 --transition-plateau-steps 6000 \
            --transition-min-lr-ratio 0.5 \
            --log-every 20 --checkpoint-every 100000 --recovery-checkpoint-every 0 \
            --parameter-check-every 100 --ckpt-dir /tmp/lumen-backward-candidate \
            2>&1 | tee "artifacts/results/$PROFILE/candidate.log"
      - name: Extract timing, loss and health evidence
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, statistics
          root=pathlib.Path("artifacts/results")/os.environ["PROFILE"]
          def read(path):
              p=pathlib.Path(path)
              if not p.exists(): return {"status":"missing"}
              raw=p.read_text(errors="replace")
              totals=[float(x) for x in re.findall(r"profile_20:.*?total=([0-9.]+)s",raw)]
              backwards=[float(x) for x in re.findall(r"profile_20:.*?backward=([0-9.]+)s",raw)]
              forwards=[float(x) for x in re.findall(r"profile_20:.*?forward=([0-9.]+)s",raw)]
              losses=[float(x) for x in re.findall(r"glucose_check step=\d+ mean_loss=([0-9.eE+-]+)",raw)]
              dead=re.findall(r"effective_dead_by_layer step=\d+ values=([0-9.,]+)",raw)
              nonfinite=("NONFINITE" in raw or "non-finite" in raw.lower())
              if len(totals)!=5 or len(backwards)!=5 or len(losses)!=5 or nonfinite:
                  return {"status":"incomplete_or_unhealthy","windows":len(totals),"backward_windows":len(backwards),"loss_windows":len(losses),"nonfinite":nonfinite,"tail":raw[-1500:]}
              return {"status":"ok","steps":100,"total_seconds":round(sum(totals),4),
                "backward_seconds":round(sum(backwards),4),
                "forward_seconds":round(sum(forwards),4) if len(forwards)==5 else None,
                "mean_loss":round(statistics.mean(losses),7),"loss_windows":losses,
                "effective_dead_by_layer":dead[-1] if dead else None,
                "steps_per_second":round(100/sum(totals),6)}
          control=read(root/"control.log"); candidate=read(root/"candidate.log")
          valid=control.get("status")=="ok" and candidate.get("status")=="ok"
          report={"hypothesis":os.environ["PROFILE"],"status":"ok" if valid else "incomplete_or_unhealthy",
            "control":control,"candidate":candidate,
            "speedup":round(control["total_seconds"]/candidate["total_seconds"],6) if valid else None,
            "backward_speedup":round(control["backward_seconds"]/candidate["backward_seconds"],6) if valid and candidate["backward_seconds"] else None,
            "loss_delta_percent":round(100*(candidate["mean_loss"]/control["mean_loss"]-1),5) if valid and control["mean_loss"] else None,
            "same_parent_step":140700,"final_step":140800,"seed":42,
            "measurement_note":"Five 20-step windows; training loss only, not a holdout."}
          (root/"comparison.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload hypothesis evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumen-backward20-${{ matrix.profile }}-${{ github.run_id }}
          path: artifacts/results/${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  aggregate:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Download all 20 reports
        uses: actions/download-artifact@v7
        with:
          pattern: lumen-backward20-*-${{ github.run_id }}
          path: artifacts/all
          merge-multiple: false
      - name: Rank candidates against matched controls
        run: |
          python - <<'PY'
          import json, pathlib
          reports=[]
          for p in pathlib.Path("artifacts/all").glob("**/comparison.json"):
              try: reports.append(json.loads(p.read_text()))
              except Exception: pass
          valid=[r for r in reports if r.get("status")=="ok" and r.get("speedup") is not None and r.get("loss_delta_percent") is not None]
          eligible=[r for r in valid if r["speedup"]>=1.03 and r["loss_delta_percent"]<=0.5]
          eligible.sort(key=lambda r:(r["speedup"],r.get("backward_speedup") or 0),reverse=True)
          ranked=sorted(valid,key=lambda r:(r["speedup"],r.get("backward_speedup") or 0),reverse=True)
          report={"hypotheses_expected":20,"hypotheses_reported":len(reports),"valid":len(valid),
            "eligible_for_promotion":len(eligible),
            "promotion_gate":{"minimum_total_speedup":1.03,"maximum_training_loss_regression_percent":0.5,"all_runs_finite":True},
            "winner":eligible[0] if eligible else None,"ranked":ranked,
            "incomplete":[r.get("hypothesis") for r in reports if r.get("status")!="ok"],
            "note":"100-step screening benchmark, not a quality holdout. Only exact-equivalence Delta fast paths and runtime settings are promotion candidates."}
          pathlib.Path("artifacts").mkdir(exist_ok=True)
          pathlib.Path("artifacts/lumen_backward_20_hypotheses.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Upload aggregate ranking
        uses: actions/upload-artifact@v7
        with:
          name: lumen-backward-20-hypotheses-report-${{ github.run_id }}
          path: artifacts/lumen_backward_20_hypotheses.json
          if-no-files-found: error
          retention-days: 90
