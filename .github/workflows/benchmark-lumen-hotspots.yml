name: LUMEN parallel 40-hypothesis CPU benchmark (4-thread winner baseline)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/benchmark-lumen-hotspots.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: lumen-40-hypothesis-benchmark
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parity-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy pytest
      - name: Download exact promoted step-3000 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-compiled-matched-3000-44940676355
          path: artifacts/promoted-step-3000
          repository: ${{ github.repository }}
          run-id: 44940676355
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen training inputs
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-continuation-inputs-44936542271
          path: artifacts/frozen-inputs
          repository: ${{ github.repository }}
          run-id: 44936542271
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble immutable benchmark bundle
        run: |
          set -euo pipefail
          mkdir -p benchmark-inputs/checkpoints benchmark-inputs/data
          cp artifacts/promoted-step-3000/checkpoints/lumen/step_3000.pt benchmark-inputs/checkpoints/lumen_step_3000.pt
          cp artifacts/frozen-inputs/data/pilot_train_19k.jsonl benchmark-inputs/data/pilot_train_19k.jsonl
          cp artifacts/frozen-inputs/data/pilot_tokenized_128.pt benchmark-inputs/data/pilot_tokenized_128.pt
          cp -a artifacts/frozen-inputs/data/pilot_tokenizer benchmark-inputs/data/pilot_tokenizer
          test -s benchmark-inputs/checkpoints/lumen_step_3000.pt
          test -s benchmark-inputs/data/pilot_tokenized_128.pt
      - name: Verify exact Delta and Homeostasis fast paths
        run: PYTHONPATH=. pytest -q tests/test_hotspot_fastpaths.py
      - name: Build control plus 40 hypotheses around the measured 4-thread winner
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          base = json.loads(Path("config/lumen_cpu_profile.json").read_text())
          # Anchor every candidate to the measured winner: 4 intra-op, 2 inter-op,
          # MKLDNN on, foreach off, CPU affinity on, exact fast paths off.
          base.update({"threads": 4, "interop_threads": 2, "mkldnn_enabled": True,
                       "foreach": False, "cpu_affinity": True,
                       "delta_pre_normalize": False, "homeostasis_fused_scatter": False})
          variants = [
              ("threads_2", {"threads": 2}),
              ("threads_3", {"threads": 3}),
              ("threads_5", {"threads": 5}),
              ("threads_6", {"threads": 6}),
              ("threads_8", {"threads": 8}),
              ("interop_1", {"interop_threads": 1}),
              ("interop_4", {"interop_threads": 4}),
              ("interop_8", {"interop_threads": 8}),
              ("affinity_off", {"cpu_affinity": False}),
              ("mkldnn_off", {"mkldnn_enabled": False}),
              ("foreach_on", {"foreach": True}),
              ("delta_pre_norm_on", {"delta_pre_normalize": True}),
              ("homeostasis_fused_on", {"homeostasis_fused_scatter": True}),
              ("threads_3_interop_1", {"threads": 3, "interop_threads": 1}),
              ("threads_3_interop_2", {"threads": 3, "interop_threads": 2}),
              ("threads_3_interop_4", {"threads": 3, "interop_threads": 4}),
              ("threads_5_interop_1", {"threads": 5, "interop_threads": 1}),
              ("threads_5_interop_2", {"threads": 5, "interop_threads": 2}),
              ("threads_5_interop_4", {"threads": 5, "interop_threads": 4}),
              ("threads_6_interop_1", {"threads": 6, "interop_threads": 1}),
              ("threads_6_interop_4", {"threads": 6, "interop_threads": 4}),
              ("threads_8_interop_1", {"threads": 8, "interop_threads": 1}),
              ("threads_8_interop_4", {"threads": 8, "interop_threads": 4}),
              ("affinity_off_interop_1", {"cpu_affinity": False, "interop_threads": 1}),
              ("affinity_off_interop_4", {"cpu_affinity": False, "interop_threads": 4}),
              ("mkldnn_off_foreach_on", {"mkldnn_enabled": False, "foreach": True}),
              ("mkldnn_off_affinity_off", {"mkldnn_enabled": False, "cpu_affinity": False}),
              ("foreach_on_affinity_off", {"foreach": True, "cpu_affinity": False}),
              ("foreach_on_interop_1", {"foreach": True, "interop_threads": 1}),
              ("foreach_on_interop_4", {"foreach": True, "interop_threads": 4}),
              ("delta_pre_norm_interop_1", {"delta_pre_normalize": True, "interop_threads": 1}),
              ("delta_pre_norm_interop_4", {"delta_pre_normalize": True, "interop_threads": 4}),
              ("homeostasis_fused_interop_1", {"homeostasis_fused_scatter": True, "interop_threads": 1}),
              ("homeostasis_fused_interop_4", {"homeostasis_fused_scatter": True, "interop_threads": 4}),
              ("threads_5_foreach_on", {"threads": 5, "foreach": True}),
              ("threads_6_foreach_on", {"threads": 6, "foreach": True}),
              ("threads_5_affinity_off", {"threads": 5, "cpu_affinity": False}),
              ("threads_6_affinity_off", {"threads": 6, "cpu_affinity": False}),
              ("mkldnn_off_foreach_affinity_off", {"mkldnn_enabled": False, "foreach": True, "cpu_affinity": False}),
              ("foreach_homeostasis_fused", {"foreach": True, "homeostasis_fused_scatter": True}),
          ]
          assert len(variants) == 40 and len({name for name, _ in variants}) == 40
          profiles = [{"name": "control", "profile": base}]
          for name, changes in variants:
              candidate = dict(base)
              candidate.update(changes)
              profiles.append({"name": "hypothesis_" + name, "profile": candidate})
          matrix = {"include": [{"name": item["name"], "profile": json.dumps(item["profile"], separators=(",", ":"))} for item in profiles]}
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY
      - name: Publish identical inputs for all parallel workers
        uses: actions/upload-artifact@v4
        with:
          name: lumen-hotspot-inputs
          path: benchmark-inputs/
          if-no-files-found: error
          retention-days: 7

  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy
      - name: Download immutable step-3000 inputs
        uses: actions/download-artifact@v4
        with:
          name: lumen-hotspot-inputs
          path: benchmark-inputs
      - name: Run matched profile
        env:
          PROFILE: ${{ matrix.profile }}
          PROFILE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/results
          PYTHONPATH=. python scripts/benchmark_lumen_hotspots.py \
            --name "$PROFILE_NAME" \
            --worker-profile "$PROFILE" \
            --checkpoint benchmark-inputs/checkpoints/lumen_step_3000.pt \
            --data benchmark-inputs/data/pilot_train_19k.jsonl \
            --tokenizer benchmark-inputs/data/pilot_tokenizer/tokenizer.json \
            --token-cache benchmark-inputs/data/pilot_tokenized_128.pt \
            --warmup 6 --steps 40 --repeats 5 \
            --output "artifacts/results/$PROFILE_NAME.json"
      - name: Upload profile result
        uses: actions/upload-artifact@v4
        with:
          name: lumen-profile-${{ matrix.name }}
          path: artifacts/results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download control plus 40 parallel hypotheses
        uses: actions/download-artifact@v4
        with:
          pattern: lumen-profile-*
          path: artifacts/results
          merge-multiple: true
      - name: Rank speed only after the loss gate
        id: selection
        run: |
          set -euo pipefail
          python scripts/aggregate_lumen_hotspot_results.py \
            --results-dir artifacts/results \
            --current-profile config/lumen_cpu_profile.json \
            --report artifacts/lumen_hotspot_benchmark.json \
            --minimum-speedup 1.05 --max-loss-regression 0.01
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open("artifacts/lumen_hotspot_benchmark.json", encoding="utf-8"))
          print("promoted=" + str(r["promoted"]).lower())
          print("selected_profile=" + r["selected_profile"])
          PY
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: lumen-seven-hypotheses-report-${{ github.run_id }}
          path: |
            artifacts/lumen_hotspot_benchmark.json
            config/lumen_cpu_profile.json
          if-no-files-found: error
          retention-days: 90
