name: RONIN-LUMEN real pipeline bottleneck benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_lumen_pipeline.py"
      - ".github/workflows/benchmark-lumen-pipeline.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-real-pipeline-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - eager_reference
          - no_health_snapshots
          - compile_default
          - no_aux_losses
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_PROC_BIND: close
      OMP_PLACES: cores
      KMP_AFFINITY: "granularity=fine,compact,1,0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm

      - name: Restore exact frozen step-2000 parent and training-only data
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-continuation-inputs-44936542271
          path: .
          repository: ${{ github.repository }}
          run-id: 44936542271
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s checkpoints/continuation/lumen_step_2000_continuation.pt
          test -s data/pilot_train_19k.jsonl
          test -s data/pilot_tokenized_128.pt
          test -s data/pilot_tokenizer/tokenizer.json
          python -m py_compile scripts/benchmark_lumen_pipeline.py

      - name: Profile real training pipeline
        run: |
          python scripts/benchmark_lumen_pipeline.py \
            --profile "${{ matrix.profile }}" \
            --warmup 3 --steps 20 --threads 2 \
            --output "artifacts/benchmark/lumen-pipeline-${{ matrix.profile }}.json"

      - name: Upload profile report
        uses: actions/upload-artifact@v4
        with:
          name: lumen-real-pipeline-${{ matrix.profile }}
          path: artifacts/benchmark/lumen-pipeline-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
