name: LUMEN — 18 neuroplasticity changes, paired 100-step gates

on:
  push:
    branches: [feat/unified-neuroplasticity-organs]
    paths:
      - ".github/workflows/benchmark-neuroplasticity-18.yml"
      - "scripts/benchmark_neuroplasticity_candidate.py"
      - "scripts/aggregate_neuroplasticity_benchmarks.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-neuroplasticity-18-${{ github.run_id }}
  cancel-in-progress: false

env:
  PARENT_RUN_ID: "45149684913"
  PREPARED_RUN_ID: "45149684913"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  benchmark:
    name: "${{ matrix.candidate }} — main vs candidate — 100 steps"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        candidate:
          - 01_shared_signal_core
          - 02_pain_response
          - 03_pleasure_response
          - 04_pain_budget_gain
          - 05_pleasure_budget_gain
          - 06_ltp_threshold
          - 07_disinhibition_gain
          - 08_modulator_gain
          - 09_eligibility_window
          - 10_attention_gate
          - 11_tagging_capture
          - 12_intrinsic_threshold
          - 13_simulated_pruning
          - 14_tag_protected_ltd
          - 15_one_shot_memory
          - 16_homeostatic_scaling
          - 17_prioritized_replay
          - 18_sleep_downscaling

    steps:
      - name: Checkout frozen main control source
        uses: actions/checkout@v7
        with:
          ref: main
          path: baseline

      - name: Checkout candidate PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate

      - name: Set up Python matching the promoted checkpoint runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"

      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm

      - name: Download exact promoted step-155700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: ronin-lumen-step155700-v2-personality-45149684913
          path: parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact frozen v2 plus personality corpus and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify identical parent, corpus, tokenizer and cache
        run: |
          set -euo pipefail
          CHECKPOINT="$(find parent -name step_155700.pt -print -quit)"
          test -n "$CHECKPOINT"
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          echo "CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"
          export CHECKPOINT
          python - <<'PY'
          import hashlib, os, torch
          from pathlib import Path
          checkpoint = Path(os.environ["CHECKPOINT"])
          data = Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer = Path("prepared/artifacts/spanish-v2/tokenizer.json")
          state = torch.load(checkpoint, map_location="cpu", weights_only=False)
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert state["step"] == 155700
          assert state["architecture_id"] == "ronin_lumen_v3_2_parallel_delta"
          assert state["phase"] == 1 and state["pilot_all_rows"] is True
          assert state["seed"] == 42
          assert state["training_config"]["batch"] == 8
          assert state["training_config"]["max_len"] == 128
          assert state["training_config"]["lr"] == 3e-5
          assert state["data_sha256"] == sha(data)
          assert state["tokenizer_sha256"] == sha(tokenizer)
          assert state.get("optimizer") and state.get("rng") and state.get("scheduler_transition")
          print("Exact parent/data/tokenizer verified:", checkpoint)
          print("data_sha256:", sha(data))
          print("tokenizer_sha256:", sha(tokenizer))
          PY

      - name: Run paired 100-step main-control and one-change candidate
        run: |
          set -euo pipefail
          python candidate/scripts/benchmark_neuroplasticity_candidate.py \
            --candidate "${{ matrix.candidate }}" \
            --baseline-root baseline \
            --candidate-root candidate \
            --prepared-root prepared \
            --checkpoint "$CHECKPOINT" \
            --output "benchmark-results/${{ matrix.candidate }}"

      - name: Preserve both 100-step logs and comparison JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neuroplasticity-18-${{ matrix.candidate }}-${{ github.run_id }}
          path: benchmark-results/${{ matrix.candidate }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  aggregate:
    name: Aggregate approved and pending changes
    needs: [benchmark]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate registry
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"

      - name: Download all 18 candidate artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: neuroplasticity-18-*-${{ github.run_id }}
          path: benchmark-results
          merge-multiple: false

      - name: Build approved profile and pending register
        run: |
          set -euo pipefail
          python candidate/scripts/aggregate_neuroplasticity_benchmarks.py --root benchmark-results
          test -s benchmark-results/AGGREGATE.md
          test -s benchmark-results/approved_candidates.json
          cat benchmark-results/AGGREGATE.md

      - name: Upload complete tournament record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumen-neuroplasticity-18-summary-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
