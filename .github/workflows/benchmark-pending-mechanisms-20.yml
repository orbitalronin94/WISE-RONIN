name: LUMEN — 20 pending-mechanism hypotheses vs frozen main

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-pending-mechanisms-20.yml"
      - "scripts/benchmark_pending_mechanism_candidate.py"
      - "scripts/aggregate_pending_mechanism_benchmarks.py"
      - "model/**"
      - "train/**"
      - "config/**"
      - "tests/**"
  workflow_dispatch:
  push:
    branches:
      - experiment/pending-mechanisms-20-and-train-chronicle

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-pending-mechanisms-20
  cancel-in-progress: false

env:
  BASE_SHA: "19986f27925e3ccd2c965bbad6ebca2fa4db9e57"
  PARENT_RUN_ID: "45200252793"
  DATA_RUN_ID: "45149684913"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "ACTIVE"
  OMP_PROC_BIND: "close"
  OMP_PLACES: "cores"
  KMP_BLOCKTIME: "0"

jobs:
  validate:
    name: Validate code and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm pytest datasets langid
      - name: Compile and run tests
        run: |
          python -m compileall -q model train scripts
          PYTHONPATH=. pytest -q tests

  benchmark:
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: "${{ matrix.candidate }} — frozen main vs candidate — 100 steps"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate:
          - 01_tagging_capture
          - 02_intrinsic_threshold
          - 03_simulated_pruning
          - 04_tag_protected_ltd
          - 05_one_shot_memory
          - 06_homeostatic_scaling
          - 07_prioritized_replay
          - 08_sleep_downscaling
          - 09_tag_plus_intrinsic
          - 10_tag_plus_pruning
          - 11_tag_plus_one_shot
          - 12_tag_plus_scaling
          - 13_tag_plus_replay
          - 14_tag_plus_downscale
          - 15_intrinsic_plus_pruning
          - 16_one_shot_plus_scaling
          - 17_pruning_plus_ltd
          - 18_scaling_plus_downscale
          - 19_tag_replay_downscale
          - 20_all_pending
    steps:
      - name: Checkout frozen main control
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline

      - name: Checkout PR candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm

      - name: Download exact paired step-185700 Lumen checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step185700-45200252793
          path: parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact frozen corpus, tokenizer and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify parent, data, tokenizer and cache
        run: |
          set -euo pipefail
          CHECKPOINT="$(find parent -name step_185700.pt -print -quit)"
          test -n "$CHECKPOINT"
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          export CHECKPOINT
          python - <<'PY'
          import hashlib, os, torch
          from pathlib import Path
          checkpoint = Path(os.environ["CHECKPOINT"])
          data = Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer = Path("prepared/artifacts/spanish-v2/tokenizer.json")
          state = torch.load(checkpoint, map_location="cpu", weights_only=False)
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert state["step"] == 185700
          assert state["architecture_id"] == "ronin_lumen_v3_3_neuroplasticity"
          assert state["seed"] == 42
          assert state["training_config"]["batch"] == 8
          assert state["training_config"]["max_len"] == 128
          assert state["data_sha256"] == sha(data)
          assert state["tokenizer_sha256"] == sha(tokenizer)
          assert state.get("optimizer") and state.get("rng")
          print("Exact step-185700 parent/data/tokenizer verified")
          print("data_sha256:", sha(data))
          print("tokenizer_sha256:", sha(tokenizer))
          PY
          echo "CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"

      - name: Run paired main-control vs one pending-mechanism hypothesis
        run: |
          set -euo pipefail
          python candidate/scripts/benchmark_pending_mechanism_candidate.py \
            --candidate "${{ matrix.candidate }}" \
            --baseline-root baseline \
            --candidate-root candidate \
            --prepared-root prepared \
            --checkpoint "$CHECKPOINT" \
            --output "benchmark-results/${{ matrix.candidate }}"

      - name: Preserve paired logs and comparison JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pending-mechanisms-20-${{ matrix.candidate }}-${{ github.run_id }}
          path: benchmark-results/${{ matrix.candidate }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  aggregate:
    name: Aggregate all 20 hypotheses
    needs: [benchmark]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen main runtime profile
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline-main
      - name: Checkout candidate registry
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Download every candidate artifact
        uses: actions/download-artifact@v7
        with:
          pattern: pending-mechanisms-20-*-${{ github.run_id }}
          path: benchmark-results
          merge-multiple: false
      - name: Build complete decision register
        run: |
          set -euo pipefail
          cp baseline-main/config/lumen_cpu_profile.json benchmark-results/main-runtime-profile.json
          python candidate/scripts/aggregate_pending_mechanism_benchmarks.py --root benchmark-results
          test -s benchmark-results/AGGREGATE.md
          test -s benchmark-results/approved_candidates.json
          cat benchmark-results/AGGREGATE.md
      - name: Upload complete tournament record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pending-mechanisms-20-summary-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
