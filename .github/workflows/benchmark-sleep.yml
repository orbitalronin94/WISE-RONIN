name: RONIN-LUMEN sleep/replay benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_sleep.py"
      - ".github/workflows/benchmark-sleep.yml"
      - "README.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-sleep-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_PROC_BIND: close
      OMP_PLACES: cores
      KMP_AFFINITY: "granularity=fine,compact,1,0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy

      - name: Download promoted step-3000 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-compiled-matched-3000-44940676355
          path: artifacts/promoted-step-3000
          repository: ${{ github.repository }}
          run-id: 44940676355
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen corpus and token cache
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-continuation-inputs-44936542271
          path: artifacts/frozen-inputs
          repository: ${{ github.repository }}
          run-id: 44936542271
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frozen checkpoint and inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen data artifacts/benchmark
          cp artifacts/promoted-step-3000/checkpoints/lumen/step_3000.pt checkpoints/lumen/step_3000.pt
          cp artifacts/frozen-inputs/data/pilot_train_19k.jsonl data/pilot_train_19k.jsonl
          cp artifacts/frozen-inputs/data/pilot_tokenized_128.pt data/pilot_tokenized_128.pt
          cp -a artifacts/frozen-inputs/data/pilot_tokenizer data/pilot_tokenizer
          python - <<'PY'
          import hashlib, torch
          from pathlib import Path
          checks = {
              "checkpoints/lumen/step_3000.pt": "fcfc740ae1db9e7055cba5dc39f58e9e19327a3baa78ddeb2493e9faa983e8f7",
              "data/pilot_train_19k.jsonl": "bca06a8f9a11d46bc91b79944243f37e1f0c902bd8a3c16c38dffcb05754c35c",
              "data/pilot_tokenizer/tokenizer.json": "78b353e908b312722d8de24abce2b9bdc02168e4a2d4f78a7c5a109a2d65d99f",
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA mismatch for {path}: {actual}")
          state = torch.load("checkpoints/lumen/step_3000.pt", map_location="cpu", weights_only=False)
          if state.get("step") != 3000:
              raise SystemExit("Unexpected checkpoint step")
          print("Frozen step-3000 checkpoint, corpus and tokenizer verified.")
          PY

      - name: Benchmark no-op, current replay and denoising sleep
        run: |
          python scripts/benchmark_sleep.py \
            --checkpoint checkpoints/lumen/step_3000.pt \
            --data data/pilot_train_19k.jsonl \
            --token-cache data/pilot_tokenized_128.pt \
            --bank-size 96 --eval-size 32 --sleep-steps 50 \
            --output artifacts/benchmark/sleep-replay-step3000.json

      - name: Upload sleep benchmark report (including partial diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-sleep-replay-benchmark-${{ github.run_id }}
          path: artifacts/benchmark/sleep-replay-step3000.json
          if-no-files-found: warn
          retention-days: 90
