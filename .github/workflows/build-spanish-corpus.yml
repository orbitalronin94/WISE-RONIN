name: Build Spanish-only licensed corpus v1

on:
  push:
    branches:
      - dataset/spanish-only-v1
    paths:
      - scripts/build_spanish_corpus.py
      - tests/test_build_spanish_corpus.py
      - .github/workflows/build-spanish-corpus.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/build_spanish_corpus.py
      - tests/test_build_spanish_corpus.py
      - .github/workflows/build-spanish-corpus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wise-ronin-spanish-corpus-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install corpus tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" langid pytest
      - name: Compile and test
        run: |
          python -m py_compile scripts/build_spanish_corpus.py
          PYTHONPATH=. pytest -q tests/test_build_spanish_corpus.py
      - name: Download, filter, normalize and deduplicate
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/build_spanish_corpus.py \
            --output-dir artifacts/spanish-v1 \
            --max-alia 40000 --max-general 25000 --max-legal 10000 --max-uji 20000
      - name: Validate final corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/spanish-v1")
          m = json.loads((root / "manifest.json").read_text())
          assert m["language"] == "es" and m["train_rows"] > 1000
          assert m["validation_rows"] > 0 and m["holdout_rows"] > 0
          holdout_sources = m["holdout_source_counts"]
          assert holdout_sources.get("BSC-LT/SIQA_es", 0) >= 1800, holdout_sources
          assert holdout_sources.get("BSC-LT/openbookqa-es", 0) >= 400, holdout_sources
          for name in ("train.jsonl", "validation.jsonl"):
              for line in (root / name).read_text(encoding="utf-8").splitlines():
                  r = json.loads(line)
                  assert r["language"] == "es" and r["completion"].strip()
                  assert r["license"] in {"Apache-2.0","Apache-2.0 (internal)","CC-BY-4.0","CC-BY-4.0 (internal)"}
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v1-${{ github.run_id }}
          path: artifacts/spanish-v1/
          if-no-files-found: error
          retention-days: 30
