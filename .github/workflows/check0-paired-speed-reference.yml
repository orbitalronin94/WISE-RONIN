name: Check 0 — LUMEN and Transformer speed reference

on:
  push:
    branches:
      - benchmark/launch-check0-paired-reference
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-check0-paired-reference
  cancel-in-progress: false

env:
  CORPUS_RUN_ID: "45007651092"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen Spanish corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v1-${{ env.CORPUS_RUN_ID }}
          path: artifacts/spanish-v1
          repository: ${{ github.repository }}
          run-id: ${{ env.CORPUS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate corpus and prepare one shared tokenizer/cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/spanish-v1")
          m=json.loads((p/"manifest.json").read_text())
          assert m["language"]=="es"
          for name,key in [("train.jsonl","train_rows"),("validation.jsonl","validation_rows")]:
              rows=[json.loads(x) for x in (p/name).read_text().splitlines() if x.strip()]
              assert len(rows)==int(m[key]) and rows
              assert all(r.get("language")=="es" for r in rows)
          h=[json.loads(x) for x in (p/"holdout_multiple_choice.jsonl").read_text().splitlines() if x.strip()]
          assert len(h)==int(m["holdout_rows"]) and h
          print("Corpus validated:",m)
          PY
          mkdir -p data/spanish/tokenizer
          python scripts/train_tokenizer.py --data artifacts/spanish-v1/train.jsonl --output data/spanish/tokenizer/tokenizer.json --vocab-size 4096
          python scripts/prepare_token_cache.py --data artifacts/spanish-v1/train.jsonl --tokenizer data/spanish/tokenizer/tokenizer.json --max-len 128 --output data/spanish/train_tokens_128.pt
          python - <<'PY'
          from tokenizers import Tokenizer
          t=Tokenizer.from_file("data/spanish/tokenizer/tokenizer.json")
          assert t.get_vocab_size()==4096 and t.token_to_id("[PAD]")==0 and t.token_to_id("[EOS]") is not None
          print("Tokenizer OK; vocab=4096")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-check0-shared-inputs-${{ github.run_id }}
          path: |
            artifacts/spanish-v1/
            data/spanish/
            config/lumen_cpu_profile.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  lumen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-check0-shared-inputs-${{ github.run_id }}
          path: .
      - name: Train LUMEN from check 0 — 1000 steps
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          START=$(date +%s)
          python -m train.train --steps 1000 --phase 1 --pilot-all-rows --no-sleep \
            --data artifacts/spanish-v1/train.jsonl \
            --tokenizer data/spanish/tokenizer/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/lumen_cpu_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --log-every 100 --checkpoint-every 250 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --ckpt-dir checkpoints/lumen 2>&1 | tee logs/lumen.log
          END=$(date +%s)
          echo "wall_seconds=$((END-START))" | tee logs/lumen-wall.txt
      - name: Upload LUMEN check-0 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-lumen-check0-1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  transformer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-check0-shared-inputs-${{ github.run_id }}
          path: .
      - name: Train Transformer from check 0 — 1000 steps (speed reference only)
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer logs
          START=$(date +%s)
          python -m train.transformer_baseline --steps 1000 \
            --data artifacts/spanish-v1/train.jsonl \
            --tokenizer data/spanish/tokenizer/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 1000 \
            --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer 2>&1 | tee logs/transformer.log
          END=$(date +%s)
          echo "wall_seconds=$((END-START))" | tee logs/transformer-wall.txt
      - name: Upload Transformer reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-transformer-check0-1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  summary:
    needs: [lumen, transformer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record paired outcomes
        env:
          LUMEN: ${{ needs.lumen.result }}
          TRANSFORMER: ${{ needs.transformer.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Fresh-start check-0 paired run: $RUN_ID"
          echo "LUMEN: $LUMEN"
          echo "Transformer (speed reference only): $TRANSFORMER"
          test "$LUMEN" = success
          test "$TRANSFORMER" = success
