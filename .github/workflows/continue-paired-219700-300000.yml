name: LUMEN vs Transformer — bloques emparejados de 10k hasta 400k

on:
  push:
    branches: [main]
    paths:
      - "docs/LAUNCH_PAIRED_219700_400000.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-paired-219700-400000
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "45230206330"
  DATA_RUN_ID: "45149684913"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Compile and run full test suite
        run: |
          python -m compileall -q model train scripts
          PYTHONPATH=. pytest -q tests

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install checkpoint inspection runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download promoted LUMEN parent
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step235700-45230206330
          path: lumen-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download promoted Transformer parent
        uses: actions/download-artifact@v7
        with:
          name: transformer-control-step235700-45230206330
          path: transformer-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen corpus, tokenizer and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify both promoted parents and immutable data
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          python - <<'PY'
          import hashlib, json, shutil, torch
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def resolve(root, step, arch):
              found=[]
              for p in Path(root).rglob("*.pt"):
                  try: s=torch.load(p,map_location="cpu",weights_only=False)
                  except Exception: continue
                  if isinstance(s,dict) and int(s.get("step",-1))==step and s.get("architecture_id")==arch:
                      found.append((p,s))
              if len(found)!=1: raise SystemExit(f"Expected exactly one {arch} step {step}, found {[str(p) for p,_ in found]}")
              return found[0]
          lp,ls=resolve("lumen-parent",219700,"ronin_lumen_v3_3_neuroplasticity")
          tp,ts=resolve("transformer-parent",219750,"decoder_transformer_4l_d192_h4_ff576_tied_v1")
          data="prepared/data/spanish-v2-plus-personality-250k.jsonl"
          tok="prepared/artifacts/spanish-v2/tokenizer.json"
          assert ls.get("seed")==42 and ls.get("phase")==1 and ls.get("pilot_all_rows") is True
          assert ls.get("v32_ze") is False
          lc=ls.get("training_config",{})
          assert lc.get("batch")==8 and lc.get("max_len")==128 and lc.get("lr")==3e-5 and lc.get("total_steps")==235700
          lt=ls.get("scheduler_transition")
          assert lt and int(lt.get("current_step",-1)) in (219700,219701)
          assert int(lt.get("start_step",-1))==185700 and int(lt.get("end_step",-1))==235700
          assert ls.get("optimizer") and ls.get("rng")
          assert ls.get("data_sha256")==sha(data) and ls.get("tokenizer_sha256")==sha(tok)
          profile=ls.get("runtime_profile")
          assert isinstance(profile,dict) and profile
          pl=profile.get("plasticity",{})
          assert float(pl.get("inhibition_scale",-1))==0.8 and float(pl.get("eligibility_retention",-1))==0.98
          for k in ("delta_reuse_write_update","delta_share_causal_masks","delta_always_apply_eligibility","delta_trace_norm_diagnostics_on_demand"): assert profile.get(k) is True,(k,profile.get(k))
          assert profile.get("delta_pre_normalize") is False and profile.get("homeostasis_fused_scatter") is False
          assert int(profile.get("delta_parallel_refinements",-1))==2
          assert ts.get("seed")==42
          tc=ts.get("training_config",{})
          assert tc.get("batch")==8 and tc.get("max_len")==128 and tc.get("lr")==7.5e-5 and tc.get("total_steps")==235700
          tt=ts.get("scheduler_transition")
          assert tt and int(tt.get("current_step",-1)) in (219750,219751)
          assert int(tt.get("start_step",-1))==185700 and int(tt.get("end_step",-1))==235700
          assert ts.get("optimizer") and ts.get("scheduler") and ts.get("rng")
          assert ts.get("data_sha256")==sha(data) and ts.get("tokenizer_sha256")==sha(tok)
          b=Path("bundle"); (b/"parent").mkdir(parents=True,exist_ok=True)
          (b/"data").mkdir(parents=True,exist_ok=True); (b/"artifacts").mkdir(parents=True,exist_ok=True); (b/"config").mkdir(parents=True,exist_ok=True)
          shutil.copy2(lp,b/"parent/lumen-219700.pt"); shutil.copy2(tp,b/"parent/transformer-219750.pt")
          shutil.copy2(data,b/"data/spanish-v2-plus-personality-250k.jsonl")
          shutil.copy2("prepared/data/spanish-v2-plus-personality-token-cache.pt",b/"data/spanish-v2-plus-personality-token-cache.pt")
          shutil.copy2(tok,b/"artifacts/tokenizer.json")
          (b/"config/lumen-runtime-profile.json").write_text(json.dumps(profile,indent=2)+"\\n")
          print("Both parents, exact global steps, architectures, optimizer/RNG, scheduler, shared data hashes and approved LUMEN profile verified.")
          PY
      - name: Publish immutable inputs for every block
        uses: actions/upload-artifact@v7
        with:
          name: paired-inputs-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

