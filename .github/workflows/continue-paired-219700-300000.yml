name: LUMEN vs Transformer — reanudación desde 229700 hasta 400k

on:
  push:
    branches: [main]
    paths:
      - "docs/LAUNCH_PAIRED_219700_400000.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-paired-219700-400000
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "45262377661"
  DATA_RUN_ID: "45149684913"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Compile and run full test suite
        run: |
          python -m compileall -q model train scripts
          PYTHONPATH=. pytest -q tests

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install checkpoint inspection runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download immutable prepared inputs from failed campaign
        uses: actions/download-artifact@v7
        with:
          name: paired-inputs-45262377661
          path: bundle
          repository: ${{ github.repository }}
          run-id: 45262377661
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download final LUMEN 229700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-229700-45262377661
          path: lumen-final
          repository: ${{ github.repository }}
          run-id: 45262377661
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download final Transformer 229700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-229700-45262377661
          path: transformer-final
          repository: ${{ github.repository }}
          run-id: 45262377661
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote, retarget LR and verify exact final checkpoints at 229700
        run: |
          set -euo pipefail
          test -s bundle/data/spanish-v2-plus-personality-250k.jsonl
          test -s bundle/data/spanish-v2-plus-personality-token-cache.pt
          test -s bundle/artifacts/tokenizer.json
          test -s bundle/config/lumen-runtime-profile.json
          test -s lumen-final/checkpoints/lumen/step_229700.pt
          test -s transformer-final/checkpoints/transformer/step_229700.pt
          cp lumen-final/checkpoints/lumen/step_229700.pt bundle/parent/lumen-229700.pt
          cp transformer-final/checkpoints/transformer/step_229700.pt bundle/parent/transformer-229700.pt
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          data="bundle/data/spanish-v2-plus-personality-250k.jsonl"
          tok="bundle/artifacts/tokenizer.json"
          expected={
            "lumen":("bundle/parent/lumen-229700.pt","ronin_lumen_v3_3_neuroplasticity"),
            "transformer":("bundle/parent/transformer-229700.pt","decoder_transformer_4l_d192_h4_ff576_tied_v1"),
          }
          for model,(path,arch) in expected.items():
            s=torch.load(path,map_location="cpu",weights_only=False)
            assert int(s["step"])==229700,(model,s.get("step"))
            assert s["architecture_id"]==arch,(model,s.get("architecture_id"))
            assert s.get("optimizer") and s.get("rng") and s.get("scheduler_transition"),model
            transition=s["scheduler_transition"]
            expected_transition_start={"lumen":219700,"transformer":219750}[model]
            assert int(transition.get("start_step",-1))==expected_transition_start,(model,transition)
            assert int(transition.get("end_step",-1))==400000,(model,transition)
            assert int(transition.get("current_step",-1)) in (229700,229701),(model,transition)
            assert s.get("data_sha256")==sha(data),(model,"data hash")
            assert s.get("tokenizer_sha256")==sha(tok),(model,"tokenizer hash")
            if model=="lumen":
              profile=s.get("runtime_profile",{})
              assert profile and profile==json.loads(Path("bundle/config/lumen-runtime-profile.json").read_text())
              assert profile["plasticity"]["eligibility_retention"]==0.98
              assert profile["delta_reuse_write_update"] is True
              assert profile["delta_share_causal_masks"] is True
            config=s.get("training_config")
            assert isinstance(config,dict) and config.get("lr") in (3e-5,7.5e-5)
            config["lr"]=5e-5
            torch.save(s,path)
            patched=torch.load(path,map_location="cpu",weights_only=False)
            assert patched["training_config"]["lr"]==5e-5
            assert patched["optimizer"] and patched["rng"] and patched["scheduler_transition"]
            print("Verified final checkpoint and retargeted LR",model,229700,5e-5)
          PY
      - name: Publish immutable inputs for every block
        uses: actions/upload-artifact@v7
        with:
          name: paired-inputs-${{ github.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

