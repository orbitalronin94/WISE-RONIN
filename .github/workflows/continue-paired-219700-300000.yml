name: LUMEN vs Transformer — paired continuation 219700/219750 to 300000

on:
  push:
    branches: [main]
    paths:
      - "docs/LAUNCH_PAIRED_219700_300000.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-paired-219700-300000
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "45230206330"
  DATA_RUN_ID: "45149684913"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "ACTIVE"
  OMP_PROC_BIND: "close"
  OMP_PLACES: "cores"
  KMP_BLOCKTIME: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm pytest
      - name: Compile and run tests
        run: |
          python -m compileall -q model train scripts
          PYTHONPATH=. pytest -q tests

  train-lumen:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download promoted LUMEN parent artifact
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step235700-45230206330
          path: lumen-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen corpus, tokenizer, token cache and holdout
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify promoted LUMEN checkpoint and embedded runtime profile
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          root=Path("lumen-parent")
          data=Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer=Path("prepared/artifacts/spanish-v2/tokenizer.json")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          matches=[]
          for p in root.rglob("*.pt"):
              try: s=torch.load(p,map_location="cpu",weights_only=False)
              except Exception: continue
              if isinstance(s,dict) and int(s.get("step",-1))==219700 and s.get("architecture_id")=="ronin_lumen_v3_3_neuroplasticity":
                  matches.append((p,s))
          if len(matches)!=1:
              raise SystemExit(f"Expected one LUMEN step-219700 checkpoint by internal metadata; found {[str(p) for p,_ in matches]}")
          src,s=matches[0]
          assert s.get("seed")==42 and s.get("phase")==1 and s.get("pilot_all_rows") is True
          assert s.get("v32_ze") is False
          assert s.get("training_config",{}).get("batch")==8
          assert s.get("training_config",{}).get("max_len")==128
          assert s.get("training_config",{}).get("lr")==3e-5
          assert s.get("training_config",{}).get("total_steps")==235700
          assert s.get("scheduler_transition") and s.get("optimizer") and s.get("rng")
          tr=s["scheduler_transition"]
          assert int(tr.get("current_step",-1)) in (219700,219701), tr
          assert int(tr.get("start_step",-1))==185700 and int(tr.get("end_step",-1))==235700, tr
          assert s.get("data_sha256")==sha(data)
          assert s.get("tokenizer_sha256")==sha(tokenizer)
          profile=s.get("runtime_profile")
          assert isinstance(profile,dict) and profile, "Checkpoint does not contain its runtime profile"
          plasticity=profile.get("plasticity",{})
          assert float(plasticity.get("inhibition_scale",-1))==0.80, plasticity
          assert float(plasticity.get("eligibility_retention",-1))==0.98, plasticity
          for key in ("delta_reuse_write_update","delta_share_causal_masks","delta_always_apply_eligibility","delta_trace_norm_diagnostics_on_demand"):
              assert profile.get(key) is True, (key,profile.get(key))
          assert profile.get("delta_pre_normalize") is False
          assert profile.get("homeostasis_fused_scatter") is False
          assert int(profile.get("delta_parallel_refinements",-1))==2
          Path("resolved").mkdir(exist_ok=True)
          Path("config").mkdir(exist_ok=True)
          import shutil
          shutil.copy2(src,"resolved/lumen-219700.pt")
          Path("config/lumen-runtime-profile.json").write_text(json.dumps(profile,indent=2)+"\n")
          print("Promoted LUMEN parent:",src,"internal_step=219700")
          print("Architecture:",s["architecture_id"])
          print("Original transition:",tr)
          print("Runtime profile extracted from the checkpoint; plasticity and Delta fast paths verified.")
          print("data_sha256:",sha(data))
          print("tokenizer_sha256:",sha(tokenizer))
          PY
      - name: Continue LUMEN from 219700 to 300000, preserving optimizer and RNG
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          CHECKPOINT="resolved/lumen-219700.pt"
          CURRENT=219700
          for TARGET in 229700 239700 249700 259700 269700 279700 289700 299700 300000; do
            STEPS=$((TARGET-CURRENT))
            RESTART=()
            if [ "$CURRENT" -eq 219700 ]; then RESTART=(--restart-scheduler-transition); fi
            echo "LUMEN continuation: $CURRENT -> $TARGET ($STEPS updates)"
            OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python -m train.train \
              --steps "$STEPS" --resume "$CHECKPOINT" \
              --phase 1 --pilot-all-rows \
              --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
              --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
              --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
              --batch 8 --max-len 128 --seed 42 \
              --runtime-profile config/lumen-runtime-profile.json \
              --lr 3e-5 --warmup 100 --total-steps 300000 \
              --scheduler-transition "${RESTART[@]}" \
              --transition-start 219700 --transition-end 300000 \
              --warmup-transition 100 --transition-plateau-steps 0 \
              --transition-min-lr-ratio 0.5 \
              --log-every 100 --checkpoint-every 1000 \
              --recovery-checkpoint-every 100 --parameter-check-every 100 \
              --threads 4 --interop-threads 2 \
              --ckpt-dir checkpoints/lumen --wall-clock-file lumen-wall.json \
              2>&1 | tee -a logs/lumen-219700-300000.log
            CHECKPOINT="checkpoints/lumen/step_${TARGET}.pt"
            test -s "$CHECKPOINT"
            CURRENT="$TARGET"
          done
      - name: Verify final LUMEN step 300000
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen/step_300000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==300000
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["optimizer"] and s["rng"] and s["scheduler_transition"]
          assert s["runtime_profile"]["plasticity"]["eligibility_retention"]==0.98
          assert s["runtime_profile"]["delta_reuse_write_update"] is True
          assert s["runtime_profile"]["delta_share_causal_masks"] is True
          print("Verified promoted LUMEN lineage at step 300000; optimizer, RNG, organs and runtime profile preserved.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lumen-approved-neuroplasticity-step300000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/lumen-219700-300000.log
            lumen-wall.json
            config/lumen-runtime-profile.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  train-transformer:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download promoted Transformer parent artifact
        uses: actions/download-artifact@v7
        with:
          name: transformer-control-step235700-45230206330
          path: transformer-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen corpus, tokenizer and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify promoted Transformer checkpoint
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          python - <<'PY'
          import hashlib, torch
          from pathlib import Path
          root=Path("transformer-parent")
          data=Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer=Path("prepared/artifacts/spanish-v2/tokenizer.json")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          matches=[]
          for p in root.rglob("*.pt"):
              try: s=torch.load(p,map_location="cpu",weights_only=False)
              except Exception: continue
              if isinstance(s,dict) and int(s.get("step",-1))==219750 and s.get("architecture_id")=="decoder_transformer_4l_d192_h4_ff576_tied_v1":
                  matches.append((p,s))
          if len(matches)!=1:
              raise SystemExit(f"Expected one Transformer step-219750 checkpoint by internal metadata; found {[str(p) for p,_ in matches]}")
          src,s=matches[0]
          cfg=s.get("training_config",{})
          assert s.get("seed")==42
          assert cfg.get("batch")==8 and cfg.get("max_len")==128
          assert cfg.get("lr")==7.5e-5 and cfg.get("total_steps")==235700
          tr=s.get("scheduler_transition")
          assert tr and s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(tr.get("current_step",-1)) in (219750,219751), tr
          assert int(tr.get("start_step",-1))==185700 and int(tr.get("end_step",-1))==235700, tr
          assert s.get("data_sha256")==sha(data)
          assert s.get("tokenizer_sha256")==sha(tokenizer)
          Path("resolved").mkdir(exist_ok=True)
          import shutil
          shutil.copy2(src,"resolved/transformer-219750.pt")
          print("Promoted Transformer parent:",src,"internal_step=219750")
          print("Architecture:",s["architecture_id"])
          print("Original transition:",tr)
          print("data_sha256:",sha(data))
          print("tokenizer_sha256:",sha(tokenizer))
          PY
      - name: Continue Transformer from 219750 to 300000, preserving optimizer and RNG
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer logs
          CHECKPOINT="resolved/transformer-219750.pt"
          CURRENT=219750
          for TARGET in 229750 239750 249750 259750 269750 279750 289750 299750 300000; do
            STEPS=$((TARGET-CURRENT))
            RESTART=()
            if [ "$CURRENT" -eq 219750 ]; then RESTART=(--restart-scheduler-transition); fi
            echo "Transformer continuation: $CURRENT -> $TARGET ($STEPS updates)"
            OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python -m train.transformer_baseline \
              --steps "$STEPS" --resume "$CHECKPOINT" \
              --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
              --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
              --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
              --batch 8 --max-len 128 --seed 42 --threads 4 \
              --lr 7.5e-5 --warmup 100 --total-steps 300000 \
              --scheduler-transition "${RESTART[@]}" \
              --transition-start 219750 --transition-end 300000 \
              --warmup-transition 100 --transition-plateau-steps 0 \
              --transition-min-lr-ratio 0.5 \
              --parameter-check-every 100 \
              --ckpt-dir checkpoints/transformer --wall-clock-file transformer-wall.json \
              2>&1 | tee -a logs/transformer-219750-300000.log
            CHECKPOINT="checkpoints/transformer/step_${TARGET}.pt"
            test -s "$CHECKPOINT"
            CURRENT="$TARGET"
          done
      - name: Verify final Transformer step 300000
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer/step_300000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==300000
          assert s["architecture_id"]=="decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert s["optimizer"] and s["rng"] and s["scheduler_transition"]
          print("Verified Transformer control lineage at step 300000; optimizer and RNG preserved.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transformer-control-step300000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/transformer-219750-300000.log
            transformer-wall.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  paired-summary:
    needs: [validate, train-lumen, train-transformer]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report paired continuation outcomes
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LUMEN_RESULT: ${{ needs.train-lumen.result }}
          TRANSFORMER_RESULT: ${{ needs.train-transformer.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Paired continuation 219700/219750 -> 300000: run $RUN_ID"
          echo "Validation: $VALIDATE_RESULT"
          echo "LUMEN: $LUMEN_RESULT"
          echo "Transformer: $TRANSFORMER_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$LUMEN_RESULT" = success
          test "$TRANSFORMER_RESULT" = success
