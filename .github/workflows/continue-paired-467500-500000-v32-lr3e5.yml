name: LUMEN vs Transformer — v3.2.005 continuation 467500 to 500000 (LR 3e-5)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/continue-paired-467500-500000-v32-lr3e5.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-v32-paired-467500-500000-lr3e5
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "45412283909"
  TARGET_LR: "3e-5"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install checkpoint inspection runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
      - name: Download exact verified v3.2.005 inputs from step-467500 run
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-45412283909
          path: source-inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-467500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-467500-v32-45412283909
          path: source-lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-467500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-467500-v32-45412283909
          path: source-transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen corpus, tokenizer, model and optimizer lineage
        shell: bash
        run: |
          set -euo pipefail
          test -s source-inputs/data/spanish-v3-2.005-train.jsonl
          test -s source-inputs/data/spanish-v3-2.005-token-cache.pt
          test -s source-inputs/artifacts/tokenizer.json
          test -s source-inputs/config/lumen-runtime-profile.json
          test -s source-inputs/eval/holdout_multiple_choice.jsonl
          test -s source-lumen/checkpoint/step_467500.pt
          test -s source-transformer/checkpoint/step_467500.pt
          mkdir -p prepared parents/lumen/checkpoint parents/transformer/checkpoint
          cp -a source-inputs/. prepared/
          cp source-lumen/checkpoint/step_467500.pt parents/lumen/checkpoint/step_467500.pt
          cp source-transformer/checkpoint/step_467500.pt parents/transformer/checkpoint/step_467500.pt
          if [ -s source-lumen/lumen-wall.json ]; then cp source-lumen/lumen-wall.json parents/lumen/lumen-wall.json; fi
          if [ -s source-transformer/transformer-wall.json ]; then cp source-transformer/transformer-wall.json parents/transformer/transformer-wall.json; fi
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          root=Path("prepared")
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads((root/"data/spanish-v3-2.005-manifest.json").read_text())
          tok_sha=sha(root/"artifacts/tokenizer.json")
          assert manifest["total_train_rows"]==279613
          assert manifest["user_training_authorized"] is True
          assert tok_sha=="d7869c11809a28085d5156638086c4831a3dcbacfda4a60b69ec71e26ed3fefe"
          assert len([x for x in (root/"eval/holdout_multiple_choice.jsonl").read_text().splitlines() if x.strip()])==2431
          arches={"lumen":"ronin_lumen_v3_3_neuroplasticity","transformer":"decoder_transformer_4l_d192_h4_ff576_tied_v1"}
          for model in ("lumen","transformer"):
            p=Path("parents")/model/"checkpoint/step_467500.pt"
            s=torch.load(p,map_location="cpu",weights_only=False)
            assert int(s["step"])==467500 and s["architecture_id"]==arches[model]
            assert s.get("optimizer") and s.get("rng") and s.get("scheduler_transition")
            assert s.get("data_sha256")==manifest["data_sha256"] and s.get("tokenizer_sha256")==tok_sha
            t=s["scheduler_transition"]
            assert int(t["start_step"])==417500 and int(t["end_step"])==467500
            assert int(t["current_step"]) in (467500,467501),t
            cfg=s.get("training_config") or {}
            assert abs(float(cfg.get("lr",-1))-3e-5)<1e-12
            assert int(cfg.get("total_steps",-1))==467500
            if model=="lumen":
              assert s.get("runtime_profile",{}).get("profile_id")=="check0_selected_H02_H03_H04_H05_H06_H09_H18"
              assert s.get("compute_policy",{}).get("lazy_backward") is True
            print(f"{model}: step 467500; data/tokenizer hashes match; optimizer/RNG retained; prior transition ends at 467500")
          print(json.dumps({"train_rows":manifest["total_train_rows"],"tokenizer_sha256":tok_sha,"holdout_rows":2431,"parent_step":467500,"target_step":500000,"block_size":10000,"final_block":2500,"target_lr":3e-5},indent=2))
          PY
      - name: Publish frozen training inputs for this run
        uses: actions/upload-artifact@v7
        with:
          name: paired-v32-inputs-${{ github.run_id }}
          path: prepared/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish LUMEN parent step-467500
        uses: actions/upload-artifact@v7
        with:
          name: lumen-step-467500-v32-${{ github.run_id }}
          path: parents/lumen/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish Transformer parent step-467500
        uses: actions/upload-artifact@v7
        with:
          name: transformer-step-467500-v32-${{ github.run_id }}
          path: parents/transformer/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

  lumen-477500:
    needs: prepare
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: lumen
      parent_step: 467500
      target_step: 477500
      steps: 10000
      parent_artifact: lumen-step-467500-v32-${{ github.run_id }}
      restart_scheduler_transition: true
  lumen-487500:
    needs: lumen-477500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: lumen
      parent_step: 477500
      target_step: 487500
      steps: 10000
      parent_artifact: lumen-step-477500-v32-${{ github.run_id }}
  lumen-497500:
    needs: lumen-487500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: lumen
      parent_step: 487500
      target_step: 497500
      steps: 10000
      parent_artifact: lumen-step-487500-v32-${{ github.run_id }}
  lumen-500000:
    needs: lumen-497500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: lumen
      parent_step: 497500
      target_step: 500000
      steps: 2500
      parent_artifact: lumen-step-497500-v32-${{ github.run_id }}

  transformer-477500:
    needs: prepare
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: transformer
      parent_step: 467500
      target_step: 477500
      steps: 10000
      parent_artifact: transformer-step-467500-v32-${{ github.run_id }}
      restart_scheduler_transition: true
  transformer-487500:
    needs: transformer-477500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: transformer
      parent_step: 477500
      target_step: 487500
      steps: 10000
      parent_artifact: transformer-step-477500-v32-${{ github.run_id }}
  transformer-497500:
    needs: transformer-487500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: transformer
      parent_step: 487500
      target_step: 497500
      steps: 10000
      parent_artifact: transformer-step-487500-v32-${{ github.run_id }}
  transformer-500000:
    needs: transformer-497500
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-500k.yml
    with:
      model: transformer
      parent_step: 497500
      target_step: 500000
      steps: 2500
      parent_artifact: transformer-step-497500-v32-${{ github.run_id }}

  final-holdout:
    needs: [lumen-500000, transformer-500000]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen v3.2.005 evaluation inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-${{ github.run_id }}
          path: inputs
      - name: Download final LUMEN checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-500000-v32-${{ github.run_id }}
          path: lumen
      - name: Download final Transformer checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-500000-v32-${{ github.run_id }}
          path: transformer
      - name: Evaluate both step-500000 checkpoints on unchanged holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoint/step_500000.pt \
            --transformer transformer/checkpoint/step_500000.pt \
            --expected-lumen-step 500000 --expected-transformer-step 500000 \
            --out results/v32_step500000_paired_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-v32-step500000-paired-holdout-${{ github.run_id }}
          path: results/v32_step500000_paired_holdout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
