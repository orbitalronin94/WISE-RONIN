    uses: ./.github/workflows/train-paired-block-v32-lr3e5-750k.yml
    with:
      model: transformer
      parent_step: 740000
      target_step: 750000
      steps: 10000
      parent_artifact: transformer-step-740000-v32-750k-${{ github.run_id }}
      restart_scheduler_transition: false
  final-holdout:
    needs: [lumen-750000, transformer-750000]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen v3.2.005 evaluation inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-500000-${{ github.run_id }}
          path: inputs
      - name: Download final LUMEN checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-750000-v32-750k-${{ github.run_id }}
          path: lumen
      - name: Download final Transformer checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-750000-v32-750k-${{ github.run_id }}
          path: transformer
      - name: Evaluate both step-750000 checkpoints on unchanged holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoint/step_750000.pt \
            --transformer transformer/checkpoint/step_750000.pt \
            --expected-lumen-step 750000 --expected-transformer-step 750000 \
            --out results/v32_step750000_paired_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-v32-step750000-paired-holdout-${{ github.run_id }}
          path: results/v32_step750000_paired_holdout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
