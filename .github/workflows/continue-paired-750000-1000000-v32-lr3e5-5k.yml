      target_step: 1000000
      steps: 5000
      parent_artifact: transformer-step-995000-v32-1m-${{ github.run_id }}
      restart_scheduler_transition: false
  final-holdout:
    needs: [lumen-1000000, transformer-1000000]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download exact frozen v3.2.005 evaluation inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-750000-${{ github.run_id }}
          path: inputs
      - name: Download final LUMEN checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-1000000-v32-1m-${{ github.run_id }}
          path: lumen
      - name: Download final Transformer checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-1000000-v32-1m-${{ github.run_id }}
          path: transformer
      - name: Evaluate both step-1000000 checkpoints on unchanged sealed holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("inputs/eval/holdout_multiple_choice.jsonl")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
          assert len([x for x in p.read_text().splitlines() if x.strip()])==2431
          PY
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoint/step_1000000.pt \
            --transformer transformer/checkpoint/step_1000000.pt \
            --expected-lumen-step 1000000 --expected-transformer-step 1000000 \
            --out results/v32_step1000000_paired_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-v32-step1000000-paired-holdout-${{ github.run_id }}
          path: results/v32_step1000000_paired_holdout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

# Retrigger after installing the reusable 5k block workflow on main.
