name: LUMEN vs Transformer — v3.2.005 continuation 750000 to 1000000 (5k blocks, LR 3e-5)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/continue-paired-750000-1000000-v32-lr3e5-5k.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-v32-paired-750000-1000000-5k
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "45480785478"
  TARGET_LR: "3e-5"
  DATA_SHA256: "0f7db9d6c4264f68fd6a12a9fe5bfa708e4fc30c1df176de5a4f53081bfe79aa"
  TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
  HOLDOUT_SHA256: "e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      lumen_artifact: lumen-step-750000-v32-1m-${{ github.run_id }}
      transformer_artifact: transformer-step-750000-v32-1m-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install checkpoint inspection runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
      - name: Download exact v3.2.005 inputs from verified 750k run
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-500000-45480785478
          path: source-inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-750000 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-750000-v32-750k-45480785478
          path: source-lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-750000 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-750000-v32-750k-45480785478
          path: source-transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify sealed inputs and both exact parent checkpoints
        run: |
          set -euo pipefail
          test -s source-inputs/data/spanish-v3-2.005-train.jsonl
          test -s source-inputs/data/spanish-v3-2.005-token-cache.pt
          test -s source-inputs/artifacts/tokenizer.json
          test -s source-inputs/config/lumen-runtime-profile.json
          test -s source-inputs/eval/holdout_multiple_choice.jsonl
          test -s source-lumen/checkpoint/step_750000.pt
          test -s source-transformer/checkpoint/step_750000.pt
          mkdir -p prepared parents/lumen/checkpoint parents/transformer/checkpoint
          cp -a source-inputs/. prepared/
          cp source-lumen/checkpoint/step_750000.pt parents/lumen/checkpoint/step_750000.pt
          cp source-transformer/checkpoint/step_750000.pt parents/transformer/checkpoint/step_750000.pt
          if [ -s source-lumen/lumen-wall.json ]; then cp source-lumen/lumen-wall.json parents/lumen/lumen-wall.json; fi
          if [ -s source-transformer/transformer-wall.json ]; then cp source-transformer/transformer-wall.json parents/transformer/transformer-wall.json; fi
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          root=Path("prepared")
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads((root/"data/spanish-v3-2.005-manifest.json").read_text())
          assert manifest["total_train_rows"]==279613 and manifest["user_training_authorized"] is True
          assert manifest["data_sha256"]=="0f7db9d6c4264f68fd6a12a9fe5bfa708e4fc30c1df176de5a4f53081bfe79aa"
          assert sha(root/"data/spanish-v3-2.005-train.jsonl")==manifest["data_sha256"]
          assert sha(root/"artifacts/tokenizer.json")=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert sha(root/"eval/holdout_multiple_choice.jsonl")=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
          assert len([x for x in (root/"eval/holdout_multiple_choice.jsonl").read_text().splitlines() if x.strip()])==2431
          arches={"lumen":"ronin_lumen_v3_3_neuroplasticity","transformer":"decoder_transformer_4l_d192_h4_ff576_tied_v1"}
          for model in ("lumen","transformer"):
            p=Path("parents")/model/"checkpoint/step_750000.pt"
            s=torch.load(p,map_location="cpu",weights_only=False)
            assert int(s["step"])==750000 and s["architecture_id"]==arches[model]
            assert s.get("optimizer") and s.get("rng") and s.get("scheduler") and s.get("scheduler_transition")
            assert s.get("data_sha256")==manifest["data_sha256"]
            assert s.get("tokenizer_sha256")==sha(root/"artifacts/tokenizer.json")
            assert abs(float(s["training_config"]["lr"])-3e-5)<1e-12
            assert int(s["scheduler_transition"]["current_step"]) in (750000,750001)
            assert int(s["scheduler_transition"]["start_step"])==500000
            assert int(s["scheduler_transition"]["end_step"])==750000
            assert abs(float(s["optimizer"]["param_groups"][0]["lr"])-1.5e-5)<1e-10
            if model=="lumen":
              assert s.get("runtime_profile",{}).get("profile_id")=="check0_selected_H02_H03_H04_H05_H06_H09_H18"
              assert s.get("compute_policy",{}).get("lazy_backward") is True
            print(f"{model}: step 750000; optimizer/RNG/scheduler and lineage verified")
          print(json.dumps({"parent_step":750000,"target_step":1000000,"block_size":5000,"blocks_per_model":50,"models":2,"train_rows":manifest["total_train_rows"],"holdout_rows":2431},indent=2))
          PY
      - name: Publish immutable training inputs for this run
        uses: actions/upload-artifact@v7
        with:
          name: paired-v32-inputs-750000-${{ github.run_id }}
          path: prepared/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish LUMEN step-750000 parent
        uses: actions/upload-artifact@v7
        with:
          name: lumen-step-750000-v32-1m-${{ github.run_id }}
          path: parents/lumen/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish Transformer step-750000 parent
        uses: actions/upload-artifact@v7
        with:
          name: transformer-step-750000-v32-1m-${{ github.run_id }}
          path: parents/transformer/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

