  transformer-990000:
    needs: transformer-980000
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-1m.yml
    with:
      model: transformer
      parent_step: 980000
      target_step: 990000
      steps: 10000
      parent_artifact: transformer-step-980000-v32-1m-${{ github.run_id }}
      restart_scheduler_transition: false
  transformer-1000000:
    needs: transformer-990000
    uses: ./.github/workflows/train-paired-block-v32-lr3e5-1m.yml
    with:
      model: transformer
      parent_step: 990000
      target_step: 1000000
      steps: 10000
      parent_artifact: transformer-step-990000-v32-1m-${{ github.run_id }}
      restart_scheduler_transition: false
  final-holdout:
    needs: [lumen-1000000, transformer-1000000]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen v3.2.005 evaluation inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-750000-${{ github.run_id }}
          path: inputs
      - name: Download final lumen checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-1000000-v32-1m-${{ github.run_id }}
          path: lumen
      - name: Download final transformer checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-1000000-v32-1m-${{ github.run_id }}
          path: transformer
      - name: Evaluate both step-1000000 checkpoints on unchanged sealed holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \\
            --holdout inputs/eval/holdout_multiple_choice.jsonl \\
            --tokenizer inputs/artifacts/tokenizer.json \\
            --lumen lumen/checkpoint/step_1000000.pt \\
            --transformer transformer/checkpoint/step_1000000.pt \\
            --expected-lumen-step 1000000 --expected-transformer-step 1000000 \\
            --out results/v32_step1000000_paired_holdout.json \\
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-v32-step1000000-paired-holdout-${{ github.run_id }}
          path: results/v32_step1000000_paired_holdout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
