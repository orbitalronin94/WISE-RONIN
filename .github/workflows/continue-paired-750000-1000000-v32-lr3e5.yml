name: LUMEN vs Transformer — v3.2.005 continuation 750000 to 1000000 (10k blocks, LR 3e-5)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/continue-paired-750000-1000000-v32-lr3e5.yml
      - .github/workflows/train-paired-block-v32-lr3e5-1m.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ronin-v32-paired-750000-1000000-lr3e5
  cancel-in-progress: false
env:
  SOURCE_RUN_ID: "45480785478"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install checkpoint inspection runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
      - name: Download exact frozen v3.2.005 inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-500000-45480785478
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-750000 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-750000-v32-750k-45480785478
          path: source-lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-750000 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-750000-v32-750k-45480785478
          path: source-transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact parent lineage, optimizer state, corpus and holdout
        shell: bash
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v3-2.005-train.jsonl
          test -s prepared/data/spanish-v3-2.005-token-cache.pt
          test -s prepared/artifacts/tokenizer.json
          test -s prepared/config/lumen-runtime-profile.json
          test -s prepared/eval/holdout_multiple_choice.jsonl
          test -s source-lumen/checkpoint/step_750000.pt
          test -s source-transformer/checkpoint/step_750000.pt
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          root=Path('prepared')
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads((root/'data/spanish-v3-2.005-manifest.json').read_text())
          data_sha=sha(root/'data/spanish-v3-2.005-train.jsonl')
          tok_sha=sha(root/'artifacts/tokenizer.json')
          holdout_sha=sha(root/'eval/holdout_multiple_choice.jsonl')
          assert manifest['total_train_rows']==279613 and manifest['user_training_authorized'] is True
          assert data_sha=='0f7db9d6c4264f68fd6a12a9fe5bfa708e4fc30c1df176de5a4f53081bfe79aa'
          assert tok_sha=='d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe'
          assert holdout_sha=='e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359'
          assert sum(1 for x in (root/'eval/holdout_multiple_choice.jsonl').open() if x.strip())==2431
          arches={'lumen':'ronin_lumen_v3_3_neuroplasticity','transformer':'decoder_transformer_4l_d192_h4_ff576_tied_v1'}
          paths={'lumen':Path('source-lumen/checkpoint/step_750000.pt'),'transformer':Path('source-transformer/checkpoint/step_750000.pt')}
          expected_params={'lumen':2281841,'transformer':2295168}
          for model,p in paths.items():
            s=torch.load(p,map_location='cpu',weights_only=False)
            t=s['scheduler_transition']
            assert int(s['step'])==750000 and s['architecture_id']==arches[model]
            assert int(s['params'])==expected_params[model]
            assert s.get('optimizer') and s.get('scheduler') and s.get('rng')
            assert s.get('data_sha256')==data_sha and s.get('tokenizer_sha256')==tok_sha
            assert abs(float(s['training_config']['lr'])-3e-5)<1e-12
            assert int(t['start_step'])==500000 and int(t['end_step'])==750000 and int(t['current_step']) in (750000,750001),t
            if model=='lumen':
              assert s.get('runtime_profile',{}).get('profile_id')=='check0_selected_H02_H03_H04_H05_H06_H09_H18'
              assert s.get('compute_policy',{}).get('lazy_backward') is True
            print(model,'step 750000: parent, optimizer, scheduler, RNG, corpus and tokenizer verified')
          print(json.dumps({'source_run':45480785478,'train_rows':manifest['total_train_rows'],'data_sha256':data_sha,'tokenizer_sha256':tok_sha,'holdout_rows':2431,'holdout_sha256':holdout_sha,'parent_step':750000,'target_step':1000000,'block_size':10000,'blocks_per_model':25},indent=2))
          PY
          mkdir -p parents/lumen/checkpoint parents/transformer/checkpoint
          cp source-lumen/checkpoint/step_750000.pt parents/lumen/checkpoint/step_750000.pt
          cp source-transformer/checkpoint/step_750000.pt parents/transformer/checkpoint/step_750000.pt
          if [ -s source-lumen/lumen-wall.json ]; then cp source-lumen/lumen-wall.json parents/lumen/lumen-wall.json; fi
          if [ -s source-transformer/transformer-wall.json ]; then cp source-transformer/transformer-wall.json parents/transformer/transformer-wall.json; fi
      - name: Publish frozen v3.2.005 inputs for this run
        uses: actions/upload-artifact@v7
        with:
          name: paired-v32-inputs-750000-${{ github.run_id }}
          path: prepared/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish lumen parent step-750000
        uses: actions/upload-artifact@v7
        with:
          name: lumen-step-750000-v32-1m-${{ github.run_id }}
          path: parents/lumen/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish transformer parent step-750000
        uses: actions/upload-artifact@v7
        with:
          name: transformer-step-750000-v32-1m-${{ github.run_id }}
          path: parents/transformer/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  lumen-760000:
    needs: prepare
