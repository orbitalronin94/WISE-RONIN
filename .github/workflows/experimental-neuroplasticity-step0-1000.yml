name: Neuroplasticity Lumen vs Transformer — fresh 0 to 1000

on:
  # The sentinel is updated only after the shared corpus v2 artifact is frozen.
  push:
    branches: [experiment/neuroplasticity-step0-1000]
    paths:
      - "docs/LAUNCH_NEUROPLASTICITY_RUN.txt"
permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-neuroplasticity-fresh-0-1000
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  CORPUS_RUN_ID: "45065384110"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" langid tokenizers numpy tqdm pytest
      - name: Compile and run complete test suite
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime and tokenizer tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen shared Spanish corpus v2
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v2-${{ env.CORPUS_RUN_ID }}
          path: artifacts/spanish-v2
          repository: ${{ github.repository }}
          run-id: ${{ env.CORPUS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest, shared tokenizer and protected splits
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from tokenizers import Tokenizer
          root = Path("artifacts/spanish-v2")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["status"] == "FROZEN_BUILD_OUTPUT", manifest["status"]
          assert manifest["language"] == "es"
          assert manifest["shared_by"] == ["Lumen", "Transformer"]
          assert manifest["tokenizer_vocab_size"] == 4096
          assert manifest["validation_rows"] == 1413
          assert manifest["holdout_rows"] == 2431
          assert manifest["train_rows"] > manifest["base_train_rows"]
          for name, expected in manifest["sha256"].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == expected, (name, actual, expected)
          tokenizer = Tokenizer.from_file(str(root / "tokenizer.json"))
          assert tokenizer.get_vocab_size() == 4096
          assert tokenizer.token_to_id("[PAD]") == 0
          assert tokenizer.token_to_id("[EOS]") is not None
          assert hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest() == manifest["tokenizer_sha256"]
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Build one shared token cache
        run: |
          mkdir -p data/spanish
          python scripts/prepare_token_cache.py \
            --data artifacts/spanish-v2/train.jsonl \
            --tokenizer artifacts/spanish-v2/tokenizer.json \
            --max-len 128 \
            --output data/spanish/train_tokens_128.pt
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-neuroplasticity-prepared-${{ github.run_id }}
          path: |
            artifacts/spanish-v2/
            data/spanish/train_tokens_128.pt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  train-lumen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-neuroplasticity-prepared-${{ github.run_id }}
          path: .
      - name: Fresh Lumen neuroplasticity training — step 0 to 1000
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          python -m train.train \
            --steps 1000 --phase 1 --pilot-all-rows \
            --data artifacts/spanish-v2/train.jsonl \
            --tokenizer artifacts/spanish-v2/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/lumen_cpu_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --log-every 100 --checkpoint-every 250 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --ckpt-dir checkpoints/lumen 2>&1 | tee logs/lumen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-neuroplasticity-lumen-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/lumen.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  train-transformer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-neuroplasticity-prepared-${{ github.run_id }}
          path: .
      - name: Fresh Transformer control training — step 0 to 1000
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer logs
          python -m train.transformer_baseline \
            --steps 1000 \
            --data artifacts/spanish-v2/train.jsonl \
            --tokenizer artifacts/spanish-v2/tokenizer.json \
            --token-cache data/spanish/train_tokens_128.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 1000 \
            --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer 2>&1 | tee logs/transformer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-neuroplasticity-transformer-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/transformer.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  paired-summary:
    needs: [train-lumen, train-transformer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report paired job outcomes
        env:
          LUMEN_RESULT: ${{ needs.train-lumen.result }}
          TRANSFORMER_RESULT: ${{ needs.train-transformer.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Fresh neuroplasticity experiment run: $RUN_ID"
          echo "Lumen: $LUMEN_RESULT"
          echo "Transformer: $TRANSFORMER_RESULT"
          test "$LUMEN_RESULT" = success
          test "$TRANSFORMER_RESULT" = success
