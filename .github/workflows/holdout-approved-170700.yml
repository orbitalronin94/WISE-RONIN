name: LUMEN vs Transformer — paired holdout at 170700

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/holdout-approved-170700.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-holdout-170700
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "45177953462"
  DATA_RUN_ID: "45149684913"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"

jobs:
  paired-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download frozen v2 plus personality corpus and holdout
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Lumen checkpoint from completed 170700 training
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step170700-45177953462
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Transformer checkpoint from completed 170700 training
        uses: actions/download-artifact@v7
        with:
          name: transformer-control-step170700-45177953462
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact checkpoints and common untouched holdout
        run: |
          set -euo pipefail
          test -s prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          LUMEN_CKPT="$(find lumen -name step_170700.pt -print -quit)"
          TRANSFORMER_CKPT="$(find transformer -name step_170700.pt -print -quit)"
          test -n "$LUMEN_CKPT" && test -s "$LUMEN_CKPT"
          test -n "$TRANSFORMER_CKPT" && test -s "$TRANSFORMER_CKPT"
          export LUMEN_CKPT TRANSFORMER_CKPT
          python - <<'PY'
          import json, os, torch
          from pathlib import Path
          holdout=Path("prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl")
          rows=[json.loads(x) for x in holdout.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==2431, f"Expected frozen 2431-question holdout, got {len(rows)}"
          l=torch.load(os.environ["LUMEN_CKPT"],map_location="cpu",weights_only=False)
          t=torch.load(os.environ["TRANSFORMER_CKPT"],map_location="cpu",weights_only=False)
          assert int(l.get("step",-1))==170700, l.get("step")
          assert int(t.get("step",-1))==170700, t.get("step")
          print("Lumen checkpoint architecture_id:",l.get("architecture_id"))
assert isinstance(l.get("model"),dict) and l.get("model"), "Lumen checkpoint missing model state_dict"
          assert t.get("architecture_id")=="decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert l.get("tokenizer_sha256")==t.get("tokenizer_sha256")
          assert l.get("data_sha256")==t.get("data_sha256")
          assert l.get("optimizer") and t.get("optimizer")
          assert l.get("rng") and t.get("rng")
          print("Verified both step-170700 checkpoints and model state dictionaries.")
          print("Shared frozen holdout rows:",len(rows))
          print("Shared tokenizer SHA256:",l.get("tokenizer_sha256"))
          print("Shared training data SHA256:",l.get("data_sha256"))
          PY
          echo "LUMEN_CKPT=$LUMEN_CKPT" >> "$GITHUB_ENV"
          echo "TRANSFORMER_CKPT=$TRANSFORMER_CKPT" >> "$GITHUB_ENV"
      - name: Evaluate both models on the same untouched 2431-question holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p results
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --lumen "$LUMEN_CKPT" \
            --transformer "$TRANSFORMER_CKPT" \
            --expected-step 170700 \
            --out results/step170700_paired_v2_personality_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ronin-step170700-paired-v2-personality-holdout-${{ github.run_id }}
          path: results/step170700_paired_v2_personality_holdout.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report holdout result
        if: always()
        run: |
          echo "Paired 170700 holdout run: ${{ github.run_id }}"
          test -s results/step170700_paired_v2_personality_holdout.json
