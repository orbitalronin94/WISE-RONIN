name: LUMEN v3.2 holdout at step 1005000
run-name: LUMEN v3.2 holdout 1005000 — official + freeform
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/holdout-lumen-step1005000.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-holdout-step1005000
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: "45782396142"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d2981fdb01f18e88d2c46a7dc47daea6a6e7e3ea
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm scipy
      - name: Download frozen v3.2 inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-1000000-45782396142
          path: inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN and Transformer 1005000 checkpoints
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-1005000-v32-1m-45782396142
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: transformer-step-1005000-v32-1m-45782396142
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen holdout and checkpoints
        shell: bash
        run: |
          set -euo pipefail
          test -s inputs/eval/holdout_multiple_choice.jsonl
          test -s inputs/artifacts/tokenizer.json
          test -s lumen/checkpoint/step_1005000.pt
          test -s transformer/checkpoint/step_1005000.pt
          test -s data/freeform_identity_general_100.jsonl
          python - <<'PY'
          import json, torch
          from pathlib import Path
          rows=[x for x in Path("inputs/eval/holdout_multiple_choice.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==2431, len(rows)
          prompts=[json.loads(x) for x in Path("data/freeform_identity_general_100.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(prompts)==100 and prompts[0]["prompt"]=="¿Quién eres?"
          expected={"lumen":"ronin_lumen_v3_3_neuroplasticity","transformer":"decoder_transformer_4l_d192_h4_ff576_tied_v1"}
          for name,path in {"lumen":"lumen/checkpoint/step_1005000.pt","transformer":"transformer/checkpoint/step_1005000.pt"}.items():
              state=torch.load(path,map_location="cpu",weights_only=False)
              assert int(state["step"])==1005000,(name,state.get("step"))
              assert state["architecture_id"]==expected[name],(name,state.get("architecture_id"))
              print(f"{name}: verified step={state['step']} architecture={state['architecture_id']}")
          print("Verified 2431 official choice questions and 100 open questions.")
          PY
      - name: Score old LUMEN and Transformer on official 2431-question holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p results
          python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoint/step_1005000.pt \
            --transformer transformer/checkpoint/step_1005000.pt \
            --expected-lumen-step 1005000 --expected-transformer-step 1005000 \
            --out results/official_holdout_2431_step1005000.json \
            --threads 4 --max-len 128
      - name: Generate 100 fixed open-ended answers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/freeform_identity_general_holdout.py \
            --holdout data/freeform_identity_general_100.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoint/step_1005000.pt \
            --transformer transformer/checkpoint/step_1005000.pt \
            --expected-step 1005000 --sample-size 100 --seed 1005000 \
            --max-new-tokens 96 --out-dir results/freeform-step1005000 \
            --threads 4 --max-len 128
      - name: Upload old-model holdout results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumen-v32-holdout-step1005000
          path: results/
          if-no-files-found: warn
          retention-days: 90
      - name: Require both reports
        run: |
          test -s results/official_holdout_2431_step1005000.json
          test -s results/freeform-step1005000/step1005000_freeform_100.json
