name: Paired holdout — LUMEN vs Transformer step 710000

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/holdout-paired-step710k.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-paired-holdout-step710k
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_RUN_ID: "45480785478"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen v3.2.005 inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-500000-45480785478
          path: inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN 710k checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-710000-v32-750k-45480785478
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer 710k checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-710000-v32-750k-45480785478
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen data and exact checkpoint lineage
        run: |
          set -euo pipefail
          test -s inputs/eval/holdout_multiple_choice.jsonl
          test -s inputs/artifacts/tokenizer.json
          test -s lumen/checkpoints/lumen/step_710000.pt
          test -s transformer/checkpoints/transformer/step_710000.pt
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          rows=[x for x in Path("inputs/eval/holdout_multiple_choice.jsonl").read_text().splitlines() if x.strip()]
          assert len(rows)==2431, len(rows)
          expected={"lumen":"ronin_lumen_v3_3_neuroplasticity","transformer":"decoder_transformer_4l_d192_h4_ff576_tied_v1"}
          paths={"lumen":"lumen/checkpoints/lumen/step_710000.pt","transformer":"transformer/checkpoints/transformer/step_710000.pt"}
          for name,path in paths.items():
              s=torch.load(path,map_location="cpu",weights_only=False)
              assert int(s["step"])==710000, (name,s.get("step"))
              assert s["architecture_id"]==expected[name], (name,s.get("architecture_id"))
              print(f"{name}: verified step={s['step']} architecture={s['architecture_id']}")
          print("Frozen multiple-choice holdout: 2431 rows; informal subset: first 100 rows.")
          PY
      - name: Score both models on the full official choice holdout (2431)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoints/lumen/step_710000.pt \
            --transformer transformer/checkpoints/transformer/step_710000.pt \
            --expected-lumen-step 710000 --expected-transformer-step 710000 \
            --out results/paired_step710000_official_2431.json \
            --threads 4 --max-len 128
          python - <<'PY'
          import json
          p=json.load(open("results/paired_step710000_official_2431.json"))
          assert p["holdout_rows"]==2431, p["holdout_rows"]
          for name,r in p["results"].items():
              assert r["total"]==2431, (name,r["total"])
              print(f"{name}: {r['correct']}/2431 ({100*r['accuracy']:.2f}%), mean_answer_nll={r['mean_answer_nll']:.6f}")
          PY
      - name: Score both models on the unofficial first-100 subset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoints/lumen/step_710000.pt \
            --transformer transformer/checkpoints/transformer/step_710000.pt \
            --expected-lumen-step 710000 --expected-transformer-step 710000 \
            --limit 100 \
            --out results/paired_step710000_informal_first100.json \
            --threads 4 --max-len 128
          python - <<'PY'
          import json
          p=json.load(open("results/paired_step710000_informal_first100.json"))
          assert p["holdout_rows"]==100, p["holdout_rows"]
          for name,r in p["results"].items():
              assert r["total"]==100, (name,r["total"])
              print(f"{name}: {r['correct']}/100 ({100*r['accuracy']:.1f}%), mean_answer_nll={r['mean_answer_nll']:.6f}")
          print("INFORMAL SUBSET ONLY — not the official 2431-question result.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-paired-holdout-step710000-${{ github.run_id }}
          path: results/paired_step710000_*.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
