name: LUMEN vs Transformer — random 100-question holdout at step 185700

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/holdout-random100-step185700.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-random100-step185700
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "45200252793"
  DATA_RUN_ID: "45149684913"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"
  SAMPLE_SEED: "20261123"

jobs:
  paired-random-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download frozen v2 plus personality corpus and untouched holdout
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Lumen step-185700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step185700-45200252793
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-185700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-control-step185700-45200252793
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify checkpoints and draw a reproducible random sample of 100
        run: |
          set -euo pipefail
          test -s prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          LUMEN_CKPT="$(find lumen -name step_185700.pt -print -quit)"
          TRANSFORMER_CKPT="$(find transformer -name step_185700.pt -print -quit)"
          test -n "$LUMEN_CKPT" && test -s "$LUMEN_CKPT"
          test -n "$TRANSFORMER_CKPT" && test -s "$TRANSFORMER_CKPT"
          export LUMEN_CKPT TRANSFORMER_CKPT
          mkdir -p results
          python - <<'PY'
          import json, os, random, torch
          from pathlib import Path
          source=Path("prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl")
          rows=[json.loads(x) for x in source.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==2431, f"Expected frozen 2431-question holdout, got {len(rows)}"
          sample=random.Random(int(os.environ["SAMPLE_SEED"])).sample(rows,100)
          assert len(sample)==100 and len({json.dumps(x,sort_keys=True,ensure_ascii=False) for x in sample})==100
          out=Path("prepared/random100_holdout.jsonl")
          out.write_text("".join(json.dumps(x,ensure_ascii=False)+"\n" for x in sample),encoding="utf-8")
          counts={}
          for row in sample:
              n=len(row.get("choices", row.get("options", [])))
              counts[str(n)]=counts.get(str(n),0)+1
          l=torch.load(os.environ["LUMEN_CKPT"],map_location="cpu",weights_only=False)
          t=torch.load(os.environ["TRANSFORMER_CKPT"],map_location="cpu",weights_only=False)
          assert int(l.get("step",-1))==185700, l.get("step")
          assert int(t.get("step",-1))==185700, t.get("step")
          assert isinstance(l.get("model"),dict) and l.get("model")
          assert t.get("architecture_id")=="decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert l.get("tokenizer_sha256")==t.get("tokenizer_sha256")
          assert l.get("data_sha256")==t.get("data_sha256")
          assert l.get("optimizer") and t.get("optimizer")
          assert l.get("rng") and t.get("rng")
          metadata={"seed":int(os.environ["SAMPLE_SEED"]),"population":len(rows),"sample_size":len(sample),"choice_counts":counts}
          metadata["weighted_random_accuracy"]=sum(n*(1/int(k)) for k,n in counts.items())/100
          Path("results/sample_metadata.json").write_text(json.dumps(metadata,indent=2)+"\n",encoding="utf-8")
          print("Verified both step-185700 checkpoints.")
          print("Random sample metadata:",json.dumps(metadata,sort_keys=True))
          PY
          echo "LUMEN_CKPT=$LUMEN_CKPT" >> "$GITHUB_ENV"
          echo "TRANSFORMER_CKPT=$TRANSFORMER_CKPT" >> "$GITHUB_ENV"
      - name: Evaluate both models on the same random 100 questions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout prepared/random100_holdout.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --lumen "$LUMEN_CKPT" \
            --transformer "$TRANSFORMER_CKPT" \
            --expected-step 185700 \
            --out results/step185700_random100_paired_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ronin-step185700-random100-paired-holdout-${{ github.run_id }}
          path: |
            results/
            prepared/random100_holdout.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Report random holdout result
        if: always()
        run: |
          echo "Paired random-100 holdout run: ${{ github.run_id }}"
          test -s results/step185700_random100_paired_holdout.json
