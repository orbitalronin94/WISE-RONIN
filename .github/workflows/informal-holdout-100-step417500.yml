name: Informal free-form holdout — 100 preguntas abiertas, step 417500

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/informal-holdout-100-step417500.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-informal-freeform-100-step417500
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: "45405758303"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen tokenizer and paired step-417500 checkpoints
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-45405758303
          path: inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-417500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-417500-v32-45405758303
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-417500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-417500-v32-45405758303
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact checkpoints, tokenizer and open-question set
        run: |
          set -euo pipefail
          test -s inputs/artifacts/tokenizer.json
          test -s lumen/checkpoints/lumen/step_417500.pt
          test -s transformer/checkpoints/transformer/step_417500.pt
          test -s data/freeform_identity_general_100.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from tokenizers import Tokenizer

          rows=[json.loads(x) for x in Path("data/freeform_identity_general_100.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows)==100, f"Expected 100 prompts, got {len(rows)}"
          assert len({r["id"] for r in rows})==100
          assert all(isinstance(r.get("prompt"),str) and r["prompt"].strip() for r in rows)
          assert all("choices" not in r and "answer" not in r for r in rows)
          assert rows[0]["prompt"]=="¿Quién eres?"
          tok=Tokenizer.from_file("inputs/artifacts/tokenizer.json")
          for special in ("[BOS]","[EOS]","[PAD]"):
              assert tok.token_to_id(special) is not None, f"Missing tokenizer token {special}"

          paths={
              "lumen":"lumen/checkpoints/lumen/step_417500.pt",
              "transformer":"transformer/checkpoints/transformer/step_417500.pt",
          }
          states={}
          for name,path in paths.items():
              state=torch.load(path,map_location="cpu",weights_only=False)
              assert int(state.get("step",-1))==417500, (name,state.get("step"))
              assert hasattr(state.get("model"),"items") and len(state["model"])>0, (name,type(state.get("model")))
              states[name]=state
              print(f"{name}: verified step={state['step']} with model weights")
          assert states["lumen"].get("tokenizer_sha256")==states["transformer"].get("tokenizer_sha256")
          print("Verified 100 fixed open prompts: no choices, no gold answers.")
          print("Categories:", sorted({r["source"] for r in rows}))
          print("Tokenizer and paired checkpoint lineage verified.")
          PY
      - name: Generate the same 100 free-form answers from both models
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p results/freeform-step417500
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/freeform_identity_general_holdout.py \
            --holdout data/freeform_identity_general_100.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoints/lumen/step_417500.pt \
            --transformer transformer/checkpoints/transformer/step_417500.pt \
            --expected-step 417500 \
            --sample-size 100 --seed 417500 --max-new-tokens 96 \
            --out-dir results/freeform-step417500 --threads 4 --max-len 128
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("results/freeform-step417500")
          old_json=root/"step170700_identity_general_100.json"
          old_md=root/"step170700_identity_general_100.md"
          data=json.loads(old_json.read_text(encoding="utf-8"))
          assert data["step"]==417500 and data["sample_size"]==100
          assert len(data["results"])==100
          data["evaluation_note"]="Evaluación informal de generación libre. Las 100 preguntas se entregan sin opciones ni respuestas de referencia; no es una puntuación automática de exactitud."
          data["prompt_policy"]="100 preguntas abiertas fijas en español; sin opciones ni respuestas de referencia; ambos modelos reciben exactamente los mismos prompts."
          (root/"step417500_freeform_100.json").write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          md=old_md.read_text(encoding="utf-8")
          md=md.replace("170.700","417.500").replace("(170700)","(417500)")
          md=md.replace("- Se han eliminado las opciones y la respuesta correcta antes de generar.","- Las 100 preguntas son abiertas desde el origen: no contienen opciones ni respuestas de referencia.")
          md=md.replace("máximo de 64 tokens","máximo de 96 tokens")
          md += "\n\n> Sonda informal de generación libre. No equivale a una puntuación automática de exactitud ni sustituye al holdout oficial.\n"
          (root/"step417500_freeform_100.md").write_text(md,encoding="utf-8")
          old_json.unlink()
          old_md.unlink()
          for model in ("lumen","transformer"):
              assert all(isinstance(item[model]["text"],str) for item in data["results"])
          print("Generated and validated 100 paired open-ended answers.")
          print("Identity prompt:",data["results"][0]["prompt"])
          PY
      - name: Upload paired open-ended prompts and answers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ronin-informal-freeform-100-step417500-${{ github.run_id }}
          path: results/freeform-step417500/
          if-no-files-found: warn
          retention-days: 90
      - name: Report free-form evaluation
        if: always()
        run: |
          echo "Informal paired free-form holdout at step 417500: ${{ github.run_id }}"
          test -s results/freeform-step417500/step417500_freeform_100.json
          test -s results/freeform-step417500/step417500_freeform_100.md
