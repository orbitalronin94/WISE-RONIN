name: Informal 100-question holdout — step 417500

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/informal-holdout-100-step417500.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-informal-holdout-100-step417500
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "45405758303"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen v3.2.005 inputs
        uses: actions/download-artifact@v7
        with:
          name: paired-v32-inputs-45405758303
          path: inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact LUMEN step-417500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-step-417500-v32-45405758303
          path: lumen
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact Transformer step-417500 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-step-417500-v32-45405758303
          path: transformer
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen data and checkpoint lineage
        run: |
          set -euo pipefail
          test -s inputs/eval/holdout_multiple_choice.jsonl
          test -s inputs/artifacts/tokenizer.json
          test -s lumen/checkpoints/lumen/step_417500.pt
          test -s transformer/checkpoints/transformer/step_417500.pt
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          holdout=[x for x in Path("inputs/eval/holdout_multiple_choice.jsonl").read_text().splitlines() if x.strip()]
          assert len(holdout)==2431, len(holdout)
          expected={"lumen":"ronin_lumen_v3_3_neuroplasticity","transformer":"decoder_transformer_4l_d192_h4_ff576_tied_v1"}
          paths={"lumen":"lumen/checkpoints/lumen/step_417500.pt","transformer":"transformer/checkpoints/transformer/step_417500.pt"}
          for name,path in paths.items():
              s=torch.load(path,map_location="cpu",weights_only=False)
              assert int(s["step"])==417500
              assert s["architecture_id"]==expected[name]
              print(f"{name}: verified step={s['step']} architecture={s['architecture_id']}")
          print("Frozen official holdout: 2431 rows; informal subset: first 100 rows.")
          PY
      - name: Score both models on the same first 100 questions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer inputs/artifacts/tokenizer.json \
            --lumen lumen/checkpoints/lumen/step_417500.pt \
            --transformer transformer/checkpoints/transformer/step_417500.pt \
            --expected-lumen-step 417500 --expected-transformer-step 417500 \
            --limit 100 \
            --out results/informal_step417500_first100.json \
            --threads 4 --max-len 128
          python - <<'PY'
          import json
          p=json.load(open("results/informal_step417500_first100.json"))
          assert p["holdout_rows"]==100, p["holdout_rows"]
          for name,r in p["results"].items():
              assert r["total"]==100, (name,r["total"])
              print(f"{name}: {r['correct']}/100 ({100*r['accuracy']:.1f}%), mean_answer_nll={r['mean_answer_nll']:.6f}")
          print("INFORMAL SUBSET ONLY — not the official 2431-question holdout.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ronin-informal-first100-step417500-${{ github.run_id }}
          path: results/informal_step417500_first100.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
