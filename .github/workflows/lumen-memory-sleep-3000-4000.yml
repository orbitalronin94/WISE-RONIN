name: RONIN-LUMEN memory + sleep pilot 3000 to 4000

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-memory-sleep-3000-4000.yml"
      - "train/train.py"
      - "train/sleep.py"
      - "model/memory.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-memory-sleep-3000-4000
  cancel-in-progress: false

jobs:
  train-and-holdout:
    name: LUMEN 3000 to 4000 (eager, memory + sleep)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OMP_DYNAMIC: "FALSE"
      OMP_PROC_BIND: close
      OMP_PLACES: cores
      KMP_AFFINITY: "granularity=fine,compact,1,0"
    steps:
      - name: Checkout experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm

      - name: Download promoted step-3000 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-compiled-matched-3000-44940676355
          path: artifacts/promoted-step-3000
          repository: ${{ github.repository }}
          run-id: 44940676355
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen corpus, tokenizer, cache and holdouts
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-continuation-inputs-44936542271
          path: artifacts/frozen-inputs
          repository: ${{ github.repository }}
          run-id: 44936542271
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify exact parent and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen data artifacts/timing artifacts/manifests artifacts/evaluations
          cp artifacts/promoted-step-3000/checkpoints/lumen/step_3000.pt checkpoints/lumen/step_3000.pt
          cp artifacts/frozen-inputs/data/pilot_train_19k.jsonl data/pilot_train_19k.jsonl
          cp artifacts/frozen-inputs/data/pilot_train_19k.manifest.json data/pilot_train_19k.manifest.json
          cp artifacts/frozen-inputs/data/pilot_tokenized_128.pt data/pilot_tokenized_128.pt
          cp -a artifacts/frozen-inputs/data/pilot_tokenizer data/pilot_tokenizer
          cp artifacts/frozen-inputs/data/holdout_500.jsonl data/holdout_500.jsonl
          cp artifacts/frozen-inputs/artifacts/reasoning_gsm8k_500.jsonl artifacts/reasoning_gsm8k_500.jsonl
          python - <<'PY'
          import hashlib, torch
          from pathlib import Path
          checks = {
              "checkpoints/lumen/step_3000.pt": "fcfc740ae1db9e7055cba5dc39f58e9e19327a3baa78ddeb2493e9faa983e8f7",
              "data/pilot_train_19k.jsonl": "bca06a8f9a11d46bc91b79944243f37e1f0c902bd8a3c16c38dffcb05754c35c",
              "data/pilot_tokenizer/tokenizer.json": "78b353e908b312722d8de24abce2b9bdc02168e4a2d4f78a7c5a109a2d65d99f",
          }
          for path, expected in checks.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA mismatch {path}: {actual}")
          state = torch.load("checkpoints/lumen/step_3000.pt", map_location="cpu", weights_only=False)
          if state.get("step") != 3000 or state.get("seed") != 42 or state.get("tokens_seen") != 2511433:
              raise SystemExit("Promoted checkpoint metadata mismatch")
          if state.get("data_sha256") != checks["data/pilot_train_19k.jsonl"]:
              raise SystemExit("Checkpoint corpus provenance mismatch")
          if state.get("tokenizer_sha256") != checks["data/pilot_tokenizer/tokenizer.json"]:
              raise SystemExit("Checkpoint tokenizer provenance mismatch")
          cfg = state.get("training_config", {})
          if cfg.get("total_steps") != 4000 or cfg.get("scheduler_mode") != "cosine_transition_v1":
              raise SystemExit(f"Parent schedule is not the original 2000->4000 schedule: {cfg}")
          transition = state.get("scheduler_transition") or {}
          if transition.get("current_step") != 3000 or transition.get("start_step") != 2000 or transition.get("end_step") != 4000:
              raise SystemExit(f"Parent scheduler state mismatch: {transition}")
          model_state = state["model"]
          count = model_state.get("memoria.contador_lenta")
          occupied = int((count > 0).sum()) if count is not None else -1
          print(f"Verified exact parent; slow-memory occupancy={occupied}/128; scheduler resumes in place (no rebase).")
          PY

      - name: Train two resumable 500-step blocks with memory and sleep enabled
        shell: bash
        run: |
          set -euo pipefail
          resume="checkpoints/lumen/step_3000.pt"
          for target in 3500 4000; do
            test -s "$resume"
            echo "===== LUMEN: global step $((target - 500)) -> $target (500 updates) ====="
            python -m train.train \
              --steps 500 --phase 1 --pilot-all-rows \
              --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --token-cache data/pilot_tokenized_128.pt \
              --batch 8 --max-len 128 --seed 42 \
              --threads 2 --interop-threads 2 \
              --disable-mkldnn --disable-foreach --cpu-affinity \
              --lr 2e-5 --warmup 100 --total-steps 4000 \
              --scheduler-transition --transition-start 2000 --transition-end 4000 \
              --warmup-transition 20 --grad-clip 0.5 \
              --log-every 25 --checkpoint-every 250 --recovery-checkpoint-every 25 \
              --wall-clock-file artifacts/timing/lumen.json \
              --ckpt-dir checkpoints/lumen --resume "$resume"
            resume="checkpoints/lumen/step_${target}.pt"
            test -s "$resume"
          done

      - name: Run one final LUMEN-only holdout at step 4000
        run: |
          python scripts/evaluate_pilot.py \
            --data data/pilot_train_19k.jsonl \
            --tokenizer data/pilot_tokenizer/tokenizer.json \
            --lumen-ckpt checkpoints/lumen/step_4000.pt \
            --gsm8k artifacts/reasoning_gsm8k_500.jsonl \
            --historical-holdout data/holdout_500.jsonl \
            --gsm8k-limit 100 --max-new-tokens 64 \
            --expected-step 4000 --lumen-only \
            --output artifacts/evaluations/final_4000

      - name: Write memory, sleep and provenance report
        run: |
          python - <<'PY'
          import hashlib, json, os, torch
          from pathlib import Path
          checkpoint = torch.load("checkpoints/lumen/step_4000.pt", map_location="cpu", weights_only=False)
          memory = checkpoint["model"]
          counts = memory["memoria.contador_lenta"]
          occupied = int((counts > 0).sum())
          manifest = {
              "schema_version": 1,
              "experiment": "RONIN-LUMEN-memory-sleep-pilot",
              "global_step_start": 3000,
              "global_step_end": 4000,
              "updates": 1000,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "git_sha": os.environ["GITHUB_SHA"],
              "parent_checkpoint_sha256": hashlib.sha256(Path("checkpoints/lumen/step_3000.pt").read_bytes()).hexdigest(),
              "checkpoint_sha256": hashlib.sha256(Path("checkpoints/lumen/step_4000.pt").read_bytes()).hexdigest(),
              "corpus_sha256": hashlib.sha256(Path("data/pilot_train_19k.jsonl").read_bytes()).hexdigest(),
              "tokenizer_sha256": hashlib.sha256(Path("data/pilot_tokenizer/tokenizer.json").read_bytes()).hexdigest(),
              "seed": 42,
              "compile_mode": "eager",
              "scheduler": "original step-2000-to-4000 state resumed without rebase",
              "memory": {
                  "capacity": int(counts.numel()),
                  "occupied_slots": occupied,
                  "occupancy": occupied / int(counts.numel()),
                  "total_write_counts": float(counts.sum()),
                  "sleep_events": checkpoint.get("sleep_events", []),
              },
              "holdout": "single LUMEN-only greedy evaluation; 100 GSM8K + 55 historical prompts",
              "evaluation": json.loads(Path("artifacts/evaluations/final_4000/summary.json").read_text()),
              "timing": json.loads(Path("artifacts/timing/lumen.json").read_text()),
          }
          Path("artifacts/manifests/step_4000_memory_sleep.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload checkpoints, recovery state, holdout and provenance (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-lumen-memory-sleep-3000-4000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            artifacts/timing/lumen.json
            artifacts/evaluations/final_4000/
            artifacts/manifests/
          if-no-files-found: warn
          retention-days: 90
