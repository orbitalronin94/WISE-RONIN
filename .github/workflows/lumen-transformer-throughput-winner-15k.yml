name: LUMEN vs Transformer — OMP winner, 15k continuation from 170700

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lumen-transformer-throughput-winner-15k.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-transformer-throughput-winner-15k
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "ACTIVE"
  OMP_PROC_BIND: "close"
  OMP_PLACES: "cores"
  KMP_BLOCKTIME: "0"
  PARENT_RUN_ID: "45177953462"
  DATA_RUN_ID: "45149684913"
  APPROVED_RUN_ID: "45175046624"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm pytest "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" langid
      - name: Compile and run complete test suite
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests

  train-lumen:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download latest promoted Lumen step-170700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step170700-45177953462
          path: parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact frozen corpus, tokenizer and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download benchmark-approved runtime profile
        uses: actions/download-artifact@v7
        with:
          name: lumen-approved-only-1000-steps-45175046624
          path: approved
          repository: ${{ github.repository }}
          run-id: ${{ env.APPROVED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify original checkpoint, corpus, tokenizer and approved profile
        run: |
          set -euo pipefail
          CHECKPOINT="$(find parent -name step_170700.pt -print -quit)"
          PROFILE="$(find approved -name approved.runtime_profile.json -print -quit)"
          test -n "$CHECKPOINT" && test -s "$PROFILE"
          test -s prepared/data/spanish-v2-plus-personality-250k.jsonl
          test -s prepared/data/spanish-v2-plus-personality-token-cache.pt
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          export CHECKPOINT PROFILE
          python - <<'PY'
          import hashlib, json, os, torch
          from pathlib import Path
          checkpoint = Path(os.environ["CHECKPOINT"])
          data = Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer = Path("prepared/artifacts/spanish-v2/tokenizer.json")
          state = torch.load(checkpoint, map_location="cpu", weights_only=False)
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert state["step"] == 170700
          assert state["architecture_id"] == "ronin_lumen_v3_3_neuroplasticity"
          assert state["seed"] == 42
          assert state["training_config"]["batch"] == 8
          assert state["training_config"]["max_len"] == 128
          assert state["data_sha256"] == sha(data)
          assert state["tokenizer_sha256"] == sha(tokenizer)
          assert state.get("optimizer") and state.get("rng")
          profile = json.loads(Path(os.environ["PROFILE"]).read_text())
          assert profile.get("plasticity", {}).get("inhibition_scale") == 0.80
          assert profile.get("plasticity", {}).get("eligibility_retention") == 0.98
          print("Verified latest paired step 170700, exact data/tokenizer and the two approved mechanisms.")
          print("data_sha256:", sha(data))
          print("tokenizer_sha256:", sha(tokenizer))
          PY
          echo "CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
      - name: Continue Lumen for 15,000 steps from latest paired step 170700 to 185700
        run: |
          set -euo pipefail
          python -m train.train \
            --steps 10000 \
            --resume "$CHECKPOINT" \
            --phase 1 --pilot-all-rows \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile "$PROFILE" \
            --lr 3e-5 --warmup 100 --total-steps 185700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 170700 --transition-end 185700 \
            --warmup-transition 100 --transition-plateau-steps 0 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 1000 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --threads 4 --interop-threads 2 \
            --ckpt-dir checkpoints/lumen \
            --wall-clock-file lumen-wall.json \
            2>&1 | tee lumen-training-10k.log
          MIDPOINT="$(find checkpoints/lumen -name step_180700.pt -print -quit)"
          test -n "$MIDPOINT"
          python -m train.train \
            --steps 5000 \
            --resume "$MIDPOINT" \
            --phase 1 --pilot-all-rows \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile "$PROFILE" \
            --lr 3e-5 --warmup 100 --total-steps 185700 \
            --scheduler-transition \
            --transition-start 170700 --transition-end 185700 \
            --warmup-transition 100 --transition-plateau-steps 0 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 1000 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --threads 4 --interop-threads 2 \
            --ckpt-dir checkpoints/lumen \
            --wall-clock-file lumen-wall.json \
            2>&1 | tee lumen-training-5k.log
      - name: Upload Lumen step-185700 checkpoint and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lumen-approved-neuroplasticity-step185700-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            lumen-wall.json
            lumen-training-10k.log
            lumen-training-5k.log
            approved.runtime_profile.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  train-transformer:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - name: Download latest paired Transformer step-170700 checkpoint
        uses: actions/download-artifact@v7
        with:
          name: transformer-control-step170700-45177953462
          path: parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact frozen corpus, tokenizer and token cache
        uses: actions/download-artifact@v7
        with:
          name: ronin-v2-plus-personality-250k-45149684913
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify original Transformer checkpoint and data hashes
        run: |
          set -euo pipefail
          CHECKPOINT="$(find parent -name step_170700.pt -print -quit)"
          test -n "$CHECKPOINT"
          export CHECKPOINT
          python - <<'PY'
          import hashlib, os, torch
          from pathlib import Path
          checkpoint = Path(os.environ["CHECKPOINT"])
          data = Path("prepared/data/spanish-v2-plus-personality-250k.jsonl")
          tokenizer = Path("prepared/artifacts/spanish-v2/tokenizer.json")
          state = torch.load(checkpoint, map_location="cpu", weights_only=False)
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert state["step"] == 170700
          assert state["data_sha256"] == sha(data)
          assert state["tokenizer_sha256"] == sha(tokenizer)
          assert state.get("optimizer") and state.get("rng")
          print("Verified latest Transformer step 170700 and identical data/tokenizer.")
          print("data_sha256:", sha(data))
          print("tokenizer_sha256:", sha(tokenizer))
          PY
          echo "CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"
      - name: Continue Transformer for 15,000 steps from latest paired step 170700 to 185700
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer
          python -m train.transformer_baseline \
            --steps 10000 \
            --resume "$CHECKPOINT" \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 185700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 170700 --transition-end 185700 \
            --warmup-transition 100 --transition-plateau-steps 0 \
            --transition-min-lr-ratio 0.5 \
            --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer \
            --wall-clock-file transformer-wall.json \
            2>&1 | tee transformer-training-10k.log
          MIDPOINT="$(find checkpoints/transformer -name step_180700.pt -print -quit)"
          test -n "$MIDPOINT"
          python -m train.transformer_baseline \
            --steps 5000 \
            --resume "$MIDPOINT" \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 185700 \
            --scheduler-transition \
            --transition-start 170700 --transition-end 185700 \
            --warmup-transition 100 --transition-plateau-steps 0 \
            --transition-min-lr-ratio 0.5 \
            --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer \
            --wall-clock-file transformer-wall.json \
            2>&1 | tee transformer-training-5k.log
      - name: Upload Transformer step-185700 checkpoint and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transformer-control-step185700-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            transformer-wall.json
            transformer-training-10k.log
            transformer-training-5k.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

  paired-summary:
    if: ${{ false }}
    needs: [train-lumen, train-transformer]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report paired continuation outcomes
        env:
          LUMEN_RESULT: ${{ needs.train-lumen.result }}
          TRANSFORMER_RESULT: ${{ needs.train-transformer.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Paired continuation run: $RUN_ID"
          echo "Lumen approved neuroplasticity: $LUMEN_RESULT"
          echo "Transformer control: $TRANSFORMER_RESULT"
          test "$LUMEN_RESULT" = success
          test "$TRANSFORMER_RESULT" = success
