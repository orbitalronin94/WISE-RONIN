name: Experimental neuroplasticity — validation only

on:
  push:
    branches: [experiment/neuroplasticity-step0-1000]
    paths:
      - "model/**"
      - "train/**"
      - "tests/**"
      - ".github/workflows/neuroplasticity-ci.yml"
      - ".github/workflows/experimental-neuroplasticity-step0-1000.yml"
  pull_request:
    branches: [main]
    paths:
      - "model/**"
      - "train/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" langid tokenizers numpy tqdm pytest
      - name: Compile
        run: python -m compileall -q model train data scripts
      - name: Validate experimental training workflow YAML and embedded Bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, yaml
          path = pathlib.Path(".github/workflows/experimental-neuroplasticity-step0-1000.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert isinstance(workflow, dict) and isinstance(workflow.get("jobs"), dict)
          for job_name, job in workflow["jobs"].items():
              for index, step in enumerate(job.get("steps", [])):
                  script = step.get("run")
                  if script:
                      result = subprocess.run(
                          ["bash", "-n"], input=script, text=True, capture_output=True
                      )
                      assert result.returncode == 0, (
                          f"{job_name} step {index}: {result.stderr}"
                      )
          print("Workflow YAML and embedded Bash syntax validated")
          PY
      - name: Run complete test suite
        run: PYTHONPATH=. pytest -q tests
