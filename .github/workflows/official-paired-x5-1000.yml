name: WISE-RONIN official paired x5 — LUMEN vs Transformer, 1000 steps
on:
  push:
    branches: [main, fix/paired-x5-use-750k-training-profile]
    paths:
      - .github/workflows/official-paired-x5-1000.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wise-ronin-official-paired-x5-1000
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  FREEZE_RUN_ID: "45580013610"
  EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"

jobs:
  validate-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download authorized frozen V4 corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-45580013610
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest, tokenizer and all 24 shard hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("corpus")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          assert len(m.get("shards",[]))==24
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==int(shard["bytes"]),shard["file"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"],shard["file"]
              total+=int(shard["rows"])
          assert total==int(m["total_rows"])
          print(f"FROZEN_V4_OK rows={total} shards=24 tokenizer={expected}")
          PY
      - name: Publish verified corpus for paired jobs
        uses: actions/upload-artifact@v4
        with:
          name: official-paired-v4-inputs
          path: corpus/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  train-lumen:
    needs: validate-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: official-paired-v4-inputs
          path: corpus
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Verify LUMEN runtime and record runner baseline
        run: |
          set -euo pipefail
          python -m train.train --help >/dev/null
          test -s config/lumen_wise_x5.json
          test -s config/lumen_cpu_profile.json
          mkdir -p checkpoints/lumen logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
      - name: Train official LUMEN-WISE x5 from step 0 to 1000 with 750k profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --steps 1000 --log-every 100 --checkpoint-every 1000 --recovery-checkpoint-every 100 --parameter-check-every 100 --threads 4 --interop-threads 2 --data corpus --tokenizer corpus/tokenizer.json --batch 8 --max-len 128 --seed 42 --lr 3e-5 --warmup 100 --total-steps 1000 --ckpt-dir checkpoints/lumen --phase 1 --pilot-all-rows --v32-ze --model-config config/lumen_wise_x5.json --runtime-profile config/lumen_cpu_profile.json --lazy-backward --surprise-gate-loss 1.8 2>&1 | tee logs/lumen.log
      - name: Verify official LUMEN checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True and s["pilot_all_rows"] is True
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_LUMEN_CHECKPOINT_OK step=1000 params=12022016")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-lumen-wise-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  train-transformer:
    needs: validate-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: official-paired-v4-inputs
          path: corpus
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Verify Transformer runtime and record runner baseline
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --help >/dev/null
          test -s config/transformer_wise_x5.json
          mkdir -p checkpoints/transformer logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
      - name: Train official Transformer x5 from step 0 to 1000 with 750k profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --steps 1000 --data corpus --tokenizer corpus/tokenizer.json --batch 8 --max-len 128 --seed 42 --threads 4 --interop-threads 2 --disable-mkldnn --disable-foreach --cpu-affinity --lr 3e-5 --warmup 100 --total-steps 1000 --checkpoint-every 1000 --parameter-check-every 100 --ckpt-dir checkpoints/transformer --model-dim 488 --heads 8 --ff-width 1464 2>&1 | tee logs/transformer.log
      - name: Verify official Transformer checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==11611472
          assert s["architecture_id"]=="decoder_transformer_4l_d488_h8_ff1464_tied_v1"
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_TRANSFORMER_CHECKPOINT_OK step=1000 params=11611472")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-transformer-wise-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  paired-result:
    if: always()
    needs: [train-lumen, train-transformer]
    runs-on: ubuntu-24.04
    steps:
      - name: Record paired outcome
        env:
          LUMEN_RESULT: ${{ needs.train-lumen.result }}
          TRANSFORMER_RESULT: ${{ needs.train-transformer.result }}
        run: |
          echo "Official paired WISE-RONIN x5 1000-step training"
          echo "LUMEN: $LUMEN_RESULT"
          echo "Transformer: $TRANSFORMER_RESULT"
          test "$LUMEN_RESULT" = success
          test "$TRANSFORMER_RESULT" = success
