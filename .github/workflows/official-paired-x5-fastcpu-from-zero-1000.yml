name: WISE-RONIN paired x5 fresh 1000 steps — fastest LUMEN CPU profile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-paired-x5-fastcpu-from-zero-1000.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wise-ronin-paired-x5-fastcpu-from-zero-1000
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  SOURCE_RUN_ID: "45618840019"
  EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
  EXPECTED_HOLDOUT_SHA256: "e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
  EXPECTED_PARAMS: "12022016"

jobs:
  freeze-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the verified V4 corpus and frozen holdouts
        uses: actions/download-artifact@v4
        with:
          name: official-paired-x5-rebuild-inputs-45618840019
          path: inputs
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen corpus, tokenizer and identical holdouts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("inputs")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          assert len(m.get("shards",[]))==24
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==int(shard["bytes"]),shard["file"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"],shard["file"]
              total+=int(shard["rows"])
          assert total==int(m["total_rows"])==2293883
          hold=root/"holdout_multiple_choice.jsonl"
          hh=hashlib.sha256(hold.read_bytes()).hexdigest()
          assert hh=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359",hh
          assert sum(bool(x.strip()) for x in hold.read_text(encoding="utf-8").splitlines())==2431
          free=root/"freeform_identity_general_100.jsonl"
          assert sum(bool(x.strip()) for x in free.read_text(encoding="utf-8").splitlines())==100
          print(f"FROZEN_INPUTS_OK rows={total} shards=24 tokenizer={expected}")
          print(f"IDENTICAL_HOLDOUTS_OK mc=2431 sha256={hh} freeform=100")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paired-x5-fastcpu-inputs-${{ github.run_id }}
          path: inputs/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

  train-lumen:
    needs: freeze-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paired-x5-fastcpu-inputs-${{ github.run_id }}
          path: inputs
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Add swap headroom for the x5 LUMEN runner
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /swapfile-lumen
          sudo chmod 600 /swapfile-lumen
          sudo mkswap /swapfile-lumen
          sudo swapon /swapfile-lumen
          sudo sysctl vm.swappiness=80
          free -h
          swapon --show
      - name: Verify fresh LUMEN x5 architecture and fastest small-LUMEN CPU profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from model.config import LumenConfig
          from model.lumen import RoninLumen
          cfg=json.loads(Path("config/lumen_wise_x5.json").read_text(encoding="utf-8"))
          cfg.update({"learning_rate":3e-5,"warmup_steps":100,"batch_size":8,
                      "sequence_length":128,"total_steps":1000,"seed":42})
          typed=LumenConfig(**cfg)
          model=RoninLumen(config=typed,v32_ze=True).cpu()
          params=sum(p.numel() for p in model.parameters())
          assert params==12022016,params
          profile=json.loads(Path("config/lumen_cpu_profile.json").read_text(encoding="utf-8"))
          profile.update({"threads":4,"interop_threads":2,"mkldnn_enabled":True,
                          "foreach":False,"cpu_affinity":True})
          assert profile["threads"]==4 and profile["interop_threads"]==2
          assert profile["mkldnn_enabled"] is True
          assert profile["foreach"] is False and profile["cpu_affinity"] is True
          profile["profile_id"]="small-lumen-fastest-cpu-applied-to-x5"
          profile["cpu_benchmark_source"]={
              "description":"Previously measured fastest small-LUMEN CPU configuration",
              "settings":"intra-op=4; inter-op=2; MKLDNN=on; AdamW foreach=off; CPU affinity=on",
              "measured_small_lumen_speed_steps_per_second":0.6629,
              "note":"The measured throughput belongs to the smaller LUMEN benchmark, not this x5 run."
          }
          Path("config/lumen_wise_x5_train1000.json").write_text(json.dumps(cfg,indent=2)+"\n")
          Path("config/lumen_cpu_profile_fastest_small.json").write_text(json.dumps(profile,indent=2)+"\n")
          print(f"LUMEN_X5_PREFLIGHT_OK params={params} V32-ZE=on all_rows=on")
          print("FAST_CPU_PROFILE_OK intra=4 interop=2 mkldnn=on foreach=off affinity=on")
          PY
          mkdir -p checkpoints/lumen logs
          { date -u; nproc; free -h; swapon --show; df -h .; } | tee logs/runner-baseline.txt
      - name: Train fresh LUMEN-WISE x5 from step 0 to 1000
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --steps 1000 --log-every 100 --checkpoint-every 1000 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --threads 4 --interop-threads 2 --data inputs --tokenizer inputs/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 --lr 3e-5 --warmup 100 --total-steps 1000 \
            --ckpt-dir checkpoints/lumen --phase 1 --pilot-all-rows --v32-ze \
            --model-config config/lumen_wise_x5_train1000.json \
            --runtime-profile config/lumen_cpu_profile_fastest_small.json --lazy-backward \
            --surprise-gate-loss 1.8 2>&1 | tee logs/lumen.log
      - name: Verify exact fresh LUMEN checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True and s["pilot_all_rows"] is True
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert int(s["training_config"]["batch"])==8 and int(s["training_config"]["max_len"])==128
          assert abs(float(s["training_config"]["lr"])-3e-5)<1e-12
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s["runtime_profile"]["mkldnn_enabled"] is True
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_LUMEN_CHECKPOINT_OK step=1000 params=12022016 mkldnn=on")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-x5-fastcpu-lumen-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/
            config/lumen_wise_x5_train1000.json
            config/lumen_cpu_profile_fastest_small.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  train-transformer:
    needs: freeze-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paired-x5-fastcpu-inputs-${{ github.run_id }}
          path: inputs
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Verify fresh equal-parameter Transformer x5 and fastest small-LUMEN CPU profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --help >/dev/null
          python - <<'PY'
          import torch
          from train.transformer_baseline import SmallTransformerLM
          model=SmallTransformerLM(4096,128,width=488,heads=8,ff_width=1569,residual_groups=51)
          params=sum(p.numel() for p in model.parameters())
          assert params==12022016,params
          torch.set_num_threads(4)
          torch.set_num_interop_threads(2)
          torch.backends.mkldnn.enabled=True
          print(f"TRANSFORMER_X5_PREFLIGHT_OK params={params}")
          print(f"FAST_CPU_PROFILE_OK intra={torch.get_num_threads()} interop=2 mkldnn={torch.backends.mkldnn.enabled} foreach=off affinity=on")
          PY
          mkdir -p checkpoints/transformer logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
      - name: Train fresh Transformer x5 from step 0 to 1000
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --steps 1000 \
            --data inputs --tokenizer inputs/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 --threads 4 --interop-threads 2 \
            --disable-foreach --cpu-affinity \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --checkpoint-every 1000 --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer \
            --model-dim 488 --heads 8 --ff-width 1569 --residual-groups 51 \
            2>&1 | tee logs/transformer.log
      - name: Verify exact fresh Transformer checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==12022016
          assert s["architecture_id"]=="decoder_transformer_4l_d488_h8_ff1569_rg51_tied_v2"
          assert s["model_spec"]=={"model_dim":488,"heads":8,"ff_width":1569,"residual_groups":51,"layers":4,"tied_embeddings":True}
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert int(s["training_config"]["batch"])==8 and int(s["training_config"]["max_len"])==128
          assert abs(float(s["training_config"]["lr"])-3e-5)<1e-12
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_TRANSFORMER_CHECKPOINT_OK step=1000 params=12022016 mkldnn=on")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-x5-fastcpu-transformer-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  evaluate-identical-holdouts:
    needs: [train-lumen, train-transformer]
    if: needs.train-lumen.result == 'success' && needs.train-transformer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5" "scipy>=1.11,<2"
      - name: Download the exact frozen V4 inputs
        uses: actions/download-artifact@v4
        with:
          name: paired-x5-fastcpu-inputs-${{ github.run_id }}
          path: inputs
      - name: Download the fresh LUMEN checkpoint
        uses: actions/download-artifact@v4
        with:
          name: paired-x5-fastcpu-lumen-step1000-${{ github.run_id }}
          path: lumen
      - name: Download the fresh Transformer checkpoint
        uses: actions/download-artifact@v4
        with:
          name: paired-x5-fastcpu-transformer-step1000-${{ github.run_id }}
          path: transformer
      - name: Verify equal fresh checkpoints and identical holdouts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,torch
          from pathlib import Path
          l=torch.load("lumen/step_1000.pt",map_location="cpu",weights_only=False)
          t=torch.load("transformer/step_1000.pt",map_location="cpu",weights_only=False)
          assert l["step"]==t["step"]==1000
          assert l["params"]==t["params"]==12022016
          hold=Path("inputs/holdout_multiple_choice.jsonl").read_bytes()
          assert hashlib.sha256(hold).hexdigest()=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
          assert len([x for x in hold.decode("utf-8").splitlines() if x.strip()])==2431
          assert len([x for x in Path("inputs/freeform_identity_general_100.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()])==100
          print("PAIR_OK fresh_step=1000 params_each=12022016; identical_holdout=2431 + freeform=100")
          PY
      - name: Score both models on the same official 2431-question holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/holdout_multiple_choice.jsonl --tokenizer inputs/tokenizer.json \
            --lumen lumen/step_1000.pt --transformer transformer/step_1000.pt \
            --expected-lumen-step 1000 --expected-transformer-step 1000 \
            --out results/paired_step1000_fastcpu_official_2431.json --threads 4 --max-len 128
          python scripts/audit_paired_holdout.py --input results/paired_step1000_fastcpu_official_2431.json \
            --output results/paired_step1000_fastcpu_official_2431_audit.json --bootstrap 5000
      - name: Generate identical 100 open-ended questions for both models
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          python scripts/freeform_identity_general_holdout.py \
            --holdout inputs/freeform_identity_general_100.jsonl --tokenizer inputs/tokenizer.json \
            --lumen lumen/step_1000.pt --transformer transformer/step_1000.pt \
            --expected-step 1000 --sample-size 100 --seed 1000 --max-new-tokens 96 \
            --out-dir results/freeform-step1000 --threads 4 --max-len 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-x5-fastcpu-holdouts-step1000-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
      - name: Require complete paired holdout reports
        run: |
          test -s results/paired_step1000_fastcpu_official_2431.json
          test -s results/paired_step1000_fastcpu_official_2431_audit.json
          test -s results/freeform-step1000/step1000_freeform_100.json
          test -s results/freeform-step1000/step1000_freeform_100.md
