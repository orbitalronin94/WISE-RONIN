name: WISE-RONIN paired x5 rebuild — equal parameters, 1000 steps and frozen holdout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-paired-x5-rebuild-1000.yml
      - train/transformer_baseline.py
      - scripts/evaluate_multiple_choice_holdout.py
      - scripts/freeform_identity_general_holdout.py
      - config/lumen_wise_x5.json
      - config/lumen_cpu_profile.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wise-ronin-paired-x5-rebuild-equal-params
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  FREEZE_RUN_ID: "45580013610"
  EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
  EXPECTED_HOLDOUT_SHA256: "e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
  EXPECTED_PARAMS: "12022016"

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download authorized frozen V4 corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-45580013610
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the exact 2431-question paired holdout source
        uses: actions/download-artifact@v4
        with:
          name: paired-v32-inputs-500000-45480785478
          path: holdout-source
          repository: ${{ github.repository }}
          run-id: "45480785478"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze and verify V4 corpus plus identical holdout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path("corpus")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          assert len(m.get("shards",[]))==24
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==int(shard["bytes"]),shard["file"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"],shard["file"]
              total+=int(shard["rows"])
          assert total==int(m["total_rows"])==2293883
          source=Path("holdout-source/eval/holdout_multiple_choice.jsonl")
          assert source.is_file()
          holdout_hash=hashlib.sha256(source.read_bytes()).hexdigest()
          assert holdout_hash=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359",holdout_hash
          holdout_rows=[x for x in source.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(holdout_rows)==2431,len(holdout_rows)
          shutil.copy2(source,root/"holdout_multiple_choice.jsonl")
          freeform=Path("data/freeform_identity_general_100.jsonl")
          assert freeform.is_file()
          prompts=[json.loads(x) for x in freeform.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(prompts)==100 and len({x["id"] for x in prompts})==100
          assert prompts[0]["prompt"]=="¿Quién eres?"
          shutil.copy2(freeform,root/"freeform_identity_general_100.jsonl")
          print(f"FROZEN_V4_OK rows={total} shards=24 tokenizer={expected}")
          print(f"OFFICIAL_HOLDOUT_OK rows=2431 sha256={holdout_hash}; freeform=100")
          PY
      - name: Publish immutable paired training and holdout inputs
        uses: actions/upload-artifact@v4
        with:
          name: official-paired-x5-rebuild-inputs-${{ github.run_id }}
          path: corpus/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  train-lumen:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: official-paired-x5-rebuild-inputs-${{ github.run_id }}
          path: corpus
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Verify exact LUMEN x5 architecture and matched CPU profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          from model.config import LumenConfig
          from model.lumen import RoninLumen
          cfg=json.loads(Path("config/lumen_wise_x5.json").read_text(encoding="utf-8"))
          cfg.update({"learning_rate":3e-5,"warmup_steps":100,"batch_size":8,
                      "sequence_length":128,"total_steps":1000,"seed":42})
          typed=LumenConfig(**cfg)
          model=RoninLumen(config=typed,v32_ze=True).cpu()
          params=sum(p.numel() for p in model.parameters())
          assert params==12022016,params
          profile=json.loads(Path("config/lumen_cpu_profile.json").read_text(encoding="utf-8"))
          expected={"threads":4,"interop_threads":2,"mkldnn_enabled":False,
                    "foreach":False,"cpu_affinity":True}
          for key,value in expected.items(): assert profile.get(key)==value,(key,profile.get(key),value)
          Path("config/lumen_wise_x5_train1000.json").write_text(json.dumps(cfg,indent=2)+"\n",encoding="utf-8")
          print(f"LUMEN_X5_PREFLIGHT_OK params={params} V32-ZE=on all_rows=on")
          print("CPU_PROFILE_OK intra=4 interop=2 mkldnn=off foreach=off affinity=on")
          PY
          mkdir -p checkpoints/lumen logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
      - name: Train fresh LUMEN-WISE x5 from step 0 to 1000
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --steps 1000 --log-every 100 --checkpoint-every 1000 \
            --recovery-checkpoint-every 100 --parameter-check-every 100 \
            --threads 4 --interop-threads 2 --data corpus --tokenizer corpus/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 --lr 3e-5 --warmup 100 --total-steps 1000 \
            --ckpt-dir checkpoints/lumen --phase 1 --pilot-all-rows --v32-ze \
            --model-config config/lumen_wise_x5_train1000.json \
            --runtime-profile config/lumen_cpu_profile.json --lazy-backward \
            --surprise-gate-loss 1.8 2>&1 | tee logs/lumen.log
      - name: Verify exact fresh LUMEN checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True and s["pilot_all_rows"] is True
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert int(s["training_config"]["batch"])==8 and int(s["training_config"]["max_len"])==128
          assert abs(float(s["training_config"]["lr"])-3e-5)<1e-12
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_LUMEN_CHECKPOINT_OK step=1000 params=12022016")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-lumen-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/
            config/lumen_wise_x5_train1000.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  train-transformer:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: official-paired-x5-rebuild-inputs-${{ github.run_id }}
          path: corpus
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5"
      - name: Verify exact Transformer x5 parameter match and CPU profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --help >/dev/null
          python - <<'PY'
          import torch
          from train.transformer_baseline import SmallTransformerLM
          model=SmallTransformerLM(4096,128,width=488,heads=8,ff_width=1569,residual_groups=51)
          params=sum(p.numel() for p in model.parameters())
          assert params==12022016,params
          print(f"TRANSFORMER_X5_PREFLIGHT_OK params={params} layers=4 width=488 heads=8 ff=1569 residual_groups=51")
          PY
          mkdir -p checkpoints/transformer logs
          { date -u; nproc; free -h; df -h .; } | tee logs/runner-baseline.txt
      - name: Train fresh Transformer x5 from step 0 to 1000 with matched 750k profile
        shell: bash
        run: |
          set -euo pipefail
          python -m train.transformer_baseline --steps 1000 \
            --data corpus --tokenizer corpus/tokenizer.json \
            --batch 8 --max-len 128 --seed 42 --threads 4 --interop-threads 2 \
            --disable-mkldnn --disable-foreach --cpu-affinity \
            --lr 3e-5 --warmup 100 --total-steps 1000 \
            --checkpoint-every 1000 --parameter-check-every 100 \
            --ckpt-dir checkpoints/transformer \
            --model-dim 488 --heads 8 --ff-width 1569 --residual-groups 51 \
            2>&1 | tee logs/transformer.log
      - name: Verify exact fresh Transformer checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer/step_1000.pt",map_location="cpu",weights_only=False)
          assert int(s["step"])==1000 and int(s["params"])==12022016
          assert s["architecture_id"]=="decoder_transformer_4l_d488_h8_ff1569_rg51_tied_v2"
          assert s["model_spec"]=={"model_dim":488,"heads":8,"ff_width":1569,"residual_groups":51,"layers":4,"tied_embeddings":True}
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==1000
          assert int(s["training_config"]["batch"])==8 and int(s["training_config"]["max_len"])==128
          assert abs(float(s["training_config"]["lr"])-3e-5)<1e-12
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256"))
          print("OFFICIAL_TRANSFORMER_CHECKPOINT_OK step=1000 params=12022016")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-transformer-x5-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  evaluate-identical-holdouts:
    needs: [validate-inputs, train-lumen, train-transformer]
    if: always() && needs.train-lumen.result == 'success' && needs.train-transformer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.20,<1.0" "tqdm>=4.66,<5" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          name: official-paired-x5-rebuild-inputs-${{ github.run_id }}
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: official-lumen-x5-step1000-${{ github.run_id }}
          path: lumen
      - uses: actions/download-artifact@v4
        with:
          name: official-transformer-x5-step1000-${{ github.run_id }}
          path: transformer
      - name: Verify both fresh equal-parameter checkpoints and fixed holdouts
        run: |
          set -euo pipefail
          test -s lumen/step_1000.pt
          test -s transformer/step_1000.pt
          test -s inputs/holdout_multiple_choice.jsonl
          test -s inputs/freeform_identity_general_100.jsonl
          python - <<'PY'
          import hashlib,json,torch
          from pathlib import Path
          l=torch.load("lumen/step_1000.pt",map_location="cpu",weights_only=False)
          t=torch.load("transformer/step_1000.pt",map_location="cpu",weights_only=False)
          assert l["step"]==t["step"]==1000
          assert l["params"]==t["params"]==12022016
          h=Path("inputs/holdout_multiple_choice.jsonl").read_bytes()
          assert hashlib.sha256(h).hexdigest()=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
          rows=[x for x in h.decode("utf-8").splitlines() if x.strip()]
          assert len(rows)==2431
          prompts=[json.loads(x) for x in Path("inputs/freeform_identity_general_100.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(prompts)==100
          print("PAIR_OK step=1000 params_each=12022016; holdout=2431 + freeform=100")
          PY
      - name: Score both models on the same official 2431-question holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/evaluate_multiple_choice_holdout.py \
            --holdout inputs/holdout_multiple_choice.jsonl \
            --tokenizer inputs/tokenizer.json \
            --lumen lumen/step_1000.pt --transformer transformer/step_1000.pt \
            --expected-lumen-step 1000 --expected-transformer-step 1000 \
            --out results/paired_step1000_official_2431.json --threads 4 --max-len 128
          python - <<'PY'
          import json
          p=json.load(open("results/paired_step1000_official_2431.json",encoding="utf-8"))
          assert p["holdout_rows"]==2431
          assert p["holdout_sha256"]=="e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359"
          assert p["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          for name,r in p["results"].items():
              assert r["total"]==2431,(name,r.get("total"))
              print(f"{name}: {r['correct']}/2431 ({100*r['accuracy']:.2f}%), mean_answer_nll={r['mean_answer_nll']:.6f}")
          PY
          python scripts/audit_paired_holdout.py --input results/paired_step1000_official_2431.json --output results/paired_step1000_official_2431_audit.json --bootstrap 5000
      - name: Generate the same fixed 100 open-ended questions for both models
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          python scripts/freeform_identity_general_holdout.py \
            --holdout inputs/freeform_identity_general_100.jsonl \
            --tokenizer inputs/tokenizer.json \
            --lumen lumen/step_1000.pt --transformer transformer/step_1000.pt \
            --expected-step 1000 --sample-size 100 --seed 1000 --max-new-tokens 96 \
            --out-dir results/freeform-step1000 --threads 4 --max-len 128
          test -s results/freeform-step1000/step1000_freeform_100.json
          test -s results/freeform-step1000/step1000_freeform_100.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-paired-x5-holdouts-step1000-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
      - name: Require complete paired holdout reports
        run: |
          test -s results/paired_step1000_official_2431.json
          test -s results/paired_step1000_official_2431_audit.json
          test -s results/freeform-step1000/step1000_freeform_100.json
          test -s results/freeform-step1000/step1000_freeform_100.md
