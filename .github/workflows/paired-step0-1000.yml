name: RONIN-LUMEN vs Transformer — fresh 1000-step Spanish pilot

on:
  workflow_dispatch:
    inputs:
      corpus_run_id:
        description: "Run that produced the immutable Spanish-only corpus artifact"
        required: true
        default: "45007651092"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/paired-step0-1000.yml"
      - "model/delta_state.py"
      - "model/config.py"
      - "model/lumen.py"
      - "model/homeostasis.py"
      - "train/train.py"
      - "tests/test_delta_cold_start.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-paired-step0-1000
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  CORPUS_RUN_ID: ${{ inputs.corpus_run_id || '45007651092' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" langid tokenizers numpy tqdm pytest
      - name: Compile and run tests
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ronin-torch-cpu-py311-${{ runner.os }}
          restore-keys: ronin-torch-cpu-py311-${{ runner.os }}-
      - name: Install corpus and tokenizer tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download frozen Spanish-only corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-spanish-corpus-v1-${{ env.CORPUS_RUN_ID }}
          path: artifacts/spanish-v1
          repository: ${{ github.repository }}
          run-id: ${{ env.CORPUS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate corpus split and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/spanish-v1")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["language"] == "es", manifest
          for name, key in (("train.jsonl", "train_rows"), ("validation.jsonl", "validation_rows")):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, path
              rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              assert len(rows) == int(manifest[key]), (name, len(rows), manifest[key])
              assert all(r.get("language") == "es" and str(r.get("completion", "")).strip() for r in rows), name
              print(f"{name}: {len(rows)} Spanish training rows")
          holdout_path = root / "holdout_multiple_choice.jsonl"
          assert holdout_path.is_file() and holdout_path.stat().st_size > 0, holdout_path
          holdout = [json.loads(line) for line in holdout_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(holdout) == int(manifest["holdout_rows"]), (len(holdout), manifest["holdout_rows"])
          assert all(r.get("language") == "es" and r.get("choices") and r.get("answer") for r in holdout)
          print(f"holdout_multiple_choice.jsonl: {len(holdout)} Spanish evaluation rows (kept out of tokenizer/training)")
          print("Corpus manifest validated; no synthetic or non-Spanish rows admitted.")
          PY
      - name: Train tokenizer on train split only and pre-tokenize once
        run: |
          mkdir -p data/spanish/tokenizer
          python scripts/train_tokenizer.py             --data artifacts/spanish-v1/train.jsonl             --output data/spanish/tokenizer/tokenizer.json             --vocab-size 4096
          python scripts/prepare_token_cache.py             --data artifacts/spanish-v1/train.jsonl             --tokenizer data/spanish/tokenizer/tokenizer.json             --max-len 128             --output data/spanish/train_tokens_128.pt
          python - <<'PY'
          import json
          from pathlib import Path
          from tokenizers import Tokenizer
          tok = Tokenizer.from_file("data/spanish/tokenizer/tokenizer.json")
          assert tok.get_vocab_size() == 4096
          assert tok.token_to_id("[PAD]") == 0
          assert tok.token_to_id("[EOS]") is not None
          print("Tokenizer validated: vocab=4096 PAD=0 EOS=", tok.token_to_id("[EOS]"))
          manifest = json.loads(Path("artifacts/spanish-v1/manifest.json").read_text())
          print("train rows:", manifest["train_rows"], "validation rows:", manifest["validation_rows"], "holdout rows:", manifest["holdout_rows"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-spanish-prepared-${{ github.run_id }}
          path: |
            artifacts/spanish-v1/
            data/spanish/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  train-lumen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ronin-torch-cpu-py311-${{ runner.os }}
          restore-keys: ronin-torch-cpu-py311-${{ runner.os }}-
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-spanish-prepared-${{ github.run_id }}
          path: .
      - name: Fresh Lumen training — step 0 to 1000
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          python -m train.train             --steps 1000 --phase 1 --pilot-all-rows --no-sleep             --data artifacts/spanish-v1/train.jsonl             --tokenizer data/spanish/tokenizer/tokenizer.json             --token-cache data/spanish/train_tokens_128.pt             --batch 8 --max-len 128 --seed 42             --runtime-profile config/lumen_cpu_profile.json             --lr 3e-5 --warmup 100 --total-steps 1000             --log-every 100 --checkpoint-every 250             --recovery-checkpoint-every 100 --parameter-check-every 100             --ckpt-dir checkpoints/lumen 2>&1 | tee logs/lumen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-lumen-step1000-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            logs/lumen.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  train-transformer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ronin-torch-cpu-py311-${{ runner.os }}
          restore-keys: ronin-torch-cpu-py311-${{ runner.os }}-
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-spanish-prepared-${{ github.run_id }}
          path: .
      - name: Fresh Transformer training — step 0 to 1000
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer logs
          python -m train.transformer_baseline             --steps 1000             --data artifacts/spanish-v1/train.jsonl             --tokenizer data/spanish/tokenizer/tokenizer.json             --token-cache data/spanish/train_tokens_128.pt             --batch 8 --max-len 128 --seed 42 --threads 4             --lr 7.5e-5 --warmup 100 --total-steps 1000             --parameter-check-every 100             --ckpt-dir checkpoints/transformer 2>&1 | tee logs/transformer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-transformer-step1000-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            logs/transformer.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  paired-summary:
    needs: [train-lumen, train-transformer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report paired job outcomes
        env:
          LUMEN_RESULT: ${{ needs.train-lumen.result }}
          TRANSFORMER_RESULT: ${{ needs.train-transformer.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Paired fresh-start experiment run: $RUN_ID"
          echo "Lumen: $LUMEN_RESULT"
          echo "Transformer: $TRANSFORMER_RESULT"
          test "$LUMEN_RESULT" = success
          test "$TRANSFORMER_RESULT" = success
