name: RONIN-LUMEN pilot checks (no training)

on:
  push:
    branches: [pilot/ronin-lumen-500]
    paths:
      - "model/**"
      - "train/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/pilot-ci.yml"
      - ".github/workflows/pilot.yml"
  pull_request:
    branches: [main]
    paths:
      - "model/**"
      - "train/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/pilot-ci.yml"

permissions:
  contents: read

concurrency:
  # Shares the legacy training workflow group so this test-only run cancels
  # obsolete queued/running full-train jobs from the pre-cache workflow.
  group: ronin-lumen-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" tokenizers numpy tqdm pytest
      - name: Validate pilot workflow YAML and embedded Bash syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/pilot.yml").read_text())
          for job_name, job in workflow.get("jobs", {}).items():
              for index, step in enumerate(job.get("steps", []), 1):
                  script = step.get("run")
                  if not script:
                      continue
                  script = re.sub(r"\$\{\{.*?\}\}", "0", script)
                  result = subprocess.run(
                      ["bash", "-n"], input=script, text=True, capture_output=True
                  )
                  if result.returncode:
                      raise SystemExit(
                          f"{job_name} step {index} ({step.get('name')}): "
                          f"{result.stderr}"
                      )
          print("pilot.yml YAML and all embedded Bash blocks are syntactically valid")
          PY

      - name: Compile and run all tests (no corpus download or training)
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests
