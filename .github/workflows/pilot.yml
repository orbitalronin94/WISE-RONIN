name: RONIN-LUMEN longitudinal matched architecture experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pilot.yml"
      - "model/**"
      - "train/**"
      - "tests/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      start_step:
        description: "Último hito válido compartido (0 para empezar; después 500, 1000...)"
        required: true
        default: "500"
        type: string
      blocks:
        description: "Número de bloques consecutivos de 500 pasos"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-lumen-longitudinal-pilot
  cancel-in-progress: false

jobs:
  matched-cpu-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install only runtime dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm

      - name: Validate requested longitudinal range
        id: plan
        shell: bash
        run: |
          START="${{ inputs.start_step || '500' }}"
          BLOCKS="${{ inputs.blocks || '1' }}"
          if ! [[ "$START" =~ ^[0-9]+$ && "$BLOCKS" =~ ^[0-9]+$ ]]; then
            echo "start_step and blocks must be non-negative/positive integers" >&2
            exit 1
          fi
          if (( START % 500 != 0 || BLOCKS < 1 || BLOCKS > 10 )); then
            echo "start_step must be a multiple of 500; blocks must be 1..10" >&2
            exit 1
          fi
          END=$((START + BLOCKS * 500))
          if (( END > 10000 )); then
            echo "Requested end step $END exceeds the frozen 10k pilot schedule" >&2
            exit 1
          fi
          echo "start_step=$START" >> "$GITHUB_OUTPUT"
          echo "blocks=$BLOCKS" >> "$GITHUB_OUTPUT"
          echo "end_step=$END" >> "$GITHUB_OUTPUT"
          echo "Longitudinal plan: $START -> $END in $BLOCKS blocks"

      - name: Restore validation result for this source and test revision
        id: test-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ronin-tests-passed
          key: ronin-lumen-tests-v1-${{ hashFiles('model/**', 'train/**', 'data/**', 'scripts/**', 'tests/**') }}

      - name: Restore prepared corpus, tokenizer and reasoning holdout cache
        id: prepared-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pilot_train_19k.jsonl
            data/pilot_train_19k.manifest.json
            data/pilot_tokenizer/
            artifacts/reasoning_gsm8k_500.jsonl
            artifacts/reasoning_gsm8k_500.manifest.json
          key: ronin-lumen-prepared-v2-${{ hashFiles('scripts/build_pilot_corpus.py', 'scripts/prepare_reasoning_holdout.py', 'data/audit_holdout.py', 'data/holdout_500.jsonl') }}

      - name: Install one-time validation and data-preparation dependencies
        if: steps.test-cache.outputs.cache-hit != 'true' || steps.prepared-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.test-cache.outputs.cache-hit }}" != "true" ]; then
            python -m pip install pytest "datasets>=3,<4" "huggingface_hub>=0.25,<1.0"
          elif [ "${{ steps.prepared-cache.outputs.cache-hit }}" != "true" ]; then
            python -m pip install "datasets>=3,<4" "huggingface_hub>=0.25,<1.0"
          fi

      - name: Compile and run full tests once per source/test revision
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests
          mkdir -p .cache
          printf '%s\\n' "${{ github.sha }}" > .cache/ronin-tests-passed

      - name: Save successful test result for this code revision
        if: success() && steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/ronin-tests-passed
          key: ronin-lumen-tests-v1-${{ hashFiles('model/**', 'train/**', 'data/**', 'scripts/**', 'tests/**') }}

      - name: Restore exact parent checkpoints
        id: checkpoint-cache
        if: steps.plan.outputs.start_step != '0'
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoints/lumen/step_${{ steps.plan.outputs.start_step }}.pt
            checkpoints/transformer/step_${{ steps.plan.outputs.start_step }}.pt
          key: ronin-lumen-checkpoints-v1-step-${{ steps.plan.outputs.start_step }}

      - name: Refuse non-reproducible checkpoint gaps
        if: steps.plan.outputs.start_step != '0' && steps.checkpoint-cache.outputs.cache-hit != 'true' && steps.plan.outputs.start_step != '500' && steps.plan.outputs.start_step != '1000'
        run: |
          echo "No exact checkpoint cache exists for requested parent step ${{ steps.plan.outputs.start_step }}. Resume from the last cached hito; do not guess or silently restart." >&2
          exit 1

      - name: Restore previously prepared corpus and tokenizer artifact (cache miss only)
        id: prepared-data-artifact
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-prepared-data-44905396366
          path: artifacts/prepared-data-cache
          repository: ${{ github.repository }}
          run-id: 44905396366
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download immutable source-candidate artifact (fallback only)
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-data-artifact.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: lumen-source-candidates-seed-42
          path: artifacts/source-candidates
          repository: ${{ github.repository }}
          run-id: 44890014413
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download original pilot artifact for checkpoint bootstrap
        if: steps.prepared-cache.outputs.cache-hit != 'true' || (steps.plan.outputs.start_step == '500' && steps.checkpoint-cache.outputs.cache-hit != 'true')
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-matched-pilot-44900623884
          path: artifacts/bootstrap
          repository: ${{ github.repository }}
          run-id: 44900623884
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore corpus and tokenizer without rebuilding
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-data-artifact.outcome == 'success'
        run: |
          mkdir -p data/pilot_tokenizer
          cp artifacts/prepared-data-cache/data/pilot_train_19k.jsonl data/pilot_train_19k.jsonl
          cp artifacts/prepared-data-cache/data/pilot_train_19k.manifest.json data/pilot_train_19k.manifest.json
          cp -a artifacts/prepared-data-cache/data/pilot_tokenizer/. data/pilot_tokenizer/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          corpus = hashlib.sha256(Path("data/pilot_train_19k.jsonl").read_bytes()).hexdigest()
          manifest = json.loads(Path("data/pilot_tokenizer/tokenizer.manifest.json").read_text())
          if manifest.get("corpus_sha256") != corpus:
              raise SystemExit("Prepared tokenizer belongs to a different corpus")
          tokenizer = hashlib.sha256(Path("data/pilot_tokenizer/tokenizer.json").read_bytes()).hexdigest()
          if manifest.get("tokenizer_sha256") != tokenizer:
              raise SystemExit("Prepared tokenizer SHA-256 mismatch")
          print(f"Restored prepared corpus {corpus} and tokenizer {tokenizer}; no rebuild or retokenization.")
          PY

      - name: Build provisional corpus once from immutable source candidates (fallback only)
        if: steps.prepared-cache.outputs.cache-hit != 'true' && steps.prepared-data-artifact.outcome != 'success'
        run: |
          python scripts/build_pilot_corpus.py \
            --sources artifacts/source-candidates \
            --holdout data/holdout_500.jsonl \
            --output data/pilot_train_19k.jsonl \
            --manifest data/pilot_train_19k.manifest.json \
            --pilot-authorization
          mkdir -p data/pilot_tokenizer
          cp artifacts/bootstrap/data/pilot_tokenizer/tokenizer.json data/pilot_tokenizer/tokenizer.json
          cp artifacts/bootstrap/data/pilot_tokenizer/tokenizer.manifest.json data/pilot_tokenizer/tokenizer.manifest.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          corpus = hashlib.sha256(Path("data/pilot_train_19k.jsonl").read_bytes()).hexdigest()
          manifest = json.loads(Path("data/pilot_tokenizer/tokenizer.manifest.json").read_text())
          if manifest.get("corpus_sha256") != corpus:
              raise SystemExit("Reusable tokenizer was trained on a different corpus")
          tokenizer = hashlib.sha256(Path("data/pilot_tokenizer/tokenizer.json").read_bytes()).hexdigest()
          if manifest.get("tokenizer_sha256") != tokenizer:
              raise SystemExit("Reusable tokenizer SHA-256 mismatch")
          print(f"Reused existing tokenizer {tokenizer} for corpus {corpus}")
          PY

      - name: Download exact step-1000 checkpoints from completed longitudinal run
        if: steps.plan.outputs.start_step == '1000' && steps.checkpoint-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-longitudinal-44911588828
          path: artifacts/step-1000-bootstrap
          repository: ${{ github.repository }}
          run-id: 44911588828
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore exact step-1000 checkpoint pair
        if: steps.plan.outputs.start_step == '1000' && steps.checkpoint-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen checkpoints/transformer
          cp artifacts/step-1000-bootstrap/checkpoints/lumen/step_1000.pt checkpoints/lumen/step_1000.pt
          cp artifacts/step-1000-bootstrap/checkpoints/transformer/step_1000.pt checkpoints/transformer/step_1000.pt
          test -s checkpoints/lumen/step_1000.pt
          test -s checkpoints/transformer/step_1000.pt
          python - <<'PY'
          import torch
          for name in ("lumen", "transformer"):
              path = f"checkpoints/{name}/step_1000.pt"
              state = torch.load(path, map_location="cpu", weights_only=False)
              if state.get("step") != 1000 or not state.get("optimizer") or not state.get("scheduler") or not state.get("rng"):
                  raise SystemExit(f"{name}: step-1000 checkpoint is not resumable")
              print(f"{name}: exact step={state['step']} tokens={state.get('tokens_seen')}")
          PY

      - name: Restore first 500-step checkpoints from original pilot (bootstrap only)
        if: steps.plan.outputs.start_step == '500' && steps.checkpoint-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p checkpoints
          cp -a artifacts/bootstrap/checkpoints/. checkpoints/
          test -f checkpoints/lumen/step_500.pt
          test -f checkpoints/transformer/step_500.pt

      - name: Validate or reconstruct legacy Transformer optimizer state
        if: steps.plan.outputs.start_step == '500' && steps.checkpoint-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import torch
          state = torch.load("checkpoints/transformer/step_500.pt", map_location="cpu", weights_only=False)
          if all(key in state for key in ("optimizer", "scheduler", "rng", "training_config", "architecture_id")):
              print("Transformer bootstrap already supports exact resume")
          else:
              print("Legacy checkpoint has weights but no optimizer/scheduler/RNG; deterministic 500-step replay required.")
              torch.save(state, "checkpoints/transformer/step_500_legacy.pt")
          PY
          if [ -f checkpoints/transformer/step_500_legacy.pt ]; then
            python -m train.transformer_baseline \
              --steps 500 --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --batch 8 --max-len 128 --seed 42 \
              --lr 1.5e-4 --warmup 100 --total-steps 10000 \
              --ckpt-dir checkpoints/transformer
          fi
          python - <<'PY'
          from pathlib import Path
          import torch
          legacy_path = Path("checkpoints/transformer/step_500_legacy.pt")
          if legacy_path.exists():
              old = torch.load(legacy_path, map_location="cpu", weights_only=False)
              new = torch.load("checkpoints/transformer/step_500.pt", map_location="cpu", weights_only=False)
              if old["model"].keys() != new["model"].keys():
                  raise SystemExit("Transformer bootstrap replay changed model state keys")
              # The legacy artifact has no optimizer moments. Replay reconstructs a
              # self-consistent (weights + AdamW + scheduler + RNG) state. CPU kernels
              # can produce small trajectory drift, so do NOT graft replayed moments
              # onto the old weights: the replay checkpoint becomes the canonical
              # longitudinal parent, and the measured drift is preserved in metadata.
              deltas = []
              failed = []
              for key in old["model"]:
                  reference, replay = old["model"][key], new["model"][key]
                  if not torch.is_floating_point(reference):
                      if not torch.equal(reference, replay):
                          failed.append(key)
                      continue
                  if not torch.isfinite(reference).all() or not torch.isfinite(replay).all():
                      failed.append(key)
                      continue
                  delta = (reference - replay).abs()
                  max_abs = float(delta.max().item()) if delta.numel() else 0.0
                  scale = max(1.0, float(reference.abs().max().item()))
                  deltas.append((key, max_abs, max_abs / scale))
              if failed:
                  raise SystemExit(f"Transformer replay has invalid/nonmatching tensors: {failed[:8]}")
              worst = sorted(deltas, key=lambda item: item[1], reverse=True)[:8]
              worst_abs = max((item[1] for item in deltas), default=0.0)
              if worst_abs > 5e-4:
                  raise SystemExit(f"Transformer replay drift exceeds 5e-4 safety bound: worst={worst}")
              optimizer_state = new.get("optimizer", {}).get("state", {})
              if int(new.get("step", -1)) != 500 or not optimizer_state:
                  raise SystemExit("Transformer replay did not produce a valid 500-step optimizer state")
              new["bootstrap"] = {
                  "method": "500-step replay; replay weights and optimizer retained as one consistent state",
                  "reference_checkpoint": "original evaluated pilot step 500",
                  "max_abs_weight_drift": worst_abs,
                  "worst_tensor_deltas": [
                      {"name": name, "max_abs": absolute, "scaled_max_abs": relative}
                      for name, absolute, relative in worst
                  ],
                  "weights_source": "replayed 500-step trajectory; optimizer/scheduler/RNG are from the same trajectory",
                  "note": "The original artifact omitted optimizer state. The replay is the canonical continuation parent; do not combine its optimizer with original weights.",
              }
              torch.save(new, "checkpoints/transformer/step_500.pt")
              print(f"Transformer replay accepted as canonical consistent state (max_abs_weight_drift={worst_abs:.3e}); replay weights and optimizer/scheduler/RNG retained together.")
              legacy_path.unlink()
          PY

      - name: Prepare frozen GSM8K test-only holdout once
        if: hashFiles('artifacts/reasoning_gsm8k_500.jsonl') == ''
        run: |
          python scripts/prepare_reasoning_holdout.py \
            --train-data data/pilot_train_19k.jsonl \
            --output artifacts/reasoning_gsm8k_500.jsonl \
            --manifest artifacts/reasoning_gsm8k_500.manifest.json \
            --count 500

      - name: Train matched models in validated 500-step blocks
        shell: bash
        run: |
          set -euo pipefail
          START="${{ steps.plan.outputs.start_step }}"
          BLOCKS="${{ steps.plan.outputs.blocks }}"
          for ((index=1; index<=BLOCKS; index++)); do
            PREV=$((START + (index - 1) * 500))
            TARGET=$((START + index * 500))
            echo "===== Longitudinal hito $TARGET (parent $PREV) ====="

            LUMEN_RESUME=()
            TRANSFORMER_RESUME=()
            if (( PREV > 0 )); then
              test -f "checkpoints/lumen/step_${PREV}.pt"
              test -f "checkpoints/transformer/step_${PREV}.pt"
              LUMEN_RESUME=(--resume "checkpoints/lumen/step_${PREV}.pt")
              TRANSFORMER_RESUME=(--resume "checkpoints/transformer/step_${PREV}.pt")
            fi

            python -m train.train \
              --steps 500 --phase 1 --pilot-all-rows \
              --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --batch 8 --max-len 128 --seed 42 \
              --lr 1.5e-4 --warmup 100 --total-steps 10000 \
              --ckpt-dir checkpoints/lumen "${LUMEN_RESUME[@]}"

            python -m train.transformer_baseline \
              --steps 500 \
              --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --batch 8 --max-len 128 --seed 42 \
              --lr 1.5e-4 --warmup 100 --total-steps 10000 \
              --ckpt-dir checkpoints/transformer "${TRANSFORMER_RESUME[@]}"

            python scripts/evaluate_pilot.py \
              --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --lumen-ckpt "checkpoints/lumen/step_${TARGET}.pt" \
              --transformer-ckpt "checkpoints/transformer/step_${TARGET}.pt" \
              --gsm8k artifacts/reasoning_gsm8k_500.jsonl \
              --historical-holdout data/holdout_500.jsonl \
              --gsm8k-limit 100 --max-new-tokens 64 \
              --expected-step "$TARGET" \
              --output "artifacts/evaluations/step_${TARGET}"

            PARENT_ARGS=()
            if (( PREV > 0 )); then
              PARENT_ARGS=(--lumen-parent "checkpoints/lumen/step_${PREV}.pt" \
                           --transformer-parent "checkpoints/transformer/step_${PREV}.pt")
            fi
            python scripts/write_experiment_manifest.py \
              --lumen "checkpoints/lumen/step_${TARGET}.pt" \
              --transformer "checkpoints/transformer/step_${TARGET}.pt" \
              --data data/pilot_train_19k.jsonl \
              --tokenizer data/pilot_tokenizer/tokenizer.json \
              --evaluation "artifacts/evaluations/step_${TARGET}/summary.json" \
              --gsm8k-holdout artifacts/reasoning_gsm8k_500.jsonl \
              --historical-holdout data/holdout_500.jsonl \
              --output "artifacts/manifests/step_${TARGET}.json" \
              "${PARENT_ARGS[@]}"
          done

      - name: Save reusable prepared data cache
        if: always() && steps.prepared-cache.outputs.cache-hit != 'true' && hashFiles('artifacts/reasoning_gsm8k_500.jsonl') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/pilot_train_19k.jsonl
            data/pilot_train_19k.manifest.json
            data/pilot_tokenizer/
            artifacts/reasoning_gsm8k_500.jsonl
            artifacts/reasoning_gsm8k_500.manifest.json
          key: ronin-lumen-prepared-v2-${{ hashFiles('scripts/build_pilot_corpus.py', 'scripts/prepare_reasoning_holdout.py', 'data/audit_holdout.py', 'data/holdout_500.jsonl') }}

      - name: Save validated parent checkpoints for the next workflow
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoints/lumen/step_${{ steps.plan.outputs.end_step }}.pt
            checkpoints/transformer/step_${{ steps.plan.outputs.end_step }}.pt
          key: ronin-lumen-checkpoints-v1-step-${{ steps.plan.outputs.end_step }}

      - name: Archive prepared corpus, tokenizer and holdout only when first built
        if: always() && steps.prepared-cache.outputs.cache-hit != 'true' && hashFiles('data/pilot_train_19k.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ronin-lumen-prepared-data-${{ github.run_id }}
          path: |
            data/pilot_train_19k.jsonl
            data/pilot_train_19k.manifest.json
            data/pilot_tokenizer/
            artifacts/reasoning_gsm8k_500.jsonl
            artifacts/reasoning_gsm8k_500.manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload checkpoints, manifests and predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronin-lumen-longitudinal-${{ github.run_id }}
          path: |
            checkpoints/
            artifacts/evaluations/
            artifacts/manifests/
          if-no-files-found: warn
          retention-days: 90
