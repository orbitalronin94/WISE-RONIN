name: Prepare RONIN-LUMEN source libraries

on:
  workflow_dispatch:
  push:
    branches:
      - lumen-v1/m1-refactor
    paths:
      - scripts/download_sources.py
      - data/README.md
      - .github/workflows/prepare-data.yml

permissions:
  contents: read

jobs:
  download-source-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lumen-v1/m1-refactor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install data preparation dependency
        run: python -m pip install --upgrade "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" zstandard

      - name: Validate downloader syntax
        run: python -m py_compile scripts/download_sources.py
      - name: Download and sample approved source datasets
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python scripts/download_sources.py \
            --output-dir artifacts/lumen-source-candidates

      - name: Upload source candidates and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: lumen-source-candidates-seed-42
          path: artifacts/lumen-source-candidates/
          if-no-files-found: error
          retention-days: 30
