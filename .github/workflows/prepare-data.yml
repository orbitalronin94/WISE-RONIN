name: Prepare RONIN-LUMEN source libraries

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lumen-data-gates
    paths:
      - scripts/download_sources.py
      - scripts/train_tokenizer.py
      - data/build_dataset.py
      - data/import_legacy_curated.py
      - data/audit_holdout.py
      - tests/test_data_audit.py
      - tests/test_dataset_gates.py
      - tests/test_legacy_import.py
      - data/README.md
      - data/owner/README.md
      - .github/workflows/prepare-data.yml

permissions:
  contents: read

jobs:
  download-source-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install data preparation dependencies
        run: |
          python -m pip install --upgrade "datasets>=3,<4" "huggingface_hub>=0.25,<1.0" zstandard pytest

      - name: Validate data tooling
        run: |
          python -m py_compile scripts/download_sources.py scripts/train_tokenizer.py data/build_dataset.py data/import_legacy_curated.py data/audit_holdout.py
          PYTHONPATH=. pytest -q tests/test_data_audit.py tests/test_dataset_gates.py tests/test_legacy_import.py

      - name: Download, normalize and sample approved source datasets
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python scripts/download_sources.py \
            --output-dir artifacts/lumen-source-candidates

      - name: Verify source hashes, candidate uniqueness and frozen holdout
        run: |
          python data/audit_holdout.py \
            --candidates artifacts/lumen-source-candidates \
            --holdout data/holdout_500.jsonl \
            --report artifacts/holdout-overlap-report.json

      - name: Upload source candidates and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: lumen-source-candidates-seed-42
          path: artifacts/lumen-source-candidates/
          if-no-files-found: error
          retention-days: 30

      - name: Upload holdout audit report
        uses: actions/upload-artifact@v4
        with:
          name: lumen-holdout-audit-${{ github.run_id }}
          path: artifacts/holdout-overlap-report.json
          if-no-files-found: error
          retention-days: 30
