name: Reusable WISE x5 — exact 1000-step checkpoint block

on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
      start_step:
        required: true
        type: number
      freeze_run_id:
        required: true
        type: string
      previous_artifact:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  train-chunk:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_WAIT_POLICY: "PASSIVE"
      PYTHONUNBUFFERED: "1"
      EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
      START_STEP: ${{ inputs.start_step }}
      MODEL_NAME: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore prepared immutable V4 corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: wise-v4-corpus-${{ inputs.freeze_run_id }}
      - name: Download V4 artifact only if cache is unavailable
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus
      - name: Restore exact preceding checkpoint
        if: ${{ inputs.previous_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_artifact }}
          path: previous
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Verify corpus and exact parent checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("corpus")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          assert len(m.get("shards",[]))==24
          print("V4 cache verified",m["total_rows"],"rows")
          PY
          START="$START_STEP"
          if [ "$START" -gt 0 ]; then
            PARENT="previous/checkpoint/step_${START}.pt"
            test -s "$PARENT"
            python - "$PARENT" "$START" "$MODEL_NAME" <<'PY'
          import sys,torch
          p,step,model=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(p,map_location="cpu",weights_only=False)
          arch="ronin_lumen_v3_3_neuroplasticity" if model=="lumen" else "decoder_transformer_4l_d488_h8_ff1464_tied_v1"
          params=12022016 if model=="lumen" else 11611472
          assert int(s["step"])==step and s["architecture_id"]==arch
          assert int(s["params"])==params
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256","tokenizer_sha256"))
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==25000
          print("Parent checkpoint validated",model,step,arch)
          PY
          fi
      - name: Run one 1000-step block with 100-step telemetry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "checkpoints/$MODEL_NAME" checkpoint logs
          START="$START_STEP"
          TARGET=$((START + 1000))
          if [ "$TARGET" -gt 25000 ]; then
            echo "Block exceeds the frozen 25000-step budget" >&2
            exit 2
          fi
          RESUME_ARGS=()
          if [ "$START" -gt 0 ]; then
            RESUME_ARGS+=(--resume "previous/checkpoint/step_${START}.pt")
          fi
          COMMON=(--data corpus --tokenizer corpus/tokenizer.json
            --batch 8 --max-len 128 --seed 42 --lr 1.5e-4
            --warmup 100 --total-steps 25000 --checkpoint-every 1000
            --parameter-check-every 100 --threads 4 --interop-threads 2
            --ckpt-dir "checkpoints/$MODEL_NAME")
          if [ "$MODEL_NAME" = "lumen" ]; then
            python -m train.train --steps 1000 --log-every 100 \
              "${COMMON[@]}" "${RESUME_ARGS[@]}" \
              --phase 1 --pilot-all-rows --v32-ze \
              --model-config config/lumen_wise_x5.json \
              --runtime-profile config/lumen_cpu_profile.json \
              --recovery-checkpoint-every 100 \
              2>&1 | tee "logs/lumen-${START}-${TARGET}.log"
            EXPECTED_PARAMS=12022016
            EXPECTED_ARCH="ronin_lumen_v3_3_neuroplasticity"
          elif [ "$MODEL_NAME" = "transformer" ]; then
            python -m train.transformer_baseline --steps 1000 \
              "${COMMON[@]}" "${RESUME_ARGS[@]}" \
              --model-dim 488 --heads 8 --ff-width 1464 \
              --disable-mkldnn --disable-foreach --cpu-affinity \
              2>&1 | tee "logs/transformer-${START}-${TARGET}.log"
            EXPECTED_PARAMS=11611472
            EXPECTED_ARCH="decoder_transformer_4l_d488_h8_ff1464_tied_v1"
          else
            echo "Unknown model: $MODEL_NAME" >&2
            exit 2
          fi
          FINAL="checkpoints/$MODEL_NAME/step_${TARGET}.pt"
          test -s "$FINAL"
          python - "$FINAL" "$TARGET" "$EXPECTED_PARAMS" "$EXPECTED_ARCH" "$EXPECTED_TOKENIZER_SHA256" <<'PY'
          import sys,torch
          path,target,params,architecture,tokenizer_sha=sys.argv[1],int(sys.argv[2]),int(sys.argv[3]),sys.argv[4],sys.argv[5]
          s=torch.load(path,map_location="cpu",weights_only=False)
          assert int(s["step"])==target
          assert int(s["params"])==params
          assert s["architecture_id"]==architecture
          assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256","tokenizer_sha256"))
          assert s["tokenizer_sha256"]==tokenizer_sha
          assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==25000
          if architecture=="ronin_lumen_v3_3_neuroplasticity":
              assert s.get("v32_ze") is True and s.get("pilot_all_rows") is True
          print(f"CHECKPOINT_VERIFIED model={architecture} step={target} params={params} data={s['data_sha256']}")
          PY
          cp "$FINAL" "checkpoint/step_${TARGET}.pt"
          echo "TARGET_STEP=$TARGET" >> "$GITHUB_ENV"
      - name: Publish completed block and recovery point
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-x5-step-${{ env.TARGET_STEP || inputs.start_step }}-run-${{ github.run_id }}
          path: |
            checkpoint/
            checkpoints/${{ inputs.model }}/latest_good.pt
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
