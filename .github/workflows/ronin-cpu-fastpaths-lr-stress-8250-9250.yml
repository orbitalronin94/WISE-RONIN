name: RONIN CPU fastpaths + LR tolerance 8250 to 9250

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Matched source run containing both step-8250 checkpoints
        required: true
        default: "45001865876"
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: ronin-cpu-fastpaths-8250-9250
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: torch-cpu-py311-${{ runner.os }}
          restore-keys: torch-cpu-py311-${{ runner.os }}-
      - name: Reuse runner PyTorch or install cached CPU wheel
        run: |
          set -euo pipefail
          if ! python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install tokenizers numpy tqdm
          python -c "import torch; assert torch.version.cuda is None"
      - name: Download frozen corpus and holdouts
        uses: actions/download-artifact@v4
        with:
          name: ronin-longrun-8000-prepared-${{ inputs.source_run_id }}
          path: artifacts/frozen
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download LUMEN checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: ronin-longrun-lumen-9000-${{ inputs.source_run_id }}
          path: artifacts/lumen-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Transformer checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: ronin-longrun-transformer-9000-${{ inputs.source_run_id }}
          path: artifacts/transformer-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble common step-8250 parents and frozen inputs
        run: |
          set -euo pipefail
          mkdir -p checkpoints/parents data artifacts
          cp artifacts/lumen-source/checkpoints/lumen/step_8250.pt checkpoints/parents/lumen_step_8250.pt
          cp artifacts/transformer-source/checkpoints/transformer/step_8250.pt checkpoints/parents/transformer_step_8250.pt
          cp artifacts/frozen/data/pilot_train_19k.jsonl data/pilot_train_19k.jsonl
          cp artifacts/frozen/data/pilot_train_19k.manifest.json data/pilot_train_19k.manifest.json
          cp artifacts/frozen/data/pilot_tokenized_128.pt data/pilot_tokenized_128.pt
          cp -a artifacts/frozen/data/pilot_tokenizer data/pilot_tokenizer
          cp artifacts/frozen/data/holdout_500.jsonl data/holdout_500.jsonl
          cp artifacts/frozen/artifacts/reasoning_gsm8k_500.jsonl artifacts/reasoning_gsm8k_500.jsonl
          test -s checkpoints/parents/lumen_step_8250.pt
          test -s checkpoints/parents/transformer_step_8250.pt
      - name: Audit parent state and prepare baseline plus LR probes
        run: |
          python scripts/prepare_step8250_cpu_continuation.py \
            --lumen checkpoints/parents/lumen_step_8250.pt \
            --transformer checkpoints/parents/transformer_step_8250.pt \
            --data data/pilot_train_19k.jsonl \
            --tokenizer data/pilot_tokenizer/tokenizer.json \
            --output-dir checkpoints/continuation
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-cpu-8250-prepared-${{ github.run_id }}
          path: |
            checkpoints/parents/
            checkpoints/continuation/
            data/
            artifacts/reasoning_gsm8k_500.jsonl
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  train-lumen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: torch-cpu-py311-${{ runner.os }}
          restore-keys: torch-cpu-py311-${{ runner.os }}-
      - name: Reuse runner PyTorch or install cached CPU wheel
        run: |
          if ! python -c "import torch; assert torch.version.cuda is None"; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-8250-prepared-${{ github.run_id }}
          path: .
      - name: LUMEN optimized 1000-step continuation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen artifacts/timing
          resume=checkpoints/continuation/lumen_step_8250_continuation.pt
          for target in 8500 8750 9000 9250; do
            python -m train.train \
              --steps 250 --phase 1 --pilot-all-rows \
              --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
              --token-cache data/pilot_tokenized_128.pt --batch 8 --max-len 128 --seed 42 \
              --runtime-profile config/lumen_cpu_profile_fast.json --threads 4 --interop-threads 1 \
              --lr 2e-5 --warmup 100 --total-steps 9250 \
              --scheduler-transition --transition-start 8250 --transition-end 9250 \
              --warmup-transition 1 --grad-clip 0.5 --log-every 100 --checkpoint-every 250 \
              --recovery-checkpoint-every 0 --parameter-check-every 100 \
              --wall-clock-file artifacts/timing/lumen.json --ckpt-dir checkpoints/lumen --resume "$resume"
            resume=checkpoints/lumen/step_${target}.pt
            test -s "$resume"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-cpu-lumen-9250-${{ github.run_id }}
          path: |
            checkpoints/lumen/
            artifacts/timing/lumen.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  train-transformer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: torch-cpu-py311-${{ runner.os }}
          restore-keys: torch-cpu-py311-${{ runner.os }}-
      - name: Reuse runner PyTorch or install cached CPU wheel
        run: |
          if ! python -c "import torch; assert torch.version.cuda is None"; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-8250-prepared-${{ github.run_id }}
          path: .
      - name: Transformer matched 1000-step continuation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer artifacts/timing
          resume=checkpoints/continuation/transformer_step_8250_continuation.pt
          for target in 8500 8750 9000 9250; do
            python -m train.transformer_baseline \
              --steps 250 --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
              --token-cache data/pilot_tokenized_128.pt --batch 8 --max-len 128 --seed 42 --threads 4 \
              --lr 5e-5 --warmup 100 --total-steps 9250 \
              --scheduler-transition --transition-start 8250 --transition-end 9250 \
              --warmup-transition 1 --grad-clip 1.0 --parameter-check-every 100 --wall-clock-file artifacts/timing/transformer.json \
              --ckpt-dir checkpoints/transformer --resume "$resume"
            resume=checkpoints/transformer/step_${target}.pt
            test -s "$resume"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-cpu-transformer-9250-${{ github.run_id }}
          path: |
            checkpoints/transformer/
            artifacts/timing/transformer.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  lr-stress-probes:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: lumen, multiplier: "1.5", lr: "3e-5", checkpoint: "lumen_1p5x.pt"}
          - {model: lumen, multiplier: "2.0", lr: "4e-5", checkpoint: "lumen_2x.pt"}
          - {model: transformer, multiplier: "1.5", lr: "7.5e-5", checkpoint: "transformer_1p5x.pt"}
          - {model: transformer, multiplier: "2.0", lr: "1e-4", checkpoint: "transformer_2x.pt"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: torch-cpu-py311-${{ runner.os }}
          restore-keys: torch-cpu-py311-${{ runner.os }}-
      - name: Reuse runner PyTorch or install cached CPU wheel
        run: |
          if ! python -c "import torch; assert torch.version.cuda is None"; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-8250-prepared-${{ github.run_id }}
          path: .
      - name: Run isolated 100-step LR stress probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/stress artifacts/timing
          if [ "${{ matrix.model }}" = "lumen" ]; then
            python -m train.train \
              --steps 100 --phase 1 --pilot-all-rows \
              --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
              --token-cache data/pilot_tokenized_128.pt --batch 8 --max-len 128 --seed 42 \
              --runtime-profile config/lumen_cpu_profile_fast.json --threads 4 --interop-threads 1 \
              --lr ${{ matrix.lr }} --warmup 100 --total-steps 8350 \
              --scheduler-transition --transition-start 8250 --transition-end 8350 \
              --warmup-transition 10 --grad-clip 0.5 --log-every 10 --checkpoint-every 100 \
              --recovery-checkpoint-every 0 --parameter-check-every 10 \
              --wall-clock-file artifacts/timing/lumen.json \
              --ckpt-dir checkpoints/stress/lumen-${{ matrix.multiplier }}x \
              --resume checkpoints/continuation/stress/${{ matrix.checkpoint }}
          else
            python -m train.transformer_baseline \
              --steps 100 --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
              --token-cache data/pilot_tokenized_128.pt --batch 8 --max-len 128 --seed 42 --threads 4 \
              --lr ${{ matrix.lr }} --warmup 100 --total-steps 8350 \
              --scheduler-transition --transition-start 8250 --transition-end 8350 \
              --warmup-transition 10 --grad-clip 1.0 --parameter-check-every 10 \
              --wall-clock-file artifacts/timing/transformer.json \
              --ckpt-dir checkpoints/stress/transformer-${{ matrix.multiplier }}x \
              --resume checkpoints/continuation/stress/${{ matrix.checkpoint }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-lr-stress-${{ matrix.model }}-${{ matrix.multiplier }}x-${{ github.run_id }}
          path: |
            checkpoints/stress/
            artifacts/timing/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  matched-holdout:
    needs: [train-lumen, train-transformer]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: torch-cpu-py311-${{ runner.os }}
          restore-keys: torch-cpu-py311-${{ runner.os }}-
      - name: Reuse runner PyTorch or install cached CPU wheel
        run: |
          if ! python -c "import torch; assert torch.version.cuda is None"; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install tokenizers numpy tqdm
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-8250-prepared-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-lumen-9250-${{ github.run_id }}
          path: artifacts/lumen-result
      - uses: actions/download-artifact@v4
        with:
          name: ronin-cpu-transformer-9250-${{ github.run_id }}
          path: artifacts/transformer-result
      - name: Assemble checkpoints and run identical holdout
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen checkpoints/transformer artifacts/evaluations/final_9250 artifacts/manifests
          cp artifacts/lumen-result/checkpoints/lumen/step_9250.pt checkpoints/lumen/step_9250.pt
          cp artifacts/transformer-result/checkpoints/transformer/step_9250.pt checkpoints/transformer/step_9250.pt
          python scripts/evaluate_pilot.py \
            --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
            --lumen-ckpt checkpoints/lumen/step_9250.pt --transformer-ckpt checkpoints/transformer/step_9250.pt \
            --gsm8k artifacts/reasoning_gsm8k_500.jsonl --historical-holdout data/holdout_500.jsonl \
            --gsm8k-limit 100 --max-new-tokens 64 --expected-step 9250 \
            --output artifacts/evaluations/final_9250
          python scripts/write_experiment_manifest.py \
            --lumen checkpoints/lumen/step_9250.pt --transformer checkpoints/transformer/step_9250.pt \
            --data data/pilot_train_19k.jsonl --tokenizer data/pilot_tokenizer/tokenizer.json \
            --evaluation artifacts/evaluations/final_9250/summary.json \
            --gsm8k-holdout artifacts/reasoning_gsm8k_500.jsonl --historical-holdout data/holdout_500.jsonl \
            --lumen-parent checkpoints/parents/lumen_step_8250.pt \
            --transformer-parent checkpoints/parents/transformer_step_8250.pt \
            --output artifacts/manifests/step_9250.json
      - uses: actions/upload-artifact@v4
        with:
          name: ronin-cpu-matched-9250-${{ github.run_id }}
          path: |
            checkpoints/lumen/step_9250.pt
            checkpoints/transformer/step_9250.pt
            artifacts/evaluations/final_9250/
            artifacts/manifests/step_9250.json
            artifacts/lumen-result/artifacts/timing/
            artifacts/transformer-result/artifacts/timing/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
