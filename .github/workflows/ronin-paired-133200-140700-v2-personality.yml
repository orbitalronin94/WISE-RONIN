name: RONIN paired 133200 to 140700 — v2 plus 50k Lumen personality

on:
  push:
    branches: [experiment/lumen-transformer-140700-v2-personality-py314]
    paths:
      - docs/LAUNCH_LUMEN_TRANSFORMER_133200_140700_V2_PERSONALITY.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-paired-133200-140700-v2-personality
  cancel-in-progress: false

env:
  LUMEN_PARENT_RUN_ID: "45082812702"
  TRANSFORMER_PARENT_RUN_ID: "45123727239"
  V2_PREPARED_RUN_ID: "45071952349"
  PERSONALITY_REPO: orbitalronin94/MINIRONIN
  PERSONALITY_REF: bd40e34aca78dfb95cad48b33ae99a804cee3633
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PERSONALITY_REPO }}
          ref: ${{ env.PERSONALITY_REF }}
          path: personality-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
          cache: pip
      - name: Install current CPU data runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
          python - <<'PY'
          import sys, torch, numpy, tokenizers
          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("NumPy:", numpy.__version__)
          print("Tokenizers:", tokenizers.__version__)
          PY
      - name: Download frozen v2 preparation
        uses: actions/download-artifact@v6
        with:
          name: ronin-paired-v2-prepared-45071952349
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.V2_PREPARED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build identical 200k-v2 plus 50k Lumen-personality corpus and token cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          from tokenizers import Tokenizer

          root=Path("prepared")
          v2=root/"artifacts/spanish-v2"
          sample=root/"data/spanish-v2-train-sample.jsonl"
          manifest=json.loads((v2/"manifest.json").read_text(encoding="utf-8"))
          assert manifest["train_rows"] == 9357876
          assert manifest["validation_rows"] == 1413
          assert manifest["holdout_rows"] == 2431
          assert hashlib.sha256((v2/"tokenizer.json").read_bytes()).hexdigest() == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert hashlib.sha256(sample.read_bytes()).hexdigest() == "3e4585194a7dca49916939cf8b13d6fce801b8cae00d949f3f4d37a6dbbbcf54"
          tok=Tokenizer.from_file(str(v2/"tokenizer.json"))
          assert tok.get_vocab_size()==4096 and tok.token_to_id("[PAD]")==0 and tok.token_to_id("[EOS]") is not None
          base_lines=sample.read_text(encoding="utf-8").splitlines()
          assert len(base_lines)==200000

          src=Path("personality-source/data/curated")
          pm=json.loads((src/"minironin-verifiable-personality-50k-v1.manifest.json").read_text(encoding="utf-8"))
          assert pm["records"]==50000 and pm["unique_rows"]==50000 and pm["underlying_fact_count"]==40
          IDENTITY=("Identidad estable del asistente: eres Lumen-Ronin, un modelo experimental pequeño "
            "de arquitectura recurrente y CPU-first. Tu arquitectura incorpora mecanismos "
            "computacionales de regulación y memoria: glucosa como presupuesto energético, "
            "señales de dolor y placer, homeostasis, replay, engramas y refinamientos Delta. "
            "Estos nombres describen mecanismos computacionales; no afirmes sentir dolor, placer "
            "ni tener conciencia o experiencias subjetivas. No te presentes como MINIRONIN ni HERETIC. "
            "No inventes capacidades, resultados, recuerdos ni credenciales. Reconoce incertidumbre.")
          STYLE=("Estilo: erudito, sobrio, incisivo y con ironía seca cuando encaje. La ironía nunca "
            "debe alterar los hechos, ocultar incertidumbre ni convertir una hipótesis en certeza.")
          out=root/"data/spanish-v2-plus-personality-250k.jsonl"
          personality=root/"data/lumen-personality-50k.jsonl"
          seen=set()
          n=0
          with personality.open("w",encoding="utf-8",newline="\n") as pf, out.open("w",encoding="utf-8",newline="\n") as dst:
            for line in base_lines:
              dst.write(line+"\n")
            for meta in pm["files"]:
              p=Path("personality-source")/meta["file"]
              raw=p.read_bytes()
              assert len(raw)==meta["bytes"]
              assert hashlib.sha256(raw).hexdigest()==meta["sha256"], p.name
              with gzip.open(p,"rt",encoding="utf-8") as f:
                for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  prompt=(f"{IDENTITY}\n{STYLE}\nContexto: {r['context']}\n"
                          f"Pregunta: {r['question']}\nRespuesta:")
                  row={"id":"lumen-"+r["id"],"prompt":prompt,"completion":r["answer"],
                       "task":"verifiable_personality","language":"es",
                       "source":"MINIRONIN verifiable personality corpus adapted for Lumen-Ronin",
                       "source_id":r["id"],"source_url":r["source_url"],
                       "period":r["period"],"license":r["license"]}
                  key=(row["prompt"],row["completion"])
                  if key in seen: raise RuntimeError("Duplicate personality pair: "+r["id"])
                  seen.add(key)
                  encoded=json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n"
                  pf.write(encoded); dst.write(encoded); n+=1
          assert n==50000, n
          print(json.dumps({"v2_sample_rows":len(base_lines),"personality_rows":n,
            "combined_rows":len(base_lines)+n,
            "combined_sha256":hashlib.sha256(out.read_bytes()).hexdigest(),
            "personality_sha256":hashlib.sha256(personality.read_bytes()).hexdigest(),
            "tokenizer_sha256":hashlib.sha256((v2/"tokenizer.json").read_bytes()).hexdigest()},indent=2))
          PY
          python scripts/prepare_token_cache.py \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --max-len 128 \
            --output prepared/data/spanish-v2-plus-personality-token-cache.pt
      - name: Upload immutable paired training input
        uses: actions/upload-artifact@v6
        with:
          name: ronin-v2-plus-personality-250k-${{ github.run_id }}
          path: prepared/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  train-lumen:
    needs: prepare-data
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install current CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
          python -c "import sys,torch,numpy,tokenizers; print(sys.version); print('torch',torch.__version__,'numpy',numpy.__version__,'tokenizers',tokenizers.__version__)"
      - name: Download exact Lumen step-133200 parent
        uses: actions/download-artifact@v6
        with:
          name: ronin-lumen-step133500-v2-45082812702
          path: lumen-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.LUMEN_PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download paired training input
        uses: actions/download-artifact@v6
        with:
          name: ronin-v2-plus-personality-250k-${{ github.run_id }}
          path: prepared
      - name: Verify Lumen lineage and transition eligibility
        run: |
          set -euo pipefail
          test -s lumen-parent/checkpoints/lumen-v2-133500/latest_good.pt
          python - <<'PY'
          import torch, hashlib
          s=torch.load("lumen-parent/checkpoints/lumen-v2-133500/latest_good.pt",map_location="cpu",weights_only=False)
          assert s["step"]==133200
          assert s["architecture_id"]=="ronin_lumen_v3_2_parallel_delta"
          assert s["pilot_all_rows"] is True and s["phase"]==1
          assert s["training_config"]["batch"]==8 and s["training_config"]["max_len"]==128
          assert s["training_config"]["lr"]==3e-5
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s.get("optimizer") and s.get("scheduler_transition") and s.get("rng")
          assert int(s["scheduler_transition"]["current_step"]) in (133200,133201)
          print("Lumen parent exact:",s["step"],"lr:",s["optimizer"]["param_groups"][0]["lr"])
          PY
      - name: Preserve the Lumen organ and Delta runtime profile
        run: |
          mkdir -p config checkpoints/lumen-v2-140700 logs
          cat > config/lumen_organ_delta2_profile.json <<'JSON'
          {
            "threads": 4,
            "interop_threads": 2,
            "mkldnn_enabled": true,
            "foreach": false,
            "cpu_affinity": true,
            "delta_pre_normalize": false,
            "homeostasis_fused_scatter": false,
            "delta_parallel_refinements": 2,
            "organs": {
              "pain": {"response": 0.30, "decay": 0.55},
              "pleasure": {"response": 0.75},
              "pain_budget_gain": 0.10,
              "pleasure_budget_gain": 0.1125
            }
          }
          JSON
      - name: Train Lumen 7500 additional steps, preserving weights and optimizer moments
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python -m train.train \
            --steps 7500 --resume lumen-parent/checkpoints/lumen-v2-133500/latest_good.pt \
            --phase 1 --pilot-all-rows --no-sleep --allow-corpus-transition \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/lumen_organ_delta2_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 140700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 133200 --transition-end 140700 \
            --warmup-transition 100 --transition-plateau-steps 6000 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 500 --recovery-checkpoint-every 100 \
            --parameter-check-every 100 --ckpt-dir checkpoints/lumen-v2-140700 \
            2>&1 | tee logs/lumen-133200-140700-v2-personality.log
      - name: Verify final Lumen checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen-v2-140700/step_140700.pt",map_location="cpu",weights_only=False)
          assert s["step"]==140700 and s["architecture_id"]=="ronin_lumen_v3_2_parallel_delta"
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s.get("optimizer") and s.get("rng") and s.get("scheduler_transition")
          print("Lumen final checkpoint verified at",s["step"])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ronin-lumen-step140700-v2-personality-${{ github.run_id }}
          path: |
            checkpoints/lumen-v2-140700/
            logs/lumen-133200-140700-v2-personality.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  train-transformer:
    needs: prepare-data
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install current CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
          python -c "import sys,torch,numpy,tokenizers; print(sys.version); print('torch',torch.__version__,'numpy',numpy.__version__,'tokenizers',tokenizers.__version__)"
      - name: Download exact Transformer step-133200 synchronized parent
        uses: actions/download-artifact@v6
        with:
          name: ronin-step133200-paired-v2-holdout-45123727239
          path: transformer-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.TRANSFORMER_PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download paired training input
        uses: actions/download-artifact@v6
        with:
          name: ronin-v2-plus-personality-250k-${{ github.run_id }}
          path: prepared
      - name: Verify Transformer lineage and transition eligibility
        run: |
          set -euo pipefail
          test -s transformer-parent/checkpoints/transformer-sync-133200/step_133200.pt
          python - <<'PY'
          import torch
          s=torch.load("transformer-parent/checkpoints/transformer-sync-133200/step_133200.pt",map_location="cpu",weights_only=False)
          assert s["step"]==133200
          assert s["architecture_id"]=="decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert s["training_config"]["batch"]==8 and s["training_config"]["max_len"]==128
          assert s["training_config"]["lr"]==7.5e-5
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s.get("optimizer") and s.get("scheduler_transition") and s.get("rng")
          assert int(s["scheduler_transition"]["current_step"]) in (133200,133201)
          print("Transformer parent exact:",s["step"],"lr:",s["optimizer"]["param_groups"][0]["lr"])
          PY
      - name: Train Transformer 7500 additional steps, preserving weights and optimizer moments
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer-v2-140700 logs
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python -m train.transformer_baseline \
            --steps 7500 --resume transformer-parent/checkpoints/transformer-sync-133200/step_133200.pt \
            --allow-corpus-transition \
            --data prepared/data/spanish-v2-plus-personality-250k.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-plus-personality-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 140700 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 133200 --transition-end 140700 \
            --warmup-transition 100 --transition-plateau-steps 6000 \
            --transition-min-lr-ratio 0.5 \
            --parameter-check-every 100 --ckpt-dir checkpoints/transformer-v2-140700 \
            2>&1 | tee logs/transformer-133200-140700-v2-personality.log
      - name: Verify final Transformer checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer-v2-140700/step_140700.pt",map_location="cpu",weights_only=False)
          assert s["step"]==140700 and s["architecture_id"]=="decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s.get("optimizer") and s.get("rng") and s.get("scheduler_transition")
          print("Transformer final checkpoint verified at",s["step"])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ronin-transformer-step140700-v2-personality-${{ github.run_id }}
          path: |
            checkpoints/transformer-v2-140700/
            logs/transformer-133200-140700-v2-personality.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  final-holdout:
    needs: [prepare-data, train-lumen, train-transformer]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Install current CPU evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm
      - uses: actions/download-artifact@v6
        with:
          name: ronin-v2-plus-personality-250k-${{ github.run_id }}
          path: prepared
      - uses: actions/download-artifact@v6
        with:
          name: ronin-lumen-step140700-v2-personality-${{ github.run_id }}
          path: lumen
      - uses: actions/download-artifact@v6
        with:
          name: ronin-transformer-step140700-v2-personality-${{ github.run_id }}
          path: transformer
      - name: Evaluate both models on the untouched v2 holdout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --lumen lumen/checkpoints/lumen-v2-140700/step_140700.pt \
            --transformer transformer/checkpoints/transformer-v2-140700/step_140700.pt \
            --expected-step 140700 --out results/step140700_paired_v2_personality_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ronin-step140700-paired-v2-personality-holdout-${{ github.run_id }}
          path: results/step140700_paired_v2_personality_holdout.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    needs: [prepare-data, train-lumen, train-transformer, final-holdout]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report paired experiment status
        env:
          PREPARE: ${{ needs.prepare-data.result }}
          LUMEN: ${{ needs.train-lumen.result }}
          TRANSFORMER: ${{ needs.train-transformer.result }}
          HOLDOUT: ${{ needs.final-holdout.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Paired 133200 -> 140700, 200k Spanish-v2 sample + 50k Lumen personality, run ${RUN_ID}"
          echo "Preparation: ${PREPARE}"
          echo "Lumen: ${LUMEN}"
          echo "Transformer: ${TRANSFORMER}"
          echo "Untouched v2 holdout: ${HOLDOUT}"
          test "${PREPARE}" = success
          test "${LUMEN}" = success
          test "${TRANSFORMER}" = success
          test "${HOLDOUT}" = success
