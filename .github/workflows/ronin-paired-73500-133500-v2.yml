name: RONIN paired continuation 73500 to 133500 — Lumen vs Transformer on Spanish corpus v2

on:
  push:
    branches: [experiment/lumen-transformer-73500-133500-v2-legacyarch]
    paths:
      - docs/LAUNCH_LUMEN_TRANSFORMER_73500_133500_V2.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: ronin-paired-73500-133500-v2
  cancel-in-progress: false

env:
  PARENT_RUN_ID: "45071952349"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest tokenizers
      - name: Compile and run focused tests
        run: |
          python -m compileall -q model train data scripts
          PYTHONPATH=. pytest -q tests/test_affect_organs.py tests/test_scheduler_transition.py

  prepare-v2:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact frozen v2 preparation from step 73500
        uses: actions/download-artifact@v4
        with:
          name: ronin-paired-v2-prepared-45071952349
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the unchanged corpus, sample, tokenizer and cache
        run: |
          set -euo pipefail
          test -s prepared/data/spanish-v2-train-sample.jsonl
          test -s prepared/data/spanish-v2-token-cache.pt
          test -s prepared/artifacts/spanish-v2/manifest.json
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          test -s prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from tokenizers import Tokenizer
          root=Path("prepared/artifacts/spanish-v2")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          tok=Tokenizer.from_file(str(root/"tokenizer.json"))
          assert manifest["train_rows"] == 9357876
          assert manifest["validation_rows"] == 1413
          assert manifest["holdout_rows"] == 2431
          assert tok.get_vocab_size() == 4096
          assert tok.token_to_id("[PAD]") == 0
          assert tok.token_to_id("[EOS]") is not None
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest() == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert len((Path("prepared/data/spanish-v2-train-sample.jsonl")).read_text(encoding="utf-8").splitlines()) == 200000
          print("Exact step-73500 v2 corpus/cache/tokenizer artifact verified; no retokenization.")
          PY

  train-lumen:
    needs: prepare-v2
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download promoted Lumen step-73500 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-step73500-v2-45071952349
          path: lumen-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Lumen lineage and active organs
        run: |
          set -euo pipefail
          test -s lumen-parent/checkpoints/lumen-v2/step_73500.pt
          python - <<'PY'
          import torch
          s=torch.load("lumen-parent/checkpoints/lumen-v2/step_73500.pt",map_location="cpu",weights_only=False)
          assert s["step"] == 73500
          assert s["architecture_id"] == "ronin_lumen_v3_2_parallel_delta"
          assert s["pilot_all_rows"] is True
          assert s["phase"] == 1
          assert s["training_config"]["batch"] == 8
          assert s["training_config"]["max_len"] == 128
          assert s["training_config"]["lr"] == 3e-5
          assert s["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s["optimizer"] and s["scheduler"] and s["rng"]
          t=s["scheduler_transition"]
          assert t and t["current_step"] in (73500,73501)
          assert t["end_step"] == 73500
          print("Lumen parent verified: v3.2 parallel Delta, all organs retained, step 73500.")
          PY
      - name: Build the unchanged organ runtime profile
        run: |
          mkdir -p config
          cat > config/lumen_organ_delta2_profile.json <<'JSON'
          {
            "threads": 4,
            "interop_threads": 2,
            "mkldnn_enabled": true,
            "foreach": false,
            "cpu_affinity": true,
            "delta_pre_normalize": false,
            "homeostasis_fused_scatter": false,
            "delta_parallel_refinements": 2,
            "organs": {
              "pain": {"response": 0.30, "decay": 0.55},
              "pleasure": {"response": 0.75},
              "pain_budget_gain": 0.10,
              "pleasure_budget_gain": 0.1125
            }
          }
          JSON
      - name: Continue Lumen from 73500 to 133500, preserving optimizer and RNG
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen-v2-133500 logs
          python -m train.train \
            --steps 60000 --resume lumen-parent/checkpoints/lumen-v2/step_73500.pt \
            --phase 1 --pilot-all-rows --no-sleep \
            --data prepared/data/spanish-v2-train-sample.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 \
            --runtime-profile config/lumen_organ_delta2_profile.json \
            --lr 3e-5 --warmup 100 --total-steps 133500 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 73500 --transition-end 133500 \
            --warmup-transition 100 --transition-plateau-steps 48000 \
            --transition-min-lr-ratio 0.5 \
            --log-every 100 --checkpoint-every 500 --recovery-checkpoint-every 100 \
            --parameter-check-every 100 --ckpt-dir checkpoints/lumen-v2-133500 \
            2>&1 | tee logs/lumen-73500-133500-v2.log
      - name: Verify final Lumen checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/lumen-v2-133500/step_133500.pt",map_location="cpu",weights_only=False)
          assert s["step"] == 133500
          assert s["architecture_id"] == "ronin_lumen_v3_2_parallel_delta"
          assert s["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s["optimizer"] and s["rng"] and s["scheduler"]
          assert s["scheduler_transition"]["current_step"] in (133500,133501)
          print("Lumen step 133500 checkpoint verified.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-lumen-step133500-v2-${{ github.run_id }}
          path: |
            checkpoints/lumen-v2-133500/
            logs/lumen-73500-133500-v2.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  train-transformer:
    needs: prepare-v2
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download paired Transformer step-73500 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ronin-transformer-step73500-v2-45071952349
          path: transformer-parent
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Transformer lineage
        run: |
          set -euo pipefail
          test -s transformer-parent/checkpoints/transformer-v2/step_73500.pt
          python - <<'PY'
          import torch
          s=torch.load("transformer-parent/checkpoints/transformer-v2/step_73500.pt",map_location="cpu",weights_only=False)
          assert s["step"] == 73500
          assert s["architecture_id"] == "decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert s["training_config"]["batch"] == 8
          assert s["training_config"]["max_len"] == 128
          assert s["training_config"]["lr"] == 7.5e-5
          assert s["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s["optimizer"] and s["scheduler"] and s["rng"]
          t=s["scheduler_transition"]
          assert t and t["current_step"] in (73500,73501)
          assert t["end_step"] == 73500
          print("Transformer step-73500 parent verified.")
          PY
      - name: Continue Transformer from 73500 to 133500
        run: |
          set -euo pipefail
          mkdir -p checkpoints/transformer-v2-133500 logs
          python -m train.transformer_baseline \
            --steps 60000 --resume transformer-parent/checkpoints/transformer-v2/step_73500.pt \
            --data prepared/data/spanish-v2-train-sample.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --token-cache prepared/data/spanish-v2-token-cache.pt \
            --batch 8 --max-len 128 --seed 42 --threads 4 \
            --lr 7.5e-5 --warmup 100 --total-steps 133500 \
            --scheduler-transition --restart-scheduler-transition \
            --transition-start 73500 --transition-end 133500 \
            --warmup-transition 100 --transition-plateau-steps 48000 \
            --transition-min-lr-ratio 0.5 \
            --parameter-check-every 100 --ckpt-dir checkpoints/transformer-v2-133500 \
            2>&1 | tee logs/transformer-73500-133500-v2.log
      - name: Verify final Transformer checkpoint
        run: |
          python - <<'PY'
          import torch
          s=torch.load("checkpoints/transformer-v2-133500/step_133500.pt",map_location="cpu",weights_only=False)
          assert s["step"] == 133500
          assert s["architecture_id"] == "decoder_transformer_4l_d192_h4_ff576_tied_v1"
          assert s["tokenizer_sha256"] == "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert s["optimizer"] and s["rng"] and s["scheduler"]
          assert s["scheduler_transition"]["current_step"] in (133500,133501)
          print("Transformer step 133500 checkpoint verified.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-transformer-step133500-v2-${{ github.run_id }}
          path: |
            checkpoints/transformer-v2-133500/
            logs/transformer-73500-133500-v2.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  final-holdout:
    needs: [train-lumen, train-transformer]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU evaluation runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download the exact frozen v2 evaluation files
        uses: actions/download-artifact@v4
        with:
          name: ronin-paired-v2-prepared-45071952349
          path: prepared
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ronin-lumen-step133500-v2-${{ github.run_id }}
          path: lumen
      - uses: actions/download-artifact@v4
        with:
          name: ronin-transformer-step133500-v2-${{ github.run_id }}
          path: transformer
      - name: Run paired holdout at step 133500
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -s prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl
          test -s prepared/artifacts/spanish-v2/tokenizer.json
          test -s lumen/checkpoints/lumen-v2-133500/step_133500.pt
          test -s transformer/checkpoints/transformer-v2-133500/step_133500.pt
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 python scripts/evaluate_multiple_choice_holdout.py \
            --holdout prepared/artifacts/spanish-v2/holdout_multiple_choice.jsonl \
            --tokenizer prepared/artifacts/spanish-v2/tokenizer.json \
            --lumen lumen/checkpoints/lumen-v2-133500/step_133500.pt \
            --transformer transformer/checkpoints/transformer-v2-133500/step_133500.pt \
            --expected-step 133500 --out results/step133500_paired_v2_holdout.json \
            --threads 4 --max-len 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-step133500-paired-v2-final-holdout-${{ github.run_id }}
          path: results/step133500_paired_v2_holdout.json
          if-no-files-found: warn
          retention-days: 90

  summary:
    needs: [train-lumen, train-transformer, final-holdout]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report paired experiment status
        env:
          LUMEN: ${{ needs.train-lumen.result }}
          TRANSFORMER: ${{ needs.train-transformer.result }}
          HOLDOUT: ${{ needs.final-holdout.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Paired 73500 -> 133500 on Spanish corpus v2: run ${RUN_ID}"
          echo "Lumen: ${LUMEN}"
          echo "Transformer: ${TRANSFORMER}"
          echo "Final holdout: ${HOLDOUT}"
          test "${LUMEN}" = success
          test "${TRANSFORMER}" = success
          test "${HOLDOUT}" = success
