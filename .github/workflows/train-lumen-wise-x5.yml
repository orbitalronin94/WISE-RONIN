            checkpoints/lumen/
            experiment_manifest.json
            logs/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  train-transformer:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download the authorized frozen V4 artifact
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-${{ env.FREEZE_RUN_ID }}
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authorization, shard hashes and tokenizer
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("corpus")
          manifest_path=root/"manifest.json"
          m=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0" and m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          assert m.get("tokenizer_sha256")==os.environ["EXPECTED_TOKENIZER_SHA256"]
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==m["tokenizer_sha256"]
          total=0
          corpus_digest=hashlib.sha256()
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==shard["bytes"]<=104857600
              shard_digest=hashlib.sha256()
              with p.open("rb") as handle:
                  for chunk in iter(lambda:handle.read(1024*1024),b""):
                      shard_digest.update(chunk); corpus_digest.update(chunk)
              assert shard_digest.hexdigest()==shard["sha256"]
              total+=shard["rows"]
          assert total==m["total_rows"]
          experiment={
              "architecture_commit":os.environ["GITHUB_SHA"],
              "freeze_run_id":os.environ["FREEZE_RUN_ID"],
              "freeze_manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "corpus_data_sha256":corpus_digest.hexdigest(),
              "tokenizer_sha256":m["tokenizer_sha256"],
              "lumen_config_sha256":hashlib.sha256(Path("config/lumen_wise_x5.json").read_bytes()).hexdigest(),
              "transformer_config_sha256":hashlib.sha256(Path("config/transformer_wise_x5.json").read_bytes()).hexdigest(),
              "lumen_runtime_profile_sha256":hashlib.sha256(Path("config/lumen_cpu_profile.json").read_bytes()).hexdigest(),
              "steps":25000,"blocks":[5000]*5,"batch":8,"sequence_length":128,"seed":42,
              "learning_rate":0.00015,"warmup_steps":100,"optimizer":"AdamW","scheduler":"cosine","weight_decay":0.01,"grad_clip":1.0,"vocab_size":4096,"holdout_sha256":"e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359","threads":4,"interop_threads":2,"mkldnn_enabled":false,"foreach":false,"cpu_affinity":true,"device":"cpu"
          }
          Path("experiment_manifest.json").write_text(json.dumps(experiment,indent=2)+"\n",encoding="utf-8")
          print(f"Verified authorized V4: {total} rows; {len(m['shards'])} shards; data SHA {experiment['corpus_data_sha256']}")
          PY
      - name: Train Transformer block 1/5 (0 → 5000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --model-dim 488 --heads 8 --ff-width 1464
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42 --threads 4 --interop-threads 2 --disable-mkldnn --disable-foreach --cpu-affinity
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --parameter-check-every 100 --checkpoint-every 1000
              --ckpt-dir checkpoints/transformer
          )
          python -m train.transformer_baseline "${ARGS[@]}" 2>&1 | tee "logs/transformer-block-1.log"
          CURRENT="checkpoints/transformer/step_5000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "5000" "" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==11611472
          assert s["architecture_id"]=="decoder_transformer_4l_d488_h8_ff1464_tied_v1"
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
              p=torch.load(previous,map_location="cpu",weights_only=False)
              assert int(p["step"])==target-5000
              assert s["data_sha256"]==p["data_sha256"]
