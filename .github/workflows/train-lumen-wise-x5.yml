  paired-holdout:
    needs: [train-lumen, train-transformer]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy scipy
      - name: Download final LUMEN and Transformer checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wise-x5-checkpoints-${{ github.run_id }}"
          path: checkpoints
          merge-multiple: false
      - name: Download the frozen paired holdout and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: paired-v32-inputs-500000-45480785478
          path: eval_inputs
          repository: ${{ github.repository }}
          run-id: 45480785478
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both training manifests describe the same experiment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests=[json.loads(p.read_text()) for p in Path("checkpoints").rglob("experiment_manifest.json")]
          assert len(manifests)==2, len(manifests)
          assert manifests[0] == manifests[1], (manifests[0], manifests[1])
          print(json.dumps(manifests[0], indent=2))
          PY
      - name: Evaluate both step-25k models on the same untouched holdout
        run: |
          LUMEN_CKPT="$(find checkpoints -path '*/step_25000.pt' | grep lumen | head -n 1)"
          TRANSFORMER_CKPT="$(find checkpoints -path '*/step_25000.pt' | grep transformer | head -n 1)"
          test -s "$LUMEN_CKPT" && test -s "$TRANSFORMER_CKPT"
          python scripts/evaluate_lumen_wise_x5_holdout.py             --holdout eval_inputs/eval/holdout_multiple_choice.jsonl             --tokenizer eval_inputs/artifacts/tokenizer.json             --lumen "$LUMEN_CKPT" --transformer "$TRANSFORMER_CKPT"             --lumen-config config/lumen_wise_x5.json             --transformer-model-dim 488 --transformer-heads 8 --transformer-ff-width 1464             --expected-lumen-step 25000 --expected-transformer-step 25000             --expected-holdout-sha256 e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359             --out results/lumen-wise-x5-holdout.json
          python scripts/audit_paired_holdout.py             --input results/lumen-wise-x5-holdout.json             --output results/lumen-wise-x5-holdout-audit.json
      - name: Upload paired holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-holdout-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
