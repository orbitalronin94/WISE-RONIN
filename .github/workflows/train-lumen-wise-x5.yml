name: LUMEN-WISE x5 — 25k in five recoverable 5k blocks

on:
  workflow_dispatch:
    inputs:
      freeze_run_id:
        description: "Successful freeze-corpus-v4 workflow run ID"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/train-lumen-wise-x5.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lumen-wise-x5-paired-${{ github.event.inputs.freeze_run_id || 'SET_FREEZE_RUN_ID_AFTER_V4' }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  OMP_WAIT_POLICY: "PASSIVE"
  FREEZE_RUN_ID: ${{ github.event.inputs.freeze_run_id || 'SET_FREEZE_RUN_ID_AFTER_V4' }}
  PYTHONUNBUFFERED: "1"
  EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tokenizers tqdm pytest
      - name: Compile, run all tests and verify x5 parity
        run: |
          python -m compileall -q model train scripts
          PYTHONPATH=. pytest -q tests
          PYTHONPATH=. python scripts/validate_lumen_wise_x5.py
          python -m train.transformer_baseline --help >/dev/null
          PYTHONPATH=. python scripts/smoke_test_lumen_wise_x5_resume.py
      - name: Record frozen architecture revision
        run: |
          echo "Architecture commit: $(git rev-parse HEAD)"
          sha256sum config/lumen_wise_x5.json config/transformer_wise_x5.json config/lumen_cpu_profile.json

  train-lumen:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Download the authorized frozen V4 artifact
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-${{ env.FREEZE_RUN_ID }}
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authorization, shard hashes and tokenizer
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("corpus")
          manifest_path=root/"manifest.json"
          m=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          assert m.get("raw_text_target_met") and m.get("personality_target_met")
          assert m.get("tokenizer_sha256")==os.environ["EXPECTED_TOKENIZER_SHA256"]
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==m["tokenizer_sha256"]
          total=0
          corpus_digest=hashlib.sha256()
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==shard["bytes"]<=104857600
              shard_digest=hashlib.sha256()
              with p.open("rb") as handle:
                  for chunk in iter(lambda:handle.read(1024*1024),b""):
                      shard_digest.update(chunk)
                      corpus_digest.update(chunk)
              assert shard_digest.hexdigest()==shard["sha256"]
              total+=shard["rows"]
          assert total==m["total_rows"]
          experiment={
              "architecture_commit":os.environ["GITHUB_SHA"],
              "freeze_run_id":os.environ["FREEZE_RUN_ID"],
              "freeze_manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "corpus_data_sha256":corpus_digest.hexdigest(),
              "tokenizer_sha256":m["tokenizer_sha256"],
              "lumen_config_sha256":hashlib.sha256(Path("config/lumen_wise_x5.json").read_bytes()).hexdigest(),
              "transformer_config_sha256":hashlib.sha256(Path("config/transformer_wise_x5.json").read_bytes()).hexdigest(),
              "lumen_runtime_profile_sha256":hashlib.sha256(Path("config/lumen_cpu_profile.json").read_bytes()).hexdigest(),
              "steps":25000,"blocks":[5000]*5,"batch":8,"sequence_length":128,"seed":42,
              "learning_rate":0.00015,"warmup_steps":100,"optimizer":"AdamW","scheduler":"cosine","weight_decay":0.01,"grad_clip":1.0,"vocab_size":4096,"holdout_sha256":"e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359","threads":4,"interop_threads":2,"mkldnn_enabled":false,"foreach":false,"cpu_affinity":true,"device":"cpu"
          }
          Path("experiment_manifest.json").write_text(json.dumps(experiment,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"version":m["version"],"rows":total,"tokens":m["token_count_without_special_tokens"],"personality_share":m["personality_dialogue_share"],"shards":len(m["shards"]),"corpus_data_sha256":experiment["corpus_data_sha256"],"tokenizer_sha256":m["tokenizer_sha256"]},indent=2))
          PY
      - name: Train WISE-LUMEN block 1/5 (0 → 5000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --phase 1 --pilot-all-rows --v32-ze
              --model-config config/lumen_wise_x5.json
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --runtime-profile config/lumen_cpu_profile.json
              --threads 4 --interop-threads 2
              --log-every 100 --checkpoint-every 1000
              --parameter-check-every 100
              --ckpt-dir checkpoints/lumen
          )
          python -m train.train "${ARGS[@]}" 2>&1 | tee "logs/lumen-block-1.log"
          CURRENT="checkpoints/lumen/step_5000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "5000" "" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
              p=torch.load(previous,map_location="cpu",weights_only=False)
              assert int(p["step"])==target-5000
              assert s["data_sha256"]==p["data_sha256"]
              assert s["tokenizer_sha256"]==p["tokenizer_sha256"]
          print(f"verified LUMEN step={target} params={s['params']} data={s['data_sha256']}")
          PY
      - name: Publish WISE-LUMEN block 1/5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-block-1-5000-${{ github.run_id }}
          path: |
            checkpoints/lumen/step_5000.pt
            logs/lumen-block-1.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Train WISE-LUMEN block 2/5 (5000 → 10000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --phase 1 --pilot-all-rows --v32-ze
              --model-config config/lumen_wise_x5.json
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --runtime-profile config/lumen_cpu_profile.json
              --threads 4 --interop-threads 2
              --log-every 100 --checkpoint-every 1000
              --parameter-check-every 100
              --ckpt-dir checkpoints/lumen
          )
          ARGS+=(--resume "checkpoints/lumen/step_5000.pt")
          python -m train.train "${ARGS[@]}" 2>&1 | tee "logs/lumen-block-2.log"
          CURRENT="checkpoints/lumen/step_10000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "10000" "checkpoints/lumen/step_5000.pt" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
              p=torch.load(previous,map_location="cpu",weights_only=False)
              assert int(p["step"])==target-5000
              assert s["data_sha256"]==p["data_sha256"]
              assert s["tokenizer_sha256"]==p["tokenizer_sha256"]
          print(f"verified LUMEN step={target} params={s['params']} data={s['data_sha256']}")
          PY
      - name: Publish WISE-LUMEN block 2/5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-block-2-10000-${{ github.run_id }}
          path: |
            checkpoints/lumen/step_10000.pt
            logs/lumen-block-2.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Train WISE-LUMEN block 3/5 (10000 → 15000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --phase 1 --pilot-all-rows --v32-ze
              --model-config config/lumen_wise_x5.json
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --runtime-profile config/lumen_cpu_profile.json
              --threads 4 --interop-threads 2
              --log-every 100 --checkpoint-every 1000
              --parameter-check-every 100
              --ckpt-dir checkpoints/lumen
          )
          ARGS+=(--resume "checkpoints/lumen/step_10000.pt")
          python -m train.train "${ARGS[@]}" 2>&1 | tee "logs/lumen-block-3.log"
          CURRENT="checkpoints/lumen/step_15000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "15000" "checkpoints/lumen/step_10000.pt" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
              p=torch.load(previous,map_location="cpu",weights_only=False)
              assert int(p["step"])==target-5000
              assert s["data_sha256"]==p["data_sha256"]
              assert s["tokenizer_sha256"]==p["tokenizer_sha256"]
          print(f"verified LUMEN step={target} params={s['params']} data={s['data_sha256']}")
          PY
      - name: Publish WISE-LUMEN block 3/5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-block-3-15000-${{ github.run_id }}
          path: |
            checkpoints/lumen/step_15000.pt
            logs/lumen-block-3.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Train WISE-LUMEN block 4/5 (15000 → 20000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --phase 1 --pilot-all-rows --v32-ze
              --model-config config/lumen_wise_x5.json
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --runtime-profile config/lumen_cpu_profile.json
              --threads 4 --interop-threads 2
              --log-every 100 --checkpoint-every 1000
              --parameter-check-every 100
              --ckpt-dir checkpoints/lumen
          )
          ARGS+=(--resume "checkpoints/lumen/step_15000.pt")
          python -m train.train "${ARGS[@]}" 2>&1 | tee "logs/lumen-block-4.log"
          CURRENT="checkpoints/lumen/step_20000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "20000" "checkpoints/lumen/step_15000.pt" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
              p=torch.load(previous,map_location="cpu",weights_only=False)
              assert int(p["step"])==target-5000
              assert s["data_sha256"]==p["data_sha256"]
              assert s["tokenizer_sha256"]==p["tokenizer_sha256"]
          print(f"verified LUMEN step={target} params={s['params']} data={s['data_sha256']}")
          PY
      - name: Publish WISE-LUMEN block 4/5 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lumen-wise-x5-block-4-20000-${{ github.run_id }}
          path: |
            checkpoints/lumen/step_20000.pt
            logs/lumen-block-4.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Train WISE-LUMEN block 5/5 (20000 → 25000)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints/lumen logs
          ARGS=(
              --steps 5000
              --phase 1 --pilot-all-rows --v32-ze
              --model-config config/lumen_wise_x5.json
              --data corpus --tokenizer corpus/tokenizer.json
              --batch 8 --max-len 128 --seed 42
              --lr 1.5e-4 --warmup 100 --total-steps 25000
              --runtime-profile config/lumen_cpu_profile.json
              --threads 4 --interop-threads 2
              --log-every 100 --checkpoint-every 1000
              --parameter-check-every 100
              --ckpt-dir checkpoints/lumen
          )
          ARGS+=(--resume "checkpoints/lumen/step_20000.pt")
          python -m train.train "${ARGS[@]}" 2>&1 | tee "logs/lumen-block-5.log"
          CURRENT="checkpoints/lumen/step_25000.pt"
          test -s "$CURRENT"
          python - "$CURRENT" "25000" "checkpoints/lumen/step_20000.pt" <<'PY'
          import sys,torch,json
          from pathlib import Path
          path,target,previous=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          s=torch.load(path,map_location="cpu",weights_only=False)
          experiment=json.loads(Path("experiment_manifest.json").read_text())
          assert s["data_sha256"]==experiment["corpus_data_sha256"]
          assert s["tokenizer_sha256"]==experiment["tokenizer_sha256"]
          assert int(s["step"])==target
          assert s.get("optimizer") and s.get("scheduler") and s.get("rng")
          assert int(s["params"])==12022016
          assert s["architecture_id"]=="ronin_lumen_v3_3_neuroplasticity"
          assert s["v32_ze"] is True
          assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          if previous:
