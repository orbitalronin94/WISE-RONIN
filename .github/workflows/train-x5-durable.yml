name: WISE-LUMEN x5 + Transformer x5 — durable 1k checkpoints (V4)

on:
  workflow_dispatch:
    inputs:
      freeze_run_id:
        description: "Authorized V4 freeze run ID"
        required: true
        type: string
        default: "45580013610"
  push:
    paths:
      - ".github/workflows/train-x5-durable.yml"
      - ".github/workflows/reusable-x5-checkpoint-chunk.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: wise-x5-durable-v4
  cancel-in-progress: false

env:
  FREEZE_RUN_ID: ${{ inputs.freeze_run_id || '45580013610' }}

jobs:
  prepare-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-${{ env.FREEZE_RUN_ID }}
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authorization, every shard hash, and tokenizer
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("corpus")
          manifest_path=root/"manifest.json"
          m=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          assert m.get("tokenizer_sha256")=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==m["tokenizer_sha256"]
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==shard["bytes"]<=104857600
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"], shard["file"]
              total+=shard["rows"]
          assert total==m["total_rows"]
          print(f"V4 VERIFIED rows={total} tokens={m['token_count_without_special_tokens']} shards={len(m['shards'])} tokenizer={m['tokenizer_sha256']}")
          PY
      - name: Publish verified V4 inputs for all resumable chunks
        uses: actions/upload-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

  lumen-1000:
    needs: prepare-v4
    uses: ./.github/workflows/reusable-x5-checkpoint-chunk.yml
    with:
      model: "lumen"
      start_step: 0
      freeze_run_id: ${{ inputs.freeze_run_id || '45580013610' }}
      previous_artifact: ""
    secrets: inherit

  lumen-2000:
    needs: lumen-1000
    uses: ./.github/workflows/reusable-x5-checkpoint-chunk.yml
