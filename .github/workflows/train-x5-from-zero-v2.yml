name: WISE-RONIN paired x5 — 1000-step chained blocks, 100-step telemetry

on:
  workflow_dispatch:
    inputs:
      freeze_run_id:
        description: "Authorized frozen V4 corpus run"
        required: true
        type: string
        default: "45580013610"
  push:
    paths:
      - ".github/workflows/train-x5-from-zero-v2.yml"
      - ".github/workflows/reusable-x5-chunk-1000.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: wise-x5-from-zero-v4
  cancel-in-progress: true

jobs:
  prepare-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FREEZE_RUN_ID: ${{ inputs.freeze_run_id || '45580013610' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Download frozen V4 corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-${{ env.FREEZE_RUN_ID }}
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify V4 authorization, all shards and tokenizer
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("corpus")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26d3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==shard["bytes"],shard["file"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"],shard["file"]
              total+=shard["rows"]
          assert total==m["total_rows"]
          assert len(m["shards"])==24
          print(f"V4 VERIFIED rows={total} shards={len(m['shards'])} tokenizer={expected}")
          PY
      - name: Publish verified V4 input for this run
        uses: actions/upload-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Seed immutable corpus cache for every chained block
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: wise-v4-corpus-${{ env.FREEZE_RUN_ID }}

  preflight:
    needs: prepare-v4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_WAIT_POLICY: "PASSIVE"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore prepared V4 cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: wise-v4-corpus-${{ inputs.freeze_run_id || '45580013610' }}
      - name: Download V4 only if cache is unavailable
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Real CLI smoke test and exact checkpoint resume
        shell: bash
        run: |
          set -euo pipefail
          python -m train.train --help >/dev/null
          python -m train.transformer_baseline --help >/dev/null
          mkdir -p preflight/lumen preflight/transformer
          LUMEN=(--data corpus --tokenizer corpus/tokenizer.json --batch 8 --max-len 128
            --seed 42 --lr 1.5e-4 --warmup 100 --total-steps 25000
            --checkpoint-every 1 --parameter-check-every 1 --threads 4 --interop-threads 2
            --ckpt-dir preflight/lumen --phase 1 --pilot-all-rows --v32-ze
            --model-config config/lumen_wise_x5.json
            --runtime-profile config/lumen_cpu_profile.json)
          python -m train.train --steps 2 --log-every 1 "${LUMEN[@]}"
          test -s preflight/lumen/step_2.pt
          python -m train.train --steps 1 --log-every 1 "${LUMEN[@]}" --resume preflight/lumen/step_2.pt
          test -s preflight/lumen/step_3.pt

          TRANSFORMER=(--data corpus --tokenizer corpus/tokenizer.json --batch 8 --max-len 128
            --seed 42 --lr 1.5e-4 --warmup 100 --total-steps 25000
            --checkpoint-every 1 --parameter-check-every 1 --threads 4 --interop-threads 2
            --disable-mkldnn --disable-foreach --cpu-affinity
            --ckpt-dir preflight/transformer --model-dim 488 --heads 8 --ff-width 1464)
          python -m train.transformer_baseline --steps 2 "${TRANSFORMER[@]}"
          test -s preflight/transformer/step_2.pt
          python -m train.transformer_baseline --steps 1 "${TRANSFORMER[@]}" --resume preflight/transformer/step_2.pt
          test -s preflight/transformer/step_3.pt

          python - <<'PY'
          import torch
          for p,arch,n in [
            ("preflight/lumen/step_3.pt","ronin_lumen_v3_3_neuroplasticity",12022016),
            ("preflight/transformer/step_3.pt","decoder_transformer_4l_d488_h8_ff1464_tied_v1",11611472),
          ]:
              s=torch.load(p,map_location="cpu",weights_only=False)
              assert int(s["step"])==3 and s["architecture_id"]==arch and int(s["params"])==n
              assert all(s.get(k) is not None for k in ("model","optimizer","scheduler","rng","data_sha256","tokenizer_sha256"))
              assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26d3fefe"
              assert int(s["seed"])==42 and int(s["training_config"]["total_steps"])==25000
              print("PREFLIGHT_PASS",arch,"step=3","exact_resume=True")
          PY
      - name: Publish preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: wise-x5-preflight-evidence
          path: preflight/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

