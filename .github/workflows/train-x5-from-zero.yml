name: WISE-RONIN paired x5 — fresh start, preflight, exact 500-step recovery

on:
  workflow_dispatch:
    inputs:
      freeze_run_id:
        description: "Authorized frozen V4 corpus run"
        required: true
        type: string
        default: "45580013610"
  push:
    paths:
      - ".github/workflows/train-x5-from-zero.yml"
      - ".github/workflows/reusable-x5-chunk-500.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: wise-x5-from-zero-v4
  cancel-in-progress: false

jobs:
  prepare-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FREEZE_RUN_ID: ${{ inputs.freeze_run_id || '45580013610' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen V4 corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-corpus-v4-frozen-${{ env.FREEZE_RUN_ID }}
          path: corpus
          repository: ${{ github.repository }}
          run-id: ${{ env.FREEZE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify authorization, every shard, and tokenizer
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("corpus")
          manifest_path=root/"manifest.json"
          m=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert m.get("version")=="v4.0.0"
          assert m.get("status")=="FROZEN_TRAINABLE"
          assert m.get("training_authorized") is True
          expected="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
          assert m.get("tokenizer_sha256")==expected
          assert hashlib.sha256((root/"tokenizer.json").read_bytes()).hexdigest()==expected
          total=0
          for shard in m["shards"]:
              p=root/shard["file"]
              assert p.is_file() and p.stat().st_size==shard["bytes"], shard["file"]
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==shard["sha256"], shard["file"]
              total+=shard["rows"]
          assert total==m["total_rows"]
          assert len(m["shards"])==24, len(m["shards"])
          print(f"V4 VERIFIED rows={total} shards={len(m['shards'])} tokens={m['token_count_without_special_tokens']} tokenizer={expected}")
          PY
      - name: Publish frozen V4 inputs for this run
        uses: actions/upload-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Seed reusable immutable corpus cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: wise-v4-corpus-${{ env.FREEZE_RUN_ID }}

  preflight:
    needs: prepare-v4
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OMP_DYNAMIC: "FALSE"
      MKL_DYNAMIC: "FALSE"
      OMP_WAIT_POLICY: "PASSIVE"
      PYTHONUNBUFFERED: "1"
      EXPECTED_TOKENIZER_SHA256: "d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore frozen V4 cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: wise-v4-corpus-${{ inputs.freeze_run_id || '45580013610' }}
      - name: Download V4 inputs if cache is unavailable
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: v4-corpus-inputs
          path: corpus
      - name: Install CPU training runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy tqdm
      - name: Verify real CLI, forward, backward, optimizer, scheduler, checkpoint, and exact resume for both models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight/lumen preflight/transformer
          python -m train.train --help >/dev/null
          python -m train.transformer_baseline --help >/dev/null

          LUMEN_COMMON=(--data corpus --tokenizer corpus/tokenizer.json
            --batch 8 --max-len 128 --seed 42 --lr 1.5e-4
            --warmup 100 --total-steps 25000 --checkpoint-every 1
            --parameter-check-every 1 --threads 4 --interop-threads 2
            --ckpt-dir preflight/lumen --phase 1 --pilot-all-rows --v32-ze
            --model-config config/lumen_wise_x5.json
            --runtime-profile config/lumen_cpu_profile.json)
          python -m train.train --steps 2 --log-every 100 "${LUMEN_COMMON[@]}"
          test -s preflight/lumen/step_2.pt
          python -m train.train --steps 1 --log-every 100 "${LUMEN_COMMON[@]}" --resume preflight/lumen/step_2.pt
          test -s preflight/lumen/step_3.pt

          TRANSFORMER_COMMON=(--data corpus --tokenizer corpus/tokenizer.json
            --batch 8 --max-len 128 --seed 42 --lr 1.5e-4
            --warmup 100 --total-steps 25000 --checkpoint-every 1
            --parameter-check-every 1 --threads 4 --interop-threads 2
            --disable-mkldnn --disable-foreach --cpu-affinity
            --ckpt-dir preflight/transformer
            --model-dim 488 --heads 8 --ff-width 1464)
          python -m train.transformer_baseline --steps 2 "${TRANSFORMER_COMMON[@]}"
          test -s preflight/transformer/step_2.pt
          python -m train.transformer_baseline --steps 1 "${TRANSFORMER_COMMON[@]}" --resume preflight/transformer/step_2.pt
          test -s preflight/transformer/step_3.pt

          python - <<'PY'
          import torch
          checks=[
            ("preflight/lumen/step_3.pt","ronin_lumen_v3_3_neuroplasticity",12022016,True),
            ("preflight/transformer/step_3.pt","decoder_transformer_4l_d488_h8_ff1464_tied_v1",11611472,False),
          ]
          for path,arch,params,is_lumen in checks:
              s=torch.load(path,map_location="cpu",weights_only=False)
              assert int(s["step"])==3
              assert s["architecture_id"]==arch
              assert int(s["params"])==params
              assert all(k in s and s[k] is not None for k in ("model","optimizer","scheduler","rng","data_sha256","tokenizer_sha256"))
              assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
              assert int(s["seed"])==42
              assert int(s["training_config"]["total_steps"])==25000
              if is_lumen:
                  assert s["v32_ze"] is True and s["pilot_all_rows"] is True
              print(f"PREFLIGHT_PASS {arch} step=3 params={params} exact_resume=True")
          PY
      - name: Publish preflight evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wise-x5-preflight-evidence
          path: preflight/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

