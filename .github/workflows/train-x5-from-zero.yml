  paired-holdout:
    needs: [lumen-25000, transformer-25000]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install paired evaluation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers numpy scipy
      - name: Download final exact-step LUMEN checkpoint
        uses: actions/download-artifact@v4
        with:
          name: lumen-x5-step-25000
          path: checkpoints/lumen
      - name: Download final exact-step Transformer checkpoint
        uses: actions/download-artifact@v4
        with:
          name: transformer-x5-step-25000
          path: checkpoints/transformer
      - name: Download frozen paired holdout and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: paired-v32-inputs-500000-45480785478
          path: eval_inputs
          repository: ${{ github.repository }}
          run-id: 45480785478
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify final checkpoint identity and step counts
        run: |
          python - <<'PY'
          import torch
          checks=[
            ("checkpoints/lumen/step_25000.pt","ronin_lumen_v3_3_neuroplasticity",12022016),
            ("checkpoints/transformer/step_25000.pt","decoder_transformer_4l_d488_h8_ff1464_tied_v1",11611472),
          ]
          for path,arch,params in checks:
              s=torch.load(path,map_location="cpu",weights_only=False)
              assert int(s["step"])==25000
              assert s["architecture_id"]==arch
              assert int(s["params"])==params
              assert s["tokenizer_sha256"]=="d7869c11809a28085d5156638086c4833a1dcbacfda4a60b69ec71e26ed3fefe"
              print(f"FINAL_CHECKPOINT_VERIFIED {arch} step=25000 params={params}")
          PY
      - name: Evaluate both models on the same untouched holdout
        run: |
          python scripts/evaluate_lumen_wise_x5_holdout.py \
            --holdout eval_inputs/eval/holdout_multiple_choice.jsonl \
            --tokenizer eval_inputs/artifacts/tokenizer.json \
            --lumen checkpoints/lumen/step_25000.pt \
            --transformer checkpoints/transformer/step_25000.pt \
            --lumen-config config/lumen_wise_x5.json \
            --transformer-model-dim 488 --transformer-heads 8 --transformer-ff-width 1464 \
            --expected-lumen-step 25000 --expected-transformer-step 25000 \
            --expected-holdout-sha256 e21ae7e292d603f1b8073d8114572c92fb0c6448bfaed9066413ddce09e5a359 \
            --out results/lumen-wise-x5-holdout.json
          python scripts/audit_paired_holdout.py \
            --input results/lumen-wise-x5-holdout.json \
            --output results/lumen-wise-x5-holdout-audit.json
      - name: Publish paired holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-x5-paired-holdout-report
          path: results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
