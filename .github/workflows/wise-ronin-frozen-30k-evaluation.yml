name: WISE-RONIN — Frozen step-30000 correction evaluation (inference only)

on:
  push:
    branches: [experiment/correction-before-30k]
    paths:
      - '.github/workflows/wise-ronin-frozen-30k-evaluation.yml'
      - 'evaluate_wise_ronin_correction.py'
      - 'build_wise_ronin_correction.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: wise-ronin-frozen-30k-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download frozen step-30000 checkpoint and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-balanced-80k-two-epochs
          run-id: 44721903295
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers
      - name: Build leakage-aware correction holdout
        run: python build_wise_ronin_correction.py
      - name: Verify frozen checkpoint and tokenizer
        run: |
          python - <<'PY'
          import torch
          from pathlib import Path
          from tokenizers import Tokenizer
          ckpt_path=Path("artifacts/wise_ronin_step_30000.pt")
          tok_path=Path("artifacts/tokenizer-wise-ronin.json")
          if not ckpt_path.is_file() or not tok_path.is_file():
              raise SystemExit(f"Missing checkpoint/tokenizer: {list(Path('artifacts').glob('*'))}")
          ckpt=torch.load(ckpt_path,map_location="cpu",weights_only=False)
          tok=Tokenizer.from_file(str(tok_path))
          if ckpt.get("step") != 30000 or ckpt["config"]["vocab"] != tok.get_vocab_size():
              raise SystemExit("Frozen step-30000 checkpoint/tokenizer mismatch")
          print(f"Frozen checkpoint verified: step={ckpt['step']}, vocab={tok.get_vocab_size()}")
          PY
      - name: Greedy baseline evaluation
        run: |
          python evaluate_wise_ronin_correction.py \\
            --checkpoint artifacts/wise_ronin_step_30000.pt \\
            --tokenizer artifacts/tokenizer-wise-ronin.json \\
            --holdout data/correction/correction_holdout.jsonl \\
            --temperature 0 \\
            --max-new-tokens 64 \\
            --seed 20261120 \\
            --output-dir artifacts/correction-eval-greedy
      - name: Sampling baseline evaluation
        run: |
          python evaluate_wise_ronin_correction.py \\
            --checkpoint artifacts/wise_ronin_step_30000.pt \\
            --tokenizer artifacts/tokenizer-wise-ronin.json \\
            --holdout data/correction/correction_holdout.jsonl \\
            --temperature 0.8 \\
            --top-p 0.9 \\
            --max-new-tokens 64 \\
            --seed 20261120 \\
            --output-dir artifacts/correction-eval-sampling
      - name: Upload frozen baseline reports and generations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-ronin-frozen-30k-correction-baseline
          path: |
            artifacts/correction-eval-greedy/
            artifacts/correction-eval-sampling/
            data/correction/correction_report.json
          if-no-files-found: warn
          retention-days: 30
