name: WISE-RONIN — 10k continuation on cleaned SFT corpus from 40k

on:
  pull_request:
    branches:
      - feat/unified-master-dataset
    paths:
      - ".github/workflows/wise-ronin-full-corpus-10k.yml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: wise-ronin-full-corpus-10k
  cancel-in-progress: false

jobs:
  train:
    name: Continue step 40000 to 50000 on cleaned ~81k corpus (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout training code and frozen holdout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download validated cleaned master corpus
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-clean-master-dataset
          run-id: 44788464404
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: dataset-source

      - name: Download frozen step-40000 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-correction-sft-step-40000
          run-id: 44741418950
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: parent-checkpoint

      - name: Download original tokenizer from step-10000 artifact
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-first-10k-sft
          run-id: 44709299157
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: tokenizer-source

      - name: Restore exact checkpoint and tokenizer paths
        run: |
          set -euo pipefail
          CHECKPOINT="$(find parent-checkpoint -type f -name 'wise_ronin_step_40000.pt' -print -quit)"
          TOKENIZER="$(find tokenizer-source -type f -name 'tokenizer-wise-ronin.json' -print -quit)"
          test -n "$CHECKPOINT"
          test -n "$TOKENIZER"
          mkdir -p artifacts
          cp "$CHECKPOINT" artifacts/wise_ronin_step_40000.pt
          cp "$TOKENIZER" artifacts/tokenizer-wise-ronin.json
          test -s artifacts/wise_ronin_step_40000.pt
          test -s artifacts/tokenizer-wise-ronin.json
          find dataset-source -maxdepth 3 -type f -print
          echo "Checkpoint: $CHECKPOINT"
          echo "Tokenizer: $TOKENIZER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers

      - name: Validate full corpus, frozen parent, tokenizer and untouched holdout
        run: |
          python - <<'PY'
          import json, torch
          from pathlib import Path
          from tokenizers import Tokenizer

          corpus = Path("dataset-source/merged/wise_ronin_master.jsonl")
          report_path = Path("dataset-source/merged/wise_ronin_master_report.json")
          checkpoint = Path("artifacts/wise_ronin_step_40000.pt")
          tokenizer_path = Path("artifacts/tokenizer-wise-ronin.json")
          holdout = Path("holdout_wise_ronin_500.jsonl")
          for p in (corpus, report_path, checkpoint, tokenizer_path, holdout):
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty required file: {p}")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not (80900 <= report.get("master_rows", 0) < 81000):
              raise SystemExit(f"Unexpected cleaned master row count: {report.get('master_rows')}")
          rows = 0
          with corpus.open(encoding="utf-8") as f:
              for line_no, line in enumerate(f, 1):
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if not row.get("user") or not row.get("assistant"):
                      raise SystemExit(f"{corpus}:{line_no}: missing user/assistant")
                  if not row.get("source_dataset") or not row.get("source_line"):
                      raise SystemExit(f"{corpus}:{line_no}: missing provenance")
                  rows += 1
          if rows != report["master_rows"]:
              raise SystemExit(f"Expected {report['master_rows']} clean train rows, got {rows}")

          ckpt = torch.load(checkpoint, map_location="cpu", weights_only=False)
          tok = Tokenizer.from_file(str(tokenizer_path))
          if ckpt.get("step") != 40000:
              raise SystemExit(f"Expected step-40000 parent, got {ckpt.get('step')}")
          if ckpt.get("config", {}).get("vocab") != tok.get_vocab_size():
              raise SystemExit("Parent checkpoint/tokenizer vocabulary mismatch")
          if tok.token_to_id("<|pad|>") is None or tok.token_to_id("<|end|>") is None:
              raise SystemExit("Tokenizer is missing required special tokens")

          holdout_rows = [json.loads(x) for x in holdout.read_text(encoding="utf-8").splitlines() if x.strip()]
          if len(holdout_rows) != 500:
              raise SystemExit(f"Expected untouched 500-case holdout, got {len(holdout_rows)}")
          if any(not x.get("user") or not x.get("pass_si") or not x.get("fail_si") for x in holdout_rows):
              raise SystemExit("Malformed holdout row")

          print(f"Full corpus: {rows:,} rows; {corpus.stat().st_size:,} bytes")
          print(f"Source composition: {json.dumps(report.get('input_rows_by_source'), ensure_ascii=False)}")
          print(f"Parent checkpoint: step={ckpt['step']}; vocab={tok.get_vocab_size()}; config={ckpt['config']}")
          print(f"Holdout: {len(holdout_rows)} rows; kept separate")
          PY

      - name: Compile training and evaluation entrypoints
        run: python -m py_compile train_wise_ronin.py evaluate_wise_ronin.py

      - name: Baseline evaluation on untouched 500-case holdout (step 40000)
        run: |
          python evaluate_wise_ronin.py \
            --checkpoint artifacts/wise_ronin_step_40000.pt \
            --tokenizer artifacts/tokenizer-wise-ronin.json \
            --holdout holdout_wise_ronin_500.jsonl \
            --max-new-tokens 128 \
            --minimum-generation-tokens 1 \
            --output-dir artifacts/baseline-40k-full-corpus

      - name: Train 10000 additional SFT updates on the cleaned master only
        run: |
          python train_wise_ronin.py \
            --data dataset-source/merged/wise_ronin_master.jsonl \
            --steps 50000 \
            --batch-size 4 \
            --max-seq-len 512 \
            --lr 0.00001 \
            --warmup-steps 100 \
            --save-every 1000 \
            --seed 20261120 \
            --tokenizer artifacts/tokenizer-wise-ronin.json \
            --reuse-tokenizer \
            --resume artifacts/wise_ronin_step_40000.pt \
            --output-dir artifacts/full-corpus-sft

      - name: Verify final step-50000 checkpoint
        run: |
          python - <<'PY'
          import torch
          from pathlib import Path
          p = Path("artifacts/full-corpus-sft/wise_ronin_step_50000.pt")
          if not p.is_file():
              raise SystemExit(f"Final checkpoint missing: {p}")
          ckpt = torch.load(p, map_location="cpu", weights_only=False)
          if ckpt.get("step") != 50000:
              raise SystemExit(f"Unexpected final step: {ckpt.get('step')}")
          print(f"Verified final checkpoint: step={ckpt['step']}")
          PY

      - name: Evaluate step 50000 on the same untouched 500-case holdout
        run: |
          python evaluate_wise_ronin.py \
            --checkpoint artifacts/full-corpus-sft/wise_ronin_step_50000.pt \
            --tokenizer artifacts/tokenizer-wise-ronin.json \
            --holdout holdout_wise_ronin_500.jsonl \
            --max-new-tokens 128 \
            --minimum-generation-tokens 1 \
            --output-dir artifacts/holdout-50k-full-corpus

      - name: Upload full-corpus checkpoint series, tokenizer and comparable evaluations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-ronin-full-corpus-step-50000
          path: |
            artifacts/full-corpus-sft/
            artifacts/tokenizer-wise-ronin.json
            artifacts/baseline-40k-full-corpus/
            artifacts/holdout-50k-full-corpus/
            dataset-source/merged/wise_ronin_master_report.json
          if-no-files-found: warn
          retention-days: 30
