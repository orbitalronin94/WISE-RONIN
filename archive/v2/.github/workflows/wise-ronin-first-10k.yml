name: WISE-RONIN — Additional 10k SFT on expanded corpus

on:
  push:
    paths:
      - '.github/workflows/wise-ronin-first-10k.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: wise-ronin-additional-10k
  cancel-in-progress: false

jobs:
  train:
    name: Resume WISE-RONIN to step 20000 on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download exact step-10000 checkpoint and tokenizer
        uses: actions/download-artifact@v4
        with:
          name: wise-ronin-first-10k-sft
          run-id: 44709299157
          github-token: \${{ secrets.GITHUB_TOKEN }}
          repository: \${{ github.repository }}
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install tokenizers

      - name: Validate expanded corpus, checkpoint, tokenizer and isolated holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          corpus = Path("data/expanded/wise_ronin_expanded.jsonl")
          checkpoint = Path("artifacts/wise_ronin_step_10000.pt")
          tokenizer = Path("artifacts/tokenizer-wise-ronin.json")
          holdout = Path("holdout_wise_ronin_500.jsonl")
          for path in (corpus, checkpoint, tokenizer, holdout):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty required file: {path}")

          count = 0
          with corpus.open(encoding="utf-8") as f:
              for line_no, line in enumerate(f, 1):
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if not row.get("user") or not row.get("assistant"):
                      raise SystemExit(f"{corpus}:{line_no}: missing user/assistant")
                  count += 1
          if count != 147627:
              raise SystemExit(f"Expected 147627 expanded rows, got {count}")

          holdout_rows = [json.loads(x) for x in holdout.read_text(encoding="utf-8").splitlines() if x.strip()]
          if len(holdout_rows) != 500:
              raise SystemExit(f"Expected 500 holdout rows, got {len(holdout_rows)}")
          if any(not x.get("user") or not x.get("pass_si") or not x.get("fail_si") for x in holdout_rows):
              raise SystemExit("Malformed holdout row")

          print(f"Expanded corpus: {count:,} rows ({corpus.stat().st_size:,} bytes)")
          print(f"Resume checkpoint: {checkpoint.stat().st_size:,} bytes")
          print(f"Existing tokenizer: {tokenizer.stat().st_size:,} bytes")
          print(f"Holdout: {len(holdout_rows)} rows; kept separate")
          PY

      - name: Compile Python entrypoints
        run: python -m py_compile train_wise_ronin.py evaluate_wise_ronin.py

      - name: Verify checkpoint and tokenizer compatibility
        run: |
          python - <<'PY'
          import torch
          from tokenizers import Tokenizer
          ckpt = torch.load("artifacts/wise_ronin_step_10000.pt", map_location="cpu", weights_only=False)
          tok = Tokenizer.from_file("artifacts/tokenizer-wise-ronin.json")
          if ckpt.get("step") != 10000:
              raise SystemExit(f"Expected checkpoint step 10000, got {ckpt.get('step')}")
          if ckpt.get("config", {}).get("vocab") != tok.get_vocab_size():
              raise SystemExit("Checkpoint vocabulary does not match preserved tokenizer")
          print(f"Checkpoint step={ckpt['step']}; vocab={tok.get_vocab_size()}; config={ckpt['config']}")
          PY

      - name: Train 10000 additional updates (global step 10000 to 20000)
        run: |
          python train_wise_ronin.py \
            --data data/expanded/wise_ronin_expanded.jsonl \
            --steps 20000 \
            --batch-size 4 \
            --max-seq-len 512 \
            --lr 0.00003 \
            --warmup-steps 0 \
            --save-every 1000 \
            --seed 42 \
            --tokenizer artifacts/tokenizer-wise-ronin.json \
            --reuse-tokenizer \
            --resume artifacts/wise_ronin_step_10000.pt \
            --output-dir artifacts

      - name: Evaluate the untouched 500-case holdout
        run: |
          python evaluate_wise_ronin.py \
            --checkpoint artifacts/wise_ronin_step_20000.pt \
            --tokenizer artifacts/tokenizer-wise-ronin.json \
            --holdout holdout_wise_ronin_500.jsonl \
            --max-new-tokens 32 \
            --output-dir artifacts

      - name: Upload resumed checkpoints, tokenizer, training summary and holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-ronin-expanded-20k-sft
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
